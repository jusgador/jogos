/* =====================================================================
   1. UTILITÁRIOS
   ===================================================================== */
const TAU = Math.PI * 2;
const rand = (a, b) => a + Math.random() * (b - a);
const randi = (a, b) => Math.floor(a + Math.random() * (b - a + 1));
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const d2 = (ax, ay, bx, by) => { const dx = ax - bx, dy = ay - by; return dx * dx + dy * dy; };
const angTo = (ax, ay, bx, by) => Math.atan2(by - ay, bx - ax);
const pick = (a, r = Math.random) => a[Math.floor(r() * a.length)];
function wrapAng(a) { while (a > Math.PI) a -= TAU; while (a < -Math.PI) a += TAU; return a; }
function turnToward(a, target, maxStep) { const d = wrapAng(target - a); return a + clamp(d, -maxStep, maxStep); }
// gerador pseudoaleatório com semente (fases sempre iguais, fáceis de aprender)
function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
// escolhe uma chave de um objeto {chave: peso}
function pickW(obj, r = Math.random) {
  let tot = 0; for (const k in obj) tot += obj[k];
  let x = r() * tot;
  for (const k in obj) { x -= obj[k]; if (x <= 0) return k; }
  return Object.keys(obj)[0];
}
function shuffle(a, r = Math.random) {
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}
const fmt = n => Math.floor(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g, '.');

   2. SALVAMENTO (localStorage)

   ===================================================================== */

function loadSave() {
  try {
    const s = JSON.parse(localStorage.getItem(SAVE_KEY) || 'null');
    if (s && typeof s === 'object') {
      Object.assign(save, s);
      save.up = Object.assign({}, s.up || {});
      for (const k of ['stars', 'best']) {
        const a = Array.isArray(s[k]) ? s[k].slice(0, 8) : [];
        while (a.length < 8) a.push(0);
        save[k] = a;
      }
      if (!DIFFS[save.diff]) save.diff = 'normal';
    }
  } catch (e) { /* armazenamento indisponível: segue sem salvar */ }
}
function writeSave() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch (e) {} }
const upLvl = id => save.up[id] || 0;

const AU = {
  ctx: null, master: null, sfxG: null, musG: null, noiseBuf: null, last: {}, coinStep: 0,
  init() {
    if (this.ctx) { if (this.ctx.state === 'suspended') this.ctx.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    const c = this.ctx = new AC();
    this.master = c.createGain(); this.master.gain.value = save.muted ? 0 : 0.8; this.master.connect(c.destination);
    this.sfxG = c.createGain(); this.sfxG.gain.value = 0.5; this.sfxG.connect(this.master);
    const lp = c.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 3200; lp.connect(this.master);
    this.musG = c.createGain(); this.musG.gain.value = 0.26; this.musG.connect(lp);
    const len = c.sampleRate; const buf = c.createBuffer(1, len, c.sampleRate); const d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    this.noiseBuf = buf;
    if (MUSIC.want) MUSIC.play(MUSIC.want, MUSIC.wantTr, true);
  },
  setMuted(m) { save.muted = m; writeSave(); if (this.master) this.master.gain.setTargetAtTime(m ? 0 : 0.8, this.ctx.currentTime, 0.05); },
  ok(key, ms) { const now = performance.now(); if (this.last[key] && now - this.last[key] < ms) return false; this.last[key] = now; return true; },
  tone(f, dur, type = 'square', vol = 0.2, f2 = 0, delay = 0, dest = null) {
    const c = this.ctx; if (!c || save.muted) return;
    const t = c.currentTime + delay, o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t);
    if (f2) o.frequency.exponentialRampToValueAtTime(Math.max(20, f2), t + dur);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0008, t + dur);
    o.connect(g); g.connect(dest || this.sfxG); o.start(t); o.stop(t + dur + 0.03);
  },
  noise(dur, vol = 0.3, fFrom = 3000, fTo = 200, delay = 0, type = 'lowpass', dest = null) {
    const c = this.ctx; if (!c || save.muted) return;
    const t = c.currentTime + delay, s = c.createBufferSource(); s.buffer = this.noiseBuf;
    const f = c.createBiquadFilter(); f.type = type;
    f.frequency.setValueAtTime(fFrom, t); f.frequency.exponentialRampToValueAtTime(Math.max(30, fTo), t + dur);
    const g = c.createGain(); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    s.connect(f); f.connect(g); g.connect(dest || this.sfxG); s.start(t, Math.random() * 0.5); s.stop(t + dur + 0.05);
  },
};

// ---- Trilha musical: sequenciador simples com agendamento antecipado ----
function bassLine(roots, pat) { const out = []; for (const r of roots) for (const o of pat) out.push(o === null ? 0 : r + o); return out; }
const BP_STD = [0, null, 0, null, 12, null, 0, null, 0, null, 0, null, 12, null, 7, null];
const BP_DRIVE = [0, null, 0, 12, 0, null, 0, 12, 0, null, 0, 12, 0, null, 7, 12];
const BP_SOFT = [0, null, null, null, 7, null, null, null, 12, null, null, null, 7, null, null, null];
const MUSIC = {
  tracks: {
    stage: { bpm: 128, lead: 'square', bass: 'triangle', drums: true,
      notes: [69,0,72,0,76,0,74,72, 0,0,69,0,72,0,74,0,   72,0,0,69,0,0,65,0, 69,0,72,0,77,0,76,0,
              76,0,74,0,72,0,67,0, 72,0,76,0,79,0,0,0,    79,0,77,0,74,0,71,0, 74,0,0,71,67,0,0,0],
      bassN: bassLine([45, 41, 48, 43], BP_STD) },
    boss: { bpm: 150, lead: 'sawtooth', bass: 'square', drums: true,
      notes: [62,0,65,0,69,0,65,0, 62,0,65,0,70,0,69,0,   70,0,69,0,65,0,62,0, 65,0,0,0,58,0,0,0,
              67,0,70,0,74,0,70,0, 67,0,70,0,75,0,74,0,   73,0,69,0,64,0,61,0, 64,0,69,0,73,0,76,0],
      bassN: bassLine([38, 34, 31, 33], BP_DRIVE) },
    menu: { bpm: 100, lead: 'triangle', bass: 'triangle', drums: false,
      notes: [72,0,76,0,79,0,76,0, 72,0,76,0,79,0,84,0,   69,0,72,0,76,0,72,0, 69,0,72,0,76,0,81,0,
              65,0,69,0,72,0,69,0, 77,0,76,0,72,0,69,0,   67,0,71,0,74,0,71,0, 79,0,77,0,74,0,71,0],
      bassN: bassLine([48, 45, 41, 43], BP_SOFT) },
  },
  cur: null, tr: 0, step: 0, next: 0, timer: null, want: null, wantTr: 0,
  play(name, tr = 0, force = false) {
    this.want = name; this.wantTr = tr;
    if (!AU.ctx) return;
    if (!force && this.cur === name && this.tr === tr) return;
    this.cur = name; this.tr = tr; this.step = 0; this.next = AU.ctx.currentTime + 0.08;
    if (!this.timer) this.timer = setInterval(() => this.tick(), 25);
  },
  stop() { this.cur = null; this.want = null; },
  note(m, t, dur, type, vol) {
    const c = AU.ctx, o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.value = 440 * Math.pow(2, (m - 69) / 12);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(AU.musG); o.start(t); o.stop(t + dur + 0.02);
  },
  tick() {
    const c = AU.ctx; if (!c || !this.cur || save.muted) return;
    const T = this.tracks[this.cur], sd = 60 / T.bpm / 4;
    if (this.next < c.currentTime - 0.2) this.next = c.currentTime + 0.05; // voltou do segundo plano
    while (this.next < c.currentTime + 0.12) {
      const i = this.step, t = this.next, L = T.notes[i], B = T.bassN[i];
      if (L) this.note(L + this.tr, t, sd * 1.7, T.lead, T.lead === 'sawtooth' ? 0.05 : 0.07);
      if (B) this.note(B + this.tr, t, sd * 1.8, T.bass, T.bass === 'square' ? 0.06 : 0.16);
      if (T.drums) {
        if (i % 8 === 0) { const o = c.createOscillator(), g = c.createGain(); o.frequency.setValueAtTime(150, t);
          o.frequency.exponentialRampToValueAtTime(40, t + 0.14); g.gain.setValueAtTime(0.45, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.16);
          o.connect(g); g.connect(AU.musG); o.start(t); o.stop(t + 0.18); }
        if (i % 8 === 4) this.hit(t, 0.12, 0.22, 1800);
        if (i % 2 === 0) this.hit(t, 0.03, 0.07, 7000);
      }
      this.next += sd; this.step = (this.step + 1) % T.notes.length;
    }
  },
  hit(t, dur, vol, hp) {
    const c = AU.ctx, s = c.createBufferSource(); s.buffer = AU.noiseBuf;
    const f = c.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = hp;
    const g = c.createGain(); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    s.connect(f); f.connect(g); g.connect(AU.musG); s.start(t, Math.random() * 0.5); s.stop(t + dur + 0.02);
  },
};

const cvs = document.getElementById('game');
const ctx = cvs.getContext('2d');
let W = 480, H = 800, SCALE = 1, DPR = 1;
function resize() {
  const iw = window.innerWidth, ih = window.innerHeight;
  W = 480;
  H = Math.round(clamp(W * ih / iw, 720, 1000));
  SCALE = Math.min(iw / W, ih / H);
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  cvs.style.width = Math.floor(W * SCALE) + 'px';
  cvs.style.height = Math.floor(H * SCALE) + 'px';
  cvs.width = Math.floor(W * SCALE * DPR);
  cvs.height = Math.floor(H * SCALE * DPR);
}
window.addEventListener('resize', resize);

const ptr = { id: null, lx: 0, ly: 0, x: -1, y: -1 };

cvs.addEventListener('pointerdown', e => {

  const d = document, el = d.documentElement;

    }).catch(() => {});

/* =====================================================================
   6. POOLS DE OBJETOS (sem alocação durante o jogo)
   ===================================================================== */
function makePool(n, make) {
  const items = new Array(n);
  for (let i = 0; i < n; i++) { items[i] = make(); items[i].on = false; }
  let cur = 0;
  return {
    items,
    get() {
      for (let i = 0; i < n; i++) {
        const k = (cur + i) % n, o = items[k];
        if (!o.on) { cur = (k + 1) % n; o.on = true; return o; }
      }
      return null;
    },
    clear() { for (const o of items) o.on = false; },
  };
}
const PB = makePool(500, () => ({ x: 0, y: 0, vx: 0, vy: 0, dmg: 1, kind: 0, r: 3, life: 0, pierce: false, hits: [], tgt: null, rt: 0, ang: 0 }));
const EB = makePool(700, () => ({ x: 0, y: 0, vx: 0, vy: 0, r: 4, kind: 0, t: 0 }));
const PT = makePool(1800, () => ({ x: 0, y: 0, vx: 0, vy: 0, life: 0, max: 1, size: 1, grow: 0, color: '#fff', kind: 0, ground: false, rot: 0, vr: 0, drag: 1 }));

/* =====================================================================
   7. DESENHO VETORIAL: AUXILIARES E SPRITES EM CACHE
   Sprites são desenhados uma vez em canvases fora da tela (2x de resolução)
   junto com versões de sombra e de "piscar branco" ao levar dano.
   ===================================================================== */
const FONT = '"Trebuchet MS","Segoe UI",Verdana,sans-serif';
const RES = 2;
function P(g, pts, fill, stroke, lw = 2) {
  g.beginPath(); g.moveTo(pts[0], pts[1]);
  for (let i = 2; i < pts.length; i += 2) g.lineTo(pts[i], pts[i + 1]);
  g.closePath();
  if (fill) { g.fillStyle = fill; g.fill(); }
  if (stroke) { g.lineWidth = lw; g.strokeStyle = stroke; g.stroke(); }
}
function E(g, x, y, rx, ry, fill, stroke, lw = 2, rot = 0) {
  g.beginPath(); g.ellipse(x, y, Math.max(0.1, rx), Math.max(0.1, ry), rot, 0, TAU);
  if (fill) { g.fillStyle = fill; g.fill(); }
  if (stroke) { g.lineWidth = lw; g.strokeStyle = stroke; g.stroke(); }
}
function C(g, x, y, r, fill, stroke, lw = 2) { E(g, x, y, r, r, fill, stroke, lw); }
function rrPath(g, x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r);
  g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath();
}
function RR(g, x, y, w, h, r, fill, stroke, lw = 2) {
  rrPath(g, x, y, w, h, r);
  if (fill) { g.fillStyle = fill; g.fill(); }
  if (stroke) { g.lineWidth = lw; g.strokeStyle = stroke; g.stroke(); }
}
function L(g, x1, y1, x2, y2, col, lw = 2) { g.beginPath(); g.moveTo(x1, y1); g.lineTo(x2, y2); g.strokeStyle = col; g.lineWidth = lw; g.stroke(); }
// pontos irregulares em volta de uma elipse (ilhas, rochas, nuvens)
function blobPts(rx, ry, n, jag, r = Math.random) {
  const pts = [];
  for (let i = 0; i < n; i++) { const a = i / n * TAU, k = 1 - jag / 2 + r() * jag; pts.push([Math.cos(a) * rx * k, Math.sin(a) * ry * k]); }
  return pts;
}
// caminho suave passando pelos pontos médios
function smoothPath(g, pts, cx = 0, cy = 0, sc = 1) {
  const n = pts.length; g.beginPath();
  let p = pts[0], q = pts[1];
  g.moveTo(cx + (p[0] + q[0]) / 2 * sc, cy + (p[1] + q[1]) / 2 * sc);
  for (let i = 1; i <= n; i++) {
    p = pts[i % n]; q = pts[(i + 1) % n];
    g.quadraticCurveTo(cx + p[0] * sc, cy + p[1] * sc, cx + (p[0] + q[0]) / 2 * sc, cy + (p[1] + q[1]) / 2 * sc);
  }
  g.closePath();
}
function makeCanvas(w, h, fn, res = RES) {
  const c = document.createElement('canvas');
  c.width = Math.ceil(w * res); c.height = Math.ceil(h * res);
  const g = c.getContext('2d'); g.scale(res, res); g.lineJoin = 'round'; g.lineCap = 'round';
  fn(g, w, h);
  c.lw = w; c.lh = h;
  return c;
}
function tint(img, color) {
  const c = document.createElement('canvas'); c.width = img.width; c.height = img.height;
  const g = c.getContext('2d'); g.drawImage(img, 0, 0);
  g.globalCompositeOperation = 'source-in'; g.fillStyle = color; g.fillRect(0, 0, c.width, c.height);
  c.lw = img.lw; c.lh = img.lh; return c;
}
const SPR = {};
function sprite(key, w, h, fn) {
  const img = makeCanvas(w, h, g => { g.translate(w / 2, h / 2); fn(g); });
  SPR[key] = { img, w, h, sh: tint(img, '#000'), wh: tint(img, '#fff') };
}
// mode: 0 normal, 1 sombra, 2 branco
function drawSpr(key, x, y, ang = 0, mode = 0, alpha = 1, scale = 1) {
  const s = SPR[key]; if (!s) return;
  const img = mode === 1 ? s.sh : mode === 2 ? s.wh : s.img;
  ctx.save(); ctx.translate(x, y); if (ang) ctx.rotate(ang);
  if (alpha !== 1) ctx.globalAlpha *= alpha;
  ctx.drawImage(img, -s.w / 2 * scale, -s.h / 2 * scale, s.w * scale, s.h * scale);
  ctx.restore();
}
function txt(s, x, y, size, color = '#fff', align = 'center', stroke = true, weight = 'bold') {
  ctx.font = `${weight} ${size}px ${FONT}`; ctx.textAlign = align; ctx.textBaseline = 'middle';
  if (stroke) { ctx.lineJoin = 'round'; ctx.lineWidth = Math.max(2.5, size / 4.5); ctx.strokeStyle = 'rgba(8,16,34,0.9)'; ctx.strokeText(s, x, y); }
  ctx.fillStyle = color; ctx.fillText(s, x, y);
}

// ---- avião genérico visto de cima, nariz para +y (inimigos voam para baixo) ----
function drawPlane(g, o) {
  const s = o.span, wy = o.wy, ch = o.chord, sw = o.sweep || 0, Ln = o.len, fw = o.fw;
  const ty = -Ln * 0.8, ts = o.tail || s * 0.42, tc = ch * 0.6;
  P(g, [-fw * 0.4, ty + tc * 0.5, -ts, ty + tc * 0.15 - sw * 0.4, -ts * 0.92, ty - tc * 0.45 - sw * 0.4, -fw * 0.4, ty - tc * 0.6,
         fw * 0.4, ty - tc * 0.6, ts * 0.92, ty - tc * 0.45 - sw * 0.4, ts, ty + tc * 0.15 - sw * 0.4, fw * 0.4, ty + tc * 0.5], o.body, o.dark);
  P(g, [-fw * 0.5, wy + ch * 0.5, -s, wy + ch * 0.18 - sw, -s * 0.94, wy - ch * 0.4 - sw, -fw * 0.5, wy - ch * 0.5,
         fw * 0.5, wy - ch * 0.5, s * 0.94, wy - ch * 0.4 - sw, s, wy + ch * 0.18 - sw, fw * 0.5, wy + ch * 0.5], o.body, o.dark);
  g.beginPath();
  g.moveTo(-fw * 0.5, wy + ch * 0.5 - 2); g.lineTo(-s + 2, wy + ch * 0.18 - sw - 1.5);
  g.moveTo(fw * 0.5, wy + ch * 0.5 - 2); g.lineTo(s - 2, wy + ch * 0.18 - sw - 1.5);
  g.strokeStyle = o.light; g.lineWidth = 2; g.stroke();
  if (o.mark) { C(g, -s * 0.62, wy - sw * 0.62, ch * 0.24, o.mark, o.dark, 1.2); C(g, s * 0.62, wy - sw * 0.62, ch * 0.24, o.mark, o.dark, 1.2); }
  if (o.eng) for (const ex of o.eng) E(g, ex, wy + ch * 0.25 - sw * Math.abs(ex) / s, fw * 0.6, ch * 0.75, o.fus, o.dark);
  E(g, 0, 0, fw, Ln, o.fus, o.dark);
  E(g, 0, -Ln * 0.25, fw * 0.35, Ln * 0.5, o.light);
  E(g, 0, Ln * 0.3, fw * 0.58, Ln * 0.22, '#22304a');
  E(g, -fw * 0.18, Ln * 0.36, fw * 0.18, Ln * 0.08, 'rgba(255,255,255,0.65)');
  if (o.nose) C(g, 0, Ln * 0.9, fw * 0.55, o.nose, o.dark, 1.5);
}

// ---- cores das unidades terrestres por tema [corpo, contorno, claro] ----
const GTINT = {
  ocean: ['#8a96a3', '#2e3740', '#b5c0cb'], jungle: ['#5f7a3a', '#27331a', '#86a35a'], desert: ['#b9965a', '#5a4524', '#dcbf86'],

  space: ['#6f6a9a', '#2a2645', '#9c97c9'], core: ['#7a5aa0', '#2c1d40', '#a585cc'],

const isSea = th => th === 'ocean' || th === 'navy';
const isSpace = th => th === 'space' || th === 'core';

// base / chão sob alvos e torres conforme o tema
function drawPad(g, th, R, r = Math.random) {
  if (isSea(th)) {
    const pts = blobPts(R, R * 0.9, 12, 0.3, r);
    smoothPath(g, pts, 0, 0, 1.3); g.fillStyle = th === 'navy' ? 'rgba(90,150,190,0.35)' : 'rgba(150,235,255,0.55)'; g.fill();
    smoothPath(g, pts, 0, 0, 1.08); g.strokeStyle = 'rgba(255,255,255,0.6)'; g.lineWidth = 3; g.stroke();
    smoothPath(g, pts); g.fillStyle = th === 'navy' ? '#b9a679' : '#f4dc96'; g.fill(); g.strokeStyle = th === 'navy' ? '#7d6d48' : '#d6b468'; g.lineWidth = 2; g.stroke();
    smoothPath(g, pts, 0, 0, 0.75); g.fillStyle = th === 'navy' ? '#3d6b45' : '#55b04c'; g.fill();
    for (let i = 0; i < 5; i++) { const a = r() * TAU, d = R * 0.5 * r(); C(g, Math.cos(a) * d, Math.sin(a) * d, R * 0.12, th === 'navy' ? '#30573a' : '#469c41'); }
  } else if (th === 'jungle') {
    const pts = blobPts(R * 1.05, R, 12, 0.3, r);
    smoothPath(g, pts, 0, 0, 1.1); g.fillStyle = '#2f6e2a'; g.fill();
    smoothPath(g, pts); g.fillStyle = '#9a7748'; g.fill(); g.strokeStyle = '#6d5230'; g.lineWidth = 2; g.stroke();
    smoothPath(g, pts, 0, 0, 0.8); g.fillStyle = '#ad8a57'; g.fill();
  } else if (th === 'desert') {
    RR(g, -R, -R, R * 2, R * 2, 10, '#cdb488', '#9c8257', 2); RR(g, -R + 6, -R + 6, R * 2 - 12, R * 2 - 12, 6, '#d9c399');
    for (let i = 0; i < 6; i++) E(g, (r() - 0.5) * R * 1.8, (r() - 0.5) * R * 1.8, 10 + r() * 10, 4, 'rgba(230,192,122,0.8)');
  } else if (th === 'city') {
    RR(g, -R, -R, R * 2, R * 2, 4, '#9aa0a8', '#6b7079', 2);
  } else if (th === 'base') {
    RR(g, -R, -R, R * 2, R * 2, 6, '#6b7582', '#2b3138', 2);
    g.save(); rrPath(g, -R, -R, R * 2, R * 2, 6); g.clip();
    g.strokeStyle = '#f1c40f'; g.lineWidth = 6;
    for (let x = -R * 2; x < R * 2; x += 16) { L(g, x, -R, x + 10, -R + 10, '#f1c40f', 5); L(g, x, R, x + 10, R - 10, '#f1c40f', 5); }
    g.restore();
    RR(g, -R + 8, -R + 8, R * 2 - 16, R * 2 - 16, 4, '#7b8592', '#4a525c', 1.5);
  } else { // espaço: plataforma hexagonal
    const pts = []; for (let i = 0; i < 6; i++) { const a = i / 6 * TAU + Math.PI / 6; pts.push(Math.cos(a) * R * 1.1, Math.sin(a) * R * 1.1); }
    P(g, pts, '#474b63', '#1c1f2e', 3);
    const p2 = pts.map(v => v * 0.82); P(g, p2, '#5a5f7c', null);
    for (let i = 0; i < 6; i++) C(g, pts[i * 2] * 0.92, pts[i * 2 + 1] * 0.92, 2.5, th === 'core' ? '#ff5fe0' : '#4ff3ff');

// ---- avião do jogador (desenhado ao vivo para inclinar ao virar) ----
function drawPlayerPlane(g, x, y, tilt, t, shadow = false, alpha = 1, sc = 1) {
  g.save(); g.translate(x, y); g.globalAlpha *= alpha;
  g.scale((1 - Math.abs(tilt) * 0.2) * sc, sc);
  g.lineJoin = 'round'; g.lineCap = 'round';
  const S = shadow, k = col => S ? '#000' : col, ol = S ? null : '#103461';
  const ls = 1 - Math.max(0, -tilt) * 0.28, rs = 1 - Math.max(0, tilt) * 0.28;
  // asas (a asa que baixa fica mais curta e escura)
  P(g, [-6, -9, -36 * ls, -1, -35 * ls, 8, -6, 11], k(tilt < -0.2 ? '#2b6fb8' : '#3d8fe0'), ol, 2.2);
  P(g, [6, -9, 36 * rs, -1, 35 * rs, 8, 6, 11], k(tilt > 0.2 ? '#2b6fb8' : '#3d8fe0'), ol, 2.2);
  if (!S) {
    L(g, -8, -7, -33 * ls, 0, '#8fd0ff', 2); L(g, 8, -7, 33 * rs, 0, '#8fd0ff', 2);
    C(g, -24 * ls, 3, 4.2, '#fff', '#103461', 1.2); C(g, -24 * ls, 3, 2.2, '#ff4d4d');
    C(g, 24 * rs, 3, 4.2, '#fff', '#103461', 1.2); C(g, 24 * rs, 3, 2.2, '#ff4d4d');
    L(g, -15 * ls, -8, -15 * ls, -13, '#333', 2); L(g, 15 * rs, -8, 15 * rs, -13, '#333', 2);
  }
  // estabilizador
  P(g, [-4, 19, -16, 23, -15, 29, -4, 29, 4, 29, 15, 29, 16, 23, 4, 19], k('#3d8fe0'), ol, 2);
  // fuselagem
  E(g, 0, 0, 7.5, 30, k('#eaf4ff'), ol, 2.2);
  if (!S) {
    E(g, 0, 8, 3, 18, '#3d8fe0');
    E(g, 0, -24, 6.2, 6, '#1d5fa8');
    E(g, 0, -7, 4.2, 8, '#1c2a44'); E(g, -1.3, -9, 1.4, 3.5, 'rgba(255,255,255,0.8)');
    // hélice (vista de lado, como uma linha que gira)
    const pl = 14 * Math.abs(Math.cos(t * 55));
    L(g, -13, -31, 13, -31, 'rgba(220,230,240,0.35)', 3);
    L(g, -pl, -31, pl, -31, '#3a3f47', 2.5);
    C(g, 0, -31, 2.4, '#ffd34d', '#5a4500', 1);
  }
  g.restore();
}

    x: k === 'bridge' ? W / 2 + (r() - 0.5) * 140 : 90 + r() * (W - 180) }));
  const hk = hostageKinds(st.theme);
  for (let i = 0; i < st.hostages; i++) ev.push({ t: st.dur * (0.1 + 0.8 * (i + 0.3) / st.hostages) + (r() - 0.5) * 2, type: 'hostage', kind: hk[i % hk.length], x: 60 + r() * (W - 120) });
  if (st.mini) ev.push({ t: st.dur * st.mini.at, type: 'mini', boss: st.mini.boss });

  ev.push({ t: st.dur * 0.62, type: 'drop', item: 'P', x: W * 0.3 + r() * W * 0.4 });

    [[1, 'Arraste o dedo ou use SETAS / WASD para voar'], [6.5, 'O tiro é automático: é só desviar e mirar!'],

    if (G.stageTime >= G.st.dur) {

    if (keys.ArrowLeft || keys.KeyA) mx -= 1;
    if (keys.ArrowRight || keys.KeyD) mx += 1;
    if (keys.ArrowUp || keys.KeyW) my -= 1;
    if (keys.ArrowDown || keys.KeyS) my += 1;

function finishStage() {
  const st = G.st, s = G.stats, i = G.idx;
  const tGoal = s.targets >= st.goal.t, rGoal = s.rescued >= st.goal.r, nod = s.deaths === 0;
  const bonus = { kills: s.kills * 50, targets: s.targets * 500 + (tGoal ? 5000 : 0), rescues: s.rescued * 500 + (rGoal ? 5000 : 0), nodeath: nod ? 10000 : 0 };
  const D = G.diff, coinsBonus = Math.round(((tGoal ? 25 + 5 * i : 0) + (rGoal ? 25 + 5 * i : 0) + (nod ? 20 : 0)) * D.reward);
  const sub = G.score + bonus.kills + bonus.targets + bonus.rescues + bonus.nodeath, diffBonus = Math.round(sub * (D.reward - 1));

    [`Resgates ${s.rescued}/${s.rescueTotal} (meta ${st.goal.r})`, '+' + fmt(bonus.rescues), rGoal],

    [`Dificuldade ${D.label} (×${String(D.reward).replace('.', ',')})`, diffBonus ? '+' + fmt(diffBonus) : '—', null],

const ui = { buttons: [], focus: 0, kbd: false, help: false, shopFrom: 'menu', shopMsg: null, flash: {}, t: 0 };
function shade(hex, amt) {
  const n = parseInt(hex.slice(1), 16);
  const r = clamp((n >> 16) + amt, 0, 255), g = clamp((n >> 8 & 255) + amt, 0, 255), b = clamp((n & 255) + amt, 0, 255);

}
// registra uma área clicável; devolve true se está em destaque (mouse ou teclado)
function area(x, y, w, h, action, disabled = false) {
  const i = ui.buttons.length;
  ui.buttons.push({ x, y, w, h, action, disabled });
  return ui.kbd ? ui.focus === i : (ptr.x >= x && ptr.x <= x + w && ptr.y >= y && ptr.y <= y + h);
}
function button(label, x, y, w, h, action, o = {}) {

  const col = o.color || '#2f80ed';

  RR(ctx, x, y + 4, w, h, 12, 'rgba(0,0,0,0.35)');

  ctx.restore();

function uiPointer(x, y, down) {
  if (!down) { ui.kbd = false; return; }
  for (let i = ui.buttons.length - 1; i >= 0; i--) {
    const b = ui.buttons[i];
    if (x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h) {
      if (b.disabled) { SFX.deny(); return; }

}
function onKeyPress(k) {
  if (state === 'play') {
    if (k === 'Space') useBomb();
    else if (k === 'KeyP' || k === 'Escape') setState('pause');
    else if (k === 'KeyM') AU.setMuted(!save.muted);
    return;
  }
  if (k === 'KeyM') { AU.setMuted(!save.muted); return; }
  if (state === 'pause' && (k === 'KeyP' || k === 'Escape')) { setState('play'); return; }
  if (k === 'Escape') { goBack(); return; }
  const n = ui.buttons.length; if (!n) return;
  if (['ArrowDown', 'ArrowRight', 'KeyS', 'KeyD'].includes(k)) { ui.kbd = true; ui.focus = (ui.focus + 1) % n; SFX.tick(); }
  else if (['ArrowUp', 'ArrowLeft', 'KeyW', 'KeyA'].includes(k)) { ui.kbd = true; ui.focus = (ui.focus - 1 + n) % n; SFX.tick(); }
  else if (k === 'Enter' || k === 'Space') {
    const b = ui.buttons[clamp(ui.focus, 0, n - 1)]; ui.kbd = true;
    if (b.disabled) SFX.deny(); else { SFX.click(); b.action(); }
  }
}
function goBack() {

  RR(ctx, gx, 104, W - 2 * gx, 20, 10, 'rgba(5,12,30,0.55)');
  fitTxt(DIFFS[save.diff].desc, W / 2, 114, W - 2 * gx - 16, 13, '#cfe8ff', 'center');
}
function drawShop() {
  drawMenuBg();
  ctx.fillStyle = 'rgba(5,12,30,0.55)'; ctx.fillRect(0, 0, W, H);
  txt('HANGAR • UPGRADES', W / 2, 34, 24, '#ffd34d');
  ctx.font = `bold 20px ${FONT}`; const cw0 = ctx.measureText(fmt(save.coins)).width;
  ICON.coin(W / 2 - cw0 / 2 - 14, 66, 9); txt(fmt(save.coins), W / 2 + 6, 66, 20, '#ffe066');
  const cw = 222, gx = (W - cw * 2) / 3, top = 90, ch = Math.min(90, (H - top - 84) / 6 - 8);
  UPGRADES.forEach((u, i) => {
    const x = gx + (i % 2) * (cw + gx), y = top + Math.floor(i / 2) * (ch + 8);
    const lvl = upLvl(u.id), max = lvl >= u.max, cost = max ? 0 : u.cost[lvl], can = !max && save.coins >= cost;
    const hov = area(x, y, cw, ch, () => buy(u));
    const fl = ui.flash[u.id] > 0 ? ui.flash[u.id] : 0;
    RR(ctx, x, y, cw, ch, 12, hov ? 'rgba(40,70,120,0.95)' : 'rgba(18,32,62,0.93)', max ? '#3ddc84' : can ? '#ffd34d' : 'rgba(255,255,255,0.25)', hov ? 3 : 2);
    if (fl) RR(ctx, x, y, cw, ch, 12, `rgba(120,255,170,${fl})`);
    C(ctx, x + 27, y + ch / 2, 20, 'rgba(255,255,255,0.08)'); drawUpIcon(u.id, x + 27, y + ch / 2);
    fitTxt(u.name, x + 53, y + 15, cw - 62, 15, '#fff', 'left', 'bold');
    for (let k = 0; k < u.max; k++) RR(ctx, x + 53 + k * 14, y + 27, 11, 7, 2, k < lvl ? '#3ddc84' : 'rgba(255,255,255,0.2)');
    fitTxt(upDesc(u, max ? u.max - 1 : lvl), x + 53, y + ch * 0.6, cw - 62, 12, '#bcd3f0');
    if (max) txt('MÁXIMO', x + cw - 12, y + ch - 13, 14, '#3ddc84', 'right');
    else {
      ctx.font = `bold 16px ${FONT}`; const tw = ctx.measureText(fmt(cost)).width;
      txt(fmt(cost), x + cw - 12, y + ch - 13, 16, can ? '#ffe066' : '#ff8a8a', 'right'); ICON.coin(x + cw - 22 - tw, y + ch - 13, 7);
    }
  });
  if (ui.shopMsg) { ctx.globalAlpha = clamp(ui.shopMsg.t * 2, 0, 1); txt(ui.shopMsg.text, W / 2, H - 92, 16, '#ff8a8a'); ctx.globalAlpha = 1; }
  const by = H - 70, next = shopNextStage();
  button('VOLTAR', 20, by, 150, 52, shopBack, { color: '#5a6478' });
  button('JOGAR FASE ' + (next + 1), 190, by, W - 210, 52, () => startStage(next), { color: '#2bb24c' });
}
function drawPause() {
  ctx.fillStyle = 'rgba(5,10,25,0.62)'; ctx.fillRect(0, 0, W, H);
  txt('PAUSADO', W / 2, H * 0.2, 42, '#ffd34d');

  button('REINICIAR FASE', x, y, bw, 54, () => startStage(G.idx), { color: '#e08a1e' }); y += 68;

}
function drawGameOver() {
  ctx.fillStyle = 'rgba(25,0,0,0.6)'; ctx.fillRect(0, 0, W, H);
  txt('ABATIDO!', W / 2, H * 0.18, 50, '#ff5a4a');
  txt(`Fase ${G.idx + 1}: ${G.st.name}`, W / 2, H * 0.18 + 48, 18, '#ffffff');
  txt('Seus upgrades e moedas continuam salvos.', W / 2, H * 0.18 + 76, 14, '#cfe8ff');
  const bw = 290, x = W / 2 - bw / 2; let y = H * 0.36;
  button('CONTINUAR AQUI', x, y, bw, 56, continueGame, { color: '#2bb24c', size: 21 });
  txt(`(${G.diff.lives} vidas novas, pontos da fase zerados)`, W / 2, y + 70, 12, '#cfe8ff'); y += 92;
  button('REINICIAR FASE', x, y, bw, 54, () => startStage(G.idx), { color: '#e08a1e' }); y += 68;
  button('LOJA DE UPGRADES', x, y, bw, 54, () => openShop('gameover'), { color: '#2f80ed' }); y += 68;
  button('MENU', x, y, bw, 54, () => { G = null; setState('menu'); }, { color: '#5a6478' }); y += 68;
  button('VOLTAR AOS JOGOS', x, y, bw, 54, voltarAosJogos, { color: '#5a6478' });
}
function updateVictory(dt) {
  const R = RESULT; R.t += dt;
  const n = Math.min(R.lines.length, Math.floor(R.t / 0.35));
  if (n > R.shown) { R.shown = n; SFX.tick(); }
  if (Math.random() < dt * 3) { const x = rand(40, W - 40), y = rand(80, H * 0.4), c = pick(['#ffd34d', '#4fc3ff', '#ff6bd5', '#7dffb0']); for (let i = 0; i < 24; i++) { const a = i / 24 * TAU; part(6, x, y, Math.cos(a) * 140, Math.sin(a) * 140, 0.9, 3, c); } }
}
function drawVictory() {
  const R = RESULT, st = STAGES[R.idx];
  ctx.fillStyle = 'rgba(5,12,30,0.55)'; ctx.fillRect(0, 0, W, H);
  drawParticles();
  const w = W - 36, h = 470, x = 18, y = Math.max(20, (H - h) / 2 - 40);
  panel(x, y, w, h);
  txt('FASE CONCLUÍDA!', W / 2, y + 34, 30, '#ffd34d');
  txt(`${R.idx + 1}. ${st.name}`, W / 2, y + 66, 16, '#ffffff');
  for (let k = 0; k < 3; k++) {
    const on = k < R.stars, pop = clamp((R.t - 0.2 - k * 0.25) * 4, 0, 1);
    ICON.star(W / 2 - 50 + k * 50, y + 104, 18 * (on ? 0.6 + 0.4 * pop : 1), on && pop > 0 ? '#ffd34d' : 'rgba(255,255,255,0.15)', on ? '#5a3d00' : 'rgba(0,0,0,0.4)');
  }
  R.lines.forEach((ln, i) => {
    if (i >= R.shown) return;
    const ly = y + 148 + i * 32;
    fitTxt(ln[0], x + 20, ly, w - 140, 14, ln[2] === true ? '#7dffb0' : ln[2] === false ? '#ff9a8a' : '#ffffff', 'left', 'bold');
    txt(ln[1], x + w - 20, ly, 15, i >= R.lines.length - 2 ? '#ffe066' : '#ffffff', 'right');
  });
  if (R.shown >= R.lines.length) {
    const k = clamp((R.t - R.lines.length * 0.35) / 1, 0, 1);
    txt('TOTAL ' + fmt(R.total * k), W / 2, y + h - 40, 26, '#ffd34d');
    if (R.rec && k >= 1) txt('NOVO RECORDE!', W / 2, y + h - 14, 13, '#7dffb0');
    const by = y + h + 18, last = R.idx === 7;
    button(last ? 'VER O FINAL' : 'PRÓXIMA FASE', 20, by, W - 40, 54, () => last ? setState('ending') : startStage(R.idx + 1), { color: '#2bb24c', size: 22 });
    button('LOJA', 20, by + 66, (W - 52) / 2, 50, () => openShop('victory'), { color: '#e08a1e' });
    button('MENU', 32 + (W - 52) / 2, by + 66, (W - 52) / 2, 50, () => { G = null; setState('menu'); }, { color: '#5a6478' });
  }
}
const ENDING = { t: 0, y: 0 };
function updateEnding(dt) {
  ENDING.t += dt; ENDING.y += 30 * dt;
  if (Math.random() < dt * 2.5) {
    const x = rand(40, W - 40), y = rand(60, H * 0.55), c = pick(['#ffd34d', '#4fc3ff', '#ff6bd5', '#7dffb0', '#ffffff']);
    for (let i = 0; i < 36; i++) { const a = i / 36 * TAU, s = rand(120, 180); part(6, x, y, Math.cos(a) * s, Math.sin(a) * s, 1.2, 3.5, c); }
    part(5, x, y, 0, 0, 0.2, 40, c); AU.noise(0.5, 0.1, 1500, 100);
  }
  updateParticles(dt);
}
function drawEnding() {
  const A = themeAssets('space');
  tileDraw(A.tile, ENDING.y * 0.4); tileDraw(A.tile2, ENDING.y);
  drawParticles();
  drawPlayerPlane(ctx, W / 2, H * 0.62 + Math.sin(ENDING.t * 1.5) * 10, Math.sin(ENDING.t) * 0.4, ENDING.t, false, 1, 1.6);
  drawTitle(H * 0.14);
  txt('VITÓRIA!', W / 2, H * 0.3, 40, '#7dffb0');
  txt('O Império dos Céus caiu.', W / 2, H * 0.3 + 40, 18, '#ffffff');
  txt('Seu esquadrão libertou o mundo!', W / 2, H * 0.3 + 66, 16, '#cfe8ff');
  const stars = save.stars.reduce((a, b) => a + b, 0), best = save.best.reduce((a, b) => a + b, 0);
  ICON.star(W / 2 - 70, H * 0.3 + 104, 11, '#ffd34d'); txt(stars + '/24 estrelas', W / 2 - 54, H * 0.3 + 104, 16, '#fff', 'left');
  txt('Recorde somado: ' + fmt(best), W / 2, H * 0.3 + 132, 15, '#ffe066');
  txt('Obrigado por jogar!', W / 2, H * 0.8, 18, '#ffd34d');
  button('MENU', W / 2 - 100, H - 80, 200, 54, () => { G = null; setState('menu'); }, { color: '#2bb24c' });
}

/* =====================================================================
   18. LOOP PRINCIPAL — requestAnimationFrame com passo de tempo fixo
   ===================================================================== */
const STEP = 1 / 60;
let lastT = performance.now(), acc = 0;
function update(dt) {
  ui.t += dt;
  if (ui.shopMsg) { ui.shopMsg.t -= dt; if (ui.shopMsg.t <= 0) ui.shopMsg = null; }
  for (const k in ui.flash) if (ui.flash[k] > 0) ui.flash[k] -= dt;
  switch (state) {
    case 'play': updatePlay(dt); break;
    case 'menu': case 'select': case 'shop': updateMenuBg(dt); break;
    case 'victory': updateVictory(dt); updateParticles(dt); break;
    case 'ending': updateEnding(dt); break;
  }
}
function render() {
  ctx.setTransform(SCALE * DPR, 0, 0, SCALE * DPR, 0, 0);
  ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  ui.buttons = [];
  if (G && (state === 'play' || state === 'pause' || state === 'gameover' || state === 'victory')) {
    drawWorld();
    if (state === 'play' || state === 'pause') drawHUD();
  }
  switch (state) {
    case 'menu': drawMenu(); break;
    case 'select': drawSelect(); break;
    case 'shop': drawShop(); break;
    case 'pause': drawPause(); break;
    case 'gameover': drawGameOver(); break;
    case 'victory': drawVictory(); break;
    case 'ending': drawEnding(); break;
  }
  if (ui.focus >= ui.buttons.length) ui.focus = 0;
}
function frame(now) {
  requestAnimationFrame(frame);
  let dt = (now - lastT) / 1000; lastT = now;
  if (dt > 0.25) dt = 0.25;
  acc += dt;
  let n = 0;
  while (acc >= STEP && n < 5) { update(STEP); acc -= STEP; n++; }
  if (n >= 5) acc = 0;
  render();
}

loadSave();
resize();
buildSprites();
themeAssets('ocean');
setState('menu');
requestAnimationFrame(frame);
setTimeout(prewarm, 300);
</script>
