// Monta a grade de caracteres de um quadro a partir das partes
function compose(w, h, parts) {
  const g = [];
  for (let r = 0; r < h; r++) g.push(new Array(w).fill('.'));
  for (const [p, dx, dy] of parts) {
    p.forEach((row, ri) => {
      for (let ci = 0; ci < row.length; ci++) {
        const ch = row[ci], X = dx + ci, Y = dy + ri;
        if (ch !== '.' && X >= 0 && X < w && Y >= 0 && Y < h) g[Y][X] = ch;
      }
    });
  }
  return g;
}

// Cache de sprites renderizados (por quadro, pele, lado e flash branco)
const sprCache = new Map();
function getSprite(sheet, frame, skin, flip, flash) {
  const key = sheet + frame + skin + (flip ? 1 : 0) + (flash ? 1 : 0);
  let s = sprCache.get(key);
  if (s) return s;
  const S = SHEETS[sheet], grid = compose(S.w, S.h, S.frames[frame]), colors = SKINS[skin];
  const c = document.createElement('canvas'); c.width = S.w; c.height = S.h;
  const g = c.getContext('2d');
  for (let y = 0; y < S.h; y++) for (let x = 0; x < S.w; x++) {
    const ch = grid[y][x]; if (ch === '.') continue;
    const col = flash ? 1 : colors[ch]; if (col === undefined) continue;
    g.fillStyle = PAL[col]; g.fillRect(flip ? S.w - 1 - x : x, y, 1, 1);
  }
  s = { c, w:S.w, h:S.h, ox: flip ? S.w - 1 - S.ox : S.ox };
  sprCache.set(key, s);
  return s;
}

/* =====================================================================
   5. ÁUDIO (chip estilo SID com Web Audio)
   ===================================================================== */
let ac = null, master = null, sfxBus = null, musBus = null, noiseBuf = null;
let muted = false;
try { muted = localStorage.getItem('bl64_mute') === '1'; } catch (e) {}

function audioInit() {
  if (!ac) {
    const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
    ac = new AC();
    master = ac.createGain(); master.gain.value = muted ? 0 : 0.6; master.connect(ac.destination);
    sfxBus = ac.createGain(); sfxBus.gain.value = 0.9; sfxBus.connect(master);
    musBus = ac.createGain(); musBus.gain.value = 0.45; musBus.connect(master);
    noiseBuf = ac.createBuffer(1, ac.sampleRate, ac.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  }
  if (ac.state === 'suspended') ac.resume();
}
const midi = n => 440 * Math.pow(2, (n - 69) / 12);

// Nota simples com envelope e glissando opcional
function tone(f, d, type, v, f2, t0, bus) {
  if (!ac || muted) return;
  const t = t0 || ac.currentTime, o = ac.createOscillator(), g = ac.createGain();
  o.type = type || 'square'; o.frequency.setValueAtTime(f, t);
  if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + d);
  g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(0.0008, t + d);
  o.connect(g); g.connect(bus || sfxBus); o.start(t); o.stop(t + d + 0.03);
}
// Ruído filtrado (impactos, chimbal)
function noise(d, v, freq, t0, bus) {
  if (!ac || muted) return;
  const t = t0 || ac.currentTime, s = ac.createBufferSource(), fl = ac.createBiquadFilter(), g = ac.createGain();
  s.buffer = noiseBuf; fl.type = 'bandpass'; fl.frequency.value = freq || 1000; fl.Q.value = 0.8;
  g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(0.0008, t + d);
  s.connect(fl); fl.connect(g); g.connect(bus || sfxBus); s.start(t, Math.random() * 0.5); s.stop(t + d + 0.03);
}
function seq(notes, dur, type, v) {
  if (!ac) return;
  let t = ac.currentTime;
  for (const n of notes) { tone(midi(n), dur * 1.1, type, v, null, t); t += dur; }
}
const SFX = {
  jump:   () => tone(220, 0.12, 'square', 0.07, 480),
  whoosh: () => noise(0.07, 0.12, 2400),
  hit:    () => { tone(150, 0.12, 'square', 0.18, 55); noise(0.08, 0.25, 900); },
  heavy:  () => { tone(100, 0.22, 'square', 0.22, 40); noise(0.14, 0.3, 500); },
  hurt:   () => tone(420, 0.25, 'square', 0.15, 90),
  zap:    () => { tone(1400, 0.18, 'sawtooth', 0.08, 200); noise(0.12, 0.15, 4000); },
  spark:  () => tone(1900, 0.05, 'square', 0.025, 900),
  lantern:() => seq([84, 88, 91, 96], 0.05, 'triangle', 0.18),
  gate:   () => seq([72, 76, 79, 84, 79, 84], 0.07, 'square', 0.08),
  ko:     () => tone(700, 0.5, 'triangle', 0.2, 70),
  fall:   () => tone(900, 0.9, 'square', 0.1, 50),
  exit:   () => seq([67, 72, 76, 79, 84], 0.06, 'square', 0.08),
  respawn:() => seq([60, 67, 72], 0.05, 'triangle', 0.12),
  select: () => tone(880, 0.06, 'square', 0.06),

function sfx(n) { if (SFX[n]) SFX[n](); }

// Música curta em loop: melodia (quadrada) + baixo (triangular) + chimbal (ruído)
const MUSICA = {
  passo: 0.14,
  melodia: [69,0,72,74,76,0,74,72, 69,0,67,69,72,0,69,0, 76,0,79,76,74,0,72,74, 76,0,74,72,69,0,0,0],
  baixo:   [45,45,52,45,43,43,50,43, 41,41,48,41,40,40,47,40],
  transpor:[0, 2, -2, 3],      // tom de cada área
};
let musNext = 0, musStep = 0;
function musicTick() {
  const on = game.state === 'play' || game.state === 'menu';
  if (!ac || muted || !on || ac.state !== 'running') { musNext = 0; return; }
  if (!musNext || musNext < ac.currentTime) musNext = ac.currentTime + 0.05;
  const tr = game.state === 'play' && room ? MUSICA.transpor[room.def.area] : 0;
  while (musNext < ac.currentTime + 0.25) {
    const n = MUSICA.melodia[musStep % 32];
    if (n) tone(midi(n + tr), 0.12, 'square', 0.05, null, musNext, musBus);
    if (musStep % 2 === 0) tone(midi(MUSICA.baixo[(musStep >> 1) % 16] + tr), 0.26, 'triangle', 0.14, null, musNext, musBus);
    if (musStep % 4 === 2) noise(0.03, 0.05, 7000, musNext, musBus);
    musNext += MUSICA.passo; musStep++;
  }
}
setInterval(musicTick, 50);

function setMute(m) {
  muted = m;
  try { localStorage.setItem('bl64_mute', m ? '1' : '0'); } catch (e) {}
  if (master) master.gain.value = m ? 0 : 0.6;
  layoutControls();
}

const keys = {}, keyQ = [];
const KEYS1 = { l:['ArrowLeft'], r:['ArrowRight'], u:['ArrowUp'], d:['ArrowDown'], a:['KeyZ'], b:['KeyX'] };
const KEYS2 = { l:['KeyA'], r:['KeyD'], u:['KeyW'], d:['KeyS'], a:['KeyF'], b:['KeyG'] };
const KEYS_ALL = {};
for (const k in KEYS1) KEYS_ALL[k] = KEYS1[k].concat(KEYS2[k]);

addEventListener('keydown', e => {
  if (!keys[e.code]) keyQ.push(e.code);
  keys[e.code] = true; audioInit();
  if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code)) e.preventDefault();
});
addEventListener('keyup', e => { keys[e.code] = false; });
addEventListener('blur', () => { for (const k in keys) keys[k] = false; });

const blankIn = () => ({ l:0, r:0, u:0, d:0, a:0, b:0, pa:0, pb:0 });
let touchIn = [blankIn(), blankIn()];
const IN = [blankIn(), blankIn()];
let isTouch = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;

function readInputs() {
  const two = game.mode === 2;
  for (let p = 0; p < 2; p++) {
    const map = p === 0 ? (two ? KEYS1 : KEYS_ALL) : KEYS2, t = touchIn[p], prev = IN[p], cur = {};
    for (const k of ['l','r','u','d','a','b']) cur[k] = (map[k].some(c => keys[c]) || t[k]) ? 1 : 0;
    cur.pa = cur.a && !prev.a ? 1 : 0;
    cur.pb = cur.b && !prev.b ? 1 : 0;
    IN[p] = cur;
  }
}
const pressed = (...codes) => codes.some(c => keyQ.includes(c));

function addEl(cls, x, y, size, html) {
  const el = document.createElement('div');
  el.className = cls; el.innerHTML = html || '';
  el.style.left = (x - size / 2) + 'px'; el.style.top = (y - size / 2) + 'px';

  ui.appendChild(el);

function addPad(p, x, y, r) {
  const el = addEl('pad' + (p ? ' p2' : ''), x, y, r * 2,

    '<span class="ar" style="left:8%">◀</span><span class="ar" style="right:8%">▶</span>');
  ctrls.push({ type:'pad', p, cx:x, cy:y, r, el, knob:el.firstChild });
}
function addBtn(p, type, label, x, y, r) {
  const el = addEl('btn' + (p ? ' p2' : ''), x, y, r * 2, label);
  el.style.fontSize = Math.max(10, r * 0.38) + 'px';
  ctrls.push({ type, p, cx:x, cy:y, r, el });

function addSmall(type, label, x, y) {
  const el = document.createElement('div');
  el.className = 'sm'; el.textContent = label; el.style.left = x + 'px'; el.style.top = y + 'px';
  el.addEventListener('click', () => smallAction(type));
  ui.appendChild(el);
  ctrls.push({ type, small:true, el });
}

// Recria os controles conforme o tamanho da tela e o modo de jogo
function layoutControls() {
  ui.innerHTML = ''; ctrls = [];
  const vw = innerWidth, vh = innerHeight;
  addSmall('pause', game.state === 'pause' ? '▶' : 'II', vw - 50, 8);
  addSmall('mute', muted ? '♪̸' : '♪', vw - 96, 8);
  if (!isTouch || (game.state !== 'play' && game.state !== 'pause')) return;
  const m = Math.max(10, vh * 0.04);
  if (game.mode !== 2) {
    const S = Math.min(vh * 0.44, vw * 0.22), B = S * 0.52;
    addPad(0, m + S / 2, vh - m - S / 2, S / 2);
    addBtn(0, 'a', 'SOCO', vw - m - B * 1.7, vh - m - B / 2, B / 2);
    addBtn(0, 'b', 'CHUTE', vw - m - B / 2, vh - m - B * 1.3, B / 2);
  } else {
    const S = Math.min(vh * 0.36, vw * 0.16), B = S * 0.5, bx = m + S + m * 0.6 + B / 2;
    const l2 = game.p2kind === 'sumo' ? ['TAPA', 'EMPUR.'] : ['BASTÃO', 'CHUTE'];
    addPad(0, m + S / 2, vh - m - S / 2, S / 2);
    addBtn(0, 'a', 'SOCO', bx, vh - m - B / 2, B / 2);
    addBtn(0, 'b', 'CHUTE', bx, vh - m - B * 1.7, B / 2);
    addPad(1, vw - m - S / 2, vh - m - S / 2, S / 2);
    addBtn(1, 'a', l2[0], vw - bx, vh - m - B / 2, B / 2);
    addBtn(1, 'b', l2[1], vw - bx, vh - m - B * 1.7, B / 2);
  }
}

function smallAction(type) {
  audioInit();
  if (type === 'mute') setMute(!muted);
  else if (type === 'pause') {
    if (game.state === 'play') setState('pause');
    else if (game.state === 'pause') setState('play');
  }
}

// Converte um toque em direção do direcional (8 setores) e botões
function onTouch(e) {
  if (e.cancelable) e.preventDefault();
  audioInit();
  if (e.type === 'touchstart') {
    if (!isTouch) { isTouch = true; layoutControls(); }
    for (const t of e.changedTouches) {
      const sm = ctrls.find(c => c.small && inRect(t, c.el.getBoundingClientRect()));
      if (sm) { smallAction(sm.type); continue; }
      if (game.state !== 'play') tapScreen(t.clientX, t.clientY);
    }
    if (game.state === 'menu') goFullscreen();

/* =====================================================================
   7. MUNDO: CARREGAR CÂMARA E CONSULTAR BLOCOS

let room = null;

           start:{ x:20, y:TOP + ROWS * TS - 8 }, open:false, banner:150, openT:0 };
  for (let r = 0; r < ROWS; r++) {
    const row = (def.mapa[r] || '').padEnd(COLS, '.').slice(0, COLS).split('');
    for (let c = 0; c < COLS; c++) {
      const ch = row[c], x = c * TS + 4, yb = TOP + (r + 1) * TS;
      if (ch === 'L') { room.lant.push({ c, r, x, y:TOP + r * TS + 4, id:c + ',' + r }); row[c] = '.'; }
      else if (ch === 'T') { room.torches.push({ x:c * TS, y:TOP + r * TS }); row[c] = '.'; }
      else if (ch === 'Z') { room.zaps.push({ c, r, x, ph:(c * 53 + r * 17) % 210 }); row[c] = '.'; }
      else if (ch === '*') { room.bushes.push({ x, y:yb, ph:(c * 41) % PERIGOS.arbusto.intervalo }); row[c] = '.'; }
      else if (ch === 'P') { room.start = { x, y:yb }; row[c] = '.'; }
      else if (ch === 'N') { room.spawns.push({ tipo:'ninja', x, y:yb }); row[c] = '.'; }
      else if (ch === 'S') { room.spawns.push({ tipo:'sumo', x, y:yb }); row[c] = '.'; }
      else if (ch === 'G') room.gates.push({ c, r });

function T(c, r) {

  else if (mv.derruba && d !== game.b) { d.st = 'down'; d.t = 0; d.vy = -2; }
  else { d.st = 'hurt'; d.t = 0; d.stun = mv.stun; if (mv.kb > 4) d.vy = -1.5; }
  if (d === game.b) d.inv = Math.max(d.inv, 50);
}
function knockout(d, a) {
  d.st = 'ko'; d.t = 0; d.vy = -2.5; d.vx = a ? a.face * 1.5 : 0; d.climb = false;
  sfx('ko');
  if (d === game.b) { if (a && a === game.p2) game.score2 += 1000; }
  else addScore(d.k.pontos);
}
// Dano de perigos (só afeta o Bruce)
function damage(b, dmg, fromX, snd) {
  b.hp -= dmg; b.flash = 8; b.inv = 60; vib(60); sfx(snd || 'hurt');
  const dir = b.x < fromX ? -1 : 1;
  b.vx = dir * 2; b.vy = -1.5; b.climb = false; b.ground = false;
  if (b.hp <= 0) { b.hp = 0; knockout(b, null); }
  else { b.st = 'hurt'; b.t = 0; b.stun = 18; }
}
const zapCycle = () => PERIGOS.raio.ligado + PERIGOS.raio.desligado;
const zapT = z => (game.tick + z.ph) % zapCycle();
const zapOn = z => zapT(z) < PERIGOS.raio.ligado;

function hazards() {
  const b = game.b, P = PERIGOS;
  for (const z of room.zaps) {
    if (zapT(z) === 0 && Math.abs(b.x - z.x) < 90) sfx('zap');
    if (zapOn(z) && hurtable(b) && overlap({ x:z.x - 2, y:z.y0, w:4, h:z.y1 - z.y0 }, hurtBox(b))) damage(b, P.raio.dano, z.x, 'zap');
  }
  for (const bu of room.bushes) {
    if ((game.tick + bu.ph) % P.arbusto.intervalo === 0) {
      for (let i = 0; i < P.arbusto.faiscas; i++)
        parts.push({ x:bu.x, y:bu.y - 6, vx:(Math.random() - 0.5) * 2.2, vy:-2.4 - Math.random() * 1.4, g:0.1, life:90, c:7, harm:true });
      if (Math.abs(b.x - bu.x) < 120) sfx('spark');
    }
  }
  for (const p of parts) {
    if (p.harm && p.life > 0 && hurtable(b) && overlap({ x:p.x - 1, y:p.y - 1, w:3, h:3 }, hurtBox(b))) {
      p.life = 0; damage(b, P.arbusto.dano, p.x, 'hurt');
    }
  }
}

/* =====================================================================
   11. PARTÍCULAS
   ===================================================================== */
let parts = [];
function burst(x, y, n, cols, sp) {
  sp = sp || 1.6;
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, v = Math.random() * sp + 0.4;
    parts.push({ x, y, vx:Math.cos(a) * v, vy:Math.sin(a) * v - 0.5, g:0.06, life:18 + Math.random() * 14 | 0,
                 c:cols[i % cols.length] });
  }
}
function updParts() {
  for (const p of parts) {
    p.x += p.vx; p.y += p.vy; p.vy += p.g; p.life--;
    if (p.harm && p.vy > 0 && room && isTop(colOf(p.x), rowOf(p.y)) && p.y - TOP - rowOf(p.y) * TS < 3) p.life = 0;
  }
  parts = parts.filter(p => p.life > 0 && p.y < H + 10);
}

/* =====================================================================
   12. FLUXO DO JOGO
   ===================================================================== */
const game = { state:'menu', mode:1, p2kind:'ninja', sel:0, tick:0, freeze:0, score:0, score2:0, hi:0,
               lives:5, got:[], b:null, p2:null, entry:null, msg:'', msgT:0, st:0, newHi:false };
try { game.hi = parseInt(localStorage.getItem('bl64_hi')) || 0; } catch (e) {}
function saveHi() { try { localStorage.setItem('bl64_hi', String(game.hi)); } catch (e) {} }
function addScore(n) { game.score += n; if (game.score > game.hi) { game.hi = game.score; game.newHi = true; } }
function setState(s) { game.state = s; game.st = 0; game.sel = 0; layoutControls(); }

function startGame(mode, p2kind) {
  game.mode = mode; game.p2kind = p2kind || 'ninja';
  game.score = 0; game.score2 = 0; game.lives = 5; game.newHi = false;
  game.got = CAMARAS.map(() => new Set());
  game.b = mkFighter('bruce', 0, 0, 0);
  parts = [];
  enterRoom(0);
  setState('play');
}

function enterRoom(i, chegada) {
  loadRoom(i);
  const b = game.b;
  game.entry = chegada ? { x:chegada[0] * TS + 4, y:TOP + (chegada[1] + 1) * TS } : { x:room.start.x, y:room.start.y };
  b.hp = Math.min(b.k.hp, b.hp + 20);
  placeBruce();
  // Inimigos da câmara (no modo 2 jogadores o rival assume um deles)
  let spawns = room.spawns.slice(), p2spawn = null;
  if (game.mode === 2) {
    const ix = spawns.findIndex(s => s.tipo === game.p2kind);
    if (ix >= 0) { p2spawn = spawns[ix]; spawns.splice(ix, 1); }
    spawns = spawns.filter(s => s.tipo !== game.p2kind);
    p2spawn = p2spawn || { x:W - 24, y:TOP + ROWS * TS - 8 };
    game.p2 = mkFighter(game.p2kind, p2spawn.x, p2spawn.y, 1, game.p2kind + '2');
    game.p2.inv = 60;
  } else game.p2 = null;
  room.en = spawns.map(s => { const e = mkFighter(s.tipo, s.x, s.y, 'ai'); e.wait = 60; return e; });
  parts = [];
  saveHi();
}
function placeBruce() {
  const b = game.b;
  Object.assign(b, { x:game.entry.x, y:game.entry.y, vx:0, vy:0, st:'idle', t:0, climb:false, ground:false,
                     face:1, alive:true, inv:40 });
}
function resetFighter(e) {
  Object.assign(e, { x:e.spx, y:e.spy, vx:0, vy:0, st:'idle', t:0, hp:e.k.hp, climb:false, alive:true,
                     ground:false, goal:null, cd:60, wait:30, inv:60 });
  e.face = game.b.x < e.x ? -1 : 1;
}
function goExit(ex) {
  addScore(PONTOS.camara); sfx('exit');
  if (ex.para === 'fim') { addScore(game.lives * PONTOS.vidaFinal); saveHi(); setState('win'); sfx('win'); return; }
  enterRoom(ex.para, ex.chegada);
}
function openRoom() {
  room.open = true; room.openT = 90; sfx('gate');
  game.msg = 'PASSAGEM ABERTA!'; game.msgT = 120;
  for (const g of room.gates) burst(g.c * TS + 4, TOP + g.r * TS + 4, 4, [7, 1, 3]);
}
function loseLife() {
  game.lives--;
  if (game.lives <= 0) { saveHi(); setState('over'); sfx('over'); return; }
  const b = game.b; b.hp = b.k.hp; placeBruce(); b.inv = 120;
  for (const e of room.en) if (e.alive) resetFighter(e);
  if (game.p2) resetFighter(game.p2);
  parts = []; sfx('respawn');
}

// Atualização de uma partida (60 vezes por segundo)
function playUpdate() {
  if (pressed('KeyP', 'Escape')) { setState('pause'); return; }
  if (game.freeze > 0) { game.freeze--; return; }
  const b = game.b;
  if (room.banner > 0) room.banner--;
  if (room.openT > 0) room.openT--;
  if (game.msgT > 0) game.msgT--;

  // Bruce
  const curRoom = room;
  ctrl(b, IN[0]); physics(b);
  if (b.st !== 'fell') edges(b);
  if (room !== curRoom || game.state !== 'play') return;   // trocou de câmara ou venceu
  // Saída por cima (escada pelo teto)
  if (b.climb && b.y < TOP + 16 && room.open) { const ex = findExit('U'); if (ex) { goExit(ex); return; } }
  // Queda: portão no chão (saída de baixo) ou buraco
  if (b.y > TOP + ROWS * TS + 14 && b.st !== 'fell') {
    const ex = findExit('D');
    if (ex && room.open && T(colOf(b.x), ROWS - 1) === 'G') { goExit(ex); return; }
    b.st = 'fell'; b.t = 0; b.climb = false; sfx('fall'); vib(80);
  }
  if (b.st === 'fell' && b.t > 60) { loseLife(); return; }
  if (b.st === 'ko' && b.t > 100) { loseLife(); return; }
  if (game.state !== 'play') return;

  // Inimigos controlados pela IA
  const D = DIFICULDADE[room.def.area];
  for (const e of room.en) {
    if (!e.alive) {
      if (--e.respawnT <= 0 && Math.hypot(b.x - e.spx, b.y - e.spy) > 56) { resetFighter(e); sfx('respawn'); }
      continue;
    }
    ctrl(e, aiInput(e)); physics(e); edges(e);
    if (e.st === 'ko' && e.t > 70) { e.alive = false; e.respawnT = D.reaparece; }
    if (e.y > TOP + ROWS * TS + 30) { e.alive = false; e.respawnT = D.reaparece; }
  }
  // Rival do jogador 2
  const p2 = game.p2;
  if (p2) {
    if (!p2.alive) { if (--p2.respawnT <= 0) resetFighter(p2); }
    else {
      p2.spd = 1; ctrl(p2, IN[1]); physics(p2); edges(p2);
      if ((p2.st === 'ko' && p2.t > 70) || p2.y > TOP + ROWS * TS + 30) { p2.alive = false; p2.respawnT = 150; }
    }
  }
  combat();
  hazards();
  // Lanternas
  if (b.st !== 'ko' && b.st !== 'fell') {
    const hb = hurtBox(b); hb.x -= 2; hb.w += 4;
    for (const L of room.lant) {
      if (!L.got && overlap({ x:L.x - 4, y:L.y - 5, w:8, h:10 }, hb)) {
        L.got = true; game.got[room.i].add(L.id); addScore(PONTOS.lanterna); sfx('lantern');
        burst(L.x, L.y, 10, [7, 1, 10]);
        if (room.lant.every(l => l.got)) openRoom();
      }
    }
  }
  updParts();
}

// Atualização geral conforme o estado
function update() {
  game.tick++; game.st++;
  readInputs();
  const I = IN[0];
  const confirm = pressed('Enter', 'Space', 'NumpadEnter') || I.pa || I.pb;
  switch (game.state) {
    case 'menu':
      if (pressed('ArrowUp', 'KeyW')) { game.sel = (game.sel + 2) % 3; sfx('select'); }
      if (pressed('ArrowDown', 'KeyS')) { game.sel = (game.sel + 1) % 3; sfx('select'); }
      if (pressed('KeyM')) setMute(!muted);
      if (confirm && game.st > 20) menuPick(game.sel);
      break;
    case 'play':
      if (pressed('KeyM')) setMute(!muted);
      playUpdate();
      break;
    case 'pause':
      if (pressed('ArrowUp', 'ArrowDown', 'KeyW', 'KeyS')) { game.sel = 1 - game.sel; sfx('select'); }
      if (pressed('KeyP', 'Escape')) setState('play');
      else if (confirm) pausePick(game.sel);
      break;
    case 'over':
    case 'win':
      if (game.state === 'win' && game.st % 25 === 0)
        burst(40 + Math.random() * 240, 40 + Math.random() * 60, 24, [7, 1, 3, 10, 13, 14], 2.2);
      updParts();
      if (confirm && game.st > 90) setState('menu');
      break;
  }
  keyQ.length = 0;
}
function menuPick(i) {
  sfx('select');
  if (i === 0) startGame(1); else if (i === 1) startGame(2, 'ninja'); else startGame(2, 'sumo');
}
function pausePick(i) { if (i === 0) setState('play'); else setState('menu'); }

// Toque/clique nas telas de menu (coordenadas convertidas para 320x200)
function tapScreen(clientX, clientY) {
  const r = cv.getBoundingClientRect();
  const x = (clientX - r.left) / r.width * W, y = (clientY - r.top) / r.height * H;
  if (game.state === 'menu') {
    for (let i = 0; i < 3; i++) if (x > 60 && x < 260 && y > 95 + i * 15 && y < 109 + i * 15) { game.sel = i; menuPick(i); return; }
  } else if (game.state === 'pause') {
    if (y > 96 && y < 110) pausePick(0); else if (y > 114 && y < 128) pausePick(1);
  } else if ((game.state === 'over' || game.state === 'win') && game.st > 90) setState('menu');
}

/* =====================================================================
   13. DESENHO
   ===================================================================== */
function px(g, col, x, y, w, h) { g.fillStyle = PAL[col]; g.fillRect(x, y, w || 1, h || 1); }

// Texto em pixel (remove acentos para a fonte 3x5)
function txt(s, x, y, col, sc, al) {
  sc = sc || 1;
  s = String(s).normalize('NFD').replace(/[̀-ͯ]/g, '').toUpperCase();
  const w = s.length * 4 * sc - sc;
  if (al === 'center') x -= Math.floor(w / 2); else if (al === 'right') x -= w;
  cx.fillStyle = PAL[col];
  for (let i = 0; i < s.length; i++) {
    const g = FONT[s[i]]; if (!g) continue;
    for (let r = 0; r < 5; r++) {
      const bits = +g[r];
      for (let b = 0; b < 3; b++) if (bits & (4 >> b)) cx.fillRect(x + (i * 4 + b) * sc, y + r * sc, sc, sc);
    }
  }
}
function txtS(s, x, y, col, sc, al) { txt(s, x + (sc || 1), y + (sc || 1), 0, sc, al); txt(s, x, y, col, sc, al); }

// Fundo de cada área (desenhado uma vez por câmara)
function drawBackdrop(g, A, area) {
  px(g, A.fundo, 0, TOP, W, H - TOP);
  if (area === 0) {            // janelas em arco
    for (let x = 24; x < W; x += 64) for (const y of [44, 120]) {
      px(g, A.detalhe, x, y + 4, 1, 22); px(g, A.detalhe, x + 13, y + 4, 1, 22);
      px(g, A.detalhe, x + 2, y + 1, 10, 1); px(g, A.detalhe, x + 1, y + 2, 1, 2); px(g, A.detalhe, x + 12, y + 2, 1, 2);
      px(g, A.detalhe, x, y + 26, 14, 1);
      for (let i = 3; i < 26; i += 2) px(g, 0, x + 6, y + i, 2, 1);
    }
  } else if (area === 1) {     // bambus
    for (let x = 10; x < W; x += 26) {
      for (let y = TOP; y < H; y += 2) px(g, A.detalhe, x + ((y >> 1) & 1), y);   // caule pontilhado (fica "atrás")
      for (let y = TOP + ((x * 7) % 20); y < H; y += 22) { px(g, A.detalhe, x - 1, y, 4, 1); px(g, A.detalhe, x + 3, y - 3, 3, 1); }
    }
  } else if (area === 2) {     // colunas do templo
    for (let x = 30; x < W; x += 80) {
      px(g, A.detalhe, x, TOP + 4, 12, 3); px(g, A.detalhe, x + 2, TOP + 7, 8, H - TOP - 14);
      for (let y = TOP + 9; y < H - 8; y += 2) px(g, A.fundo, x + 5, y, 1, 1);
    }
  } else {                     // tijolos pontilhados da torre
    for (let y = TOP; y < H; y += 6) for (let x = ((y / 6) % 2) * 6; x < W; x += 12) px(g, A.detalhe, x, y, 1, 1);
  }
}
function drawStone(g, x, y, c, r, A) {
  px(g, A.parede, x, y, 8, 8);
  const off = (r % 2) ? 4 : 0;
  px(g, A.escuro, x, y + 3, 8, 1); px(g, A.escuro, x, y + 7, 8, 1);
  px(g, A.escuro, x + (off + 2) % 8, y, 1, 3); px(g, A.escuro, x + (off + 6) % 8, y + 4, 1, 3);
  if (T(c, r - 1) !== '#') px(g, A.claro, x, y, 8, 1);
  px(g, A.claro, x + (off + 3) % 8, y + 1, 1, 1);
}
function drawLedge(g, x, y, A, c, noLeg) {
  px(g, A.plat, x, y, 8, 3); px(g, A.platClaro, x, y, 8, 1); px(g, 0, x, y + 3, 8, 1);
  if (!noLeg && c % 3 === 1) px(g, A.escuro, x + 3, y + 4, 2, 2);
}
function drawLadder(g, x, y) {
  px(g, 8, x + 1, y, 1, 8); px(g, 8, x + 6, y, 1, 8);
  px(g, 7, x + 1, y + 2, 6, 1); px(g, 7, x + 1, y + 6, 6, 1);
}
function drawRope(g, x, y, A, r) {
  for (let i = 0; i < 8; i++) {
    const tw = ((i + r * 8) >> 1) & 1;
    px(g, A.corda, x + 3 + tw, y + i); px(g, 8, x + 4 - tw, y + i);
  }
}
// Camada estática da câmara (fundo, pedras, plataformas, escadas, cordas)
function buildStatic() {
  const c = document.createElement('canvas'); c.width = W; c.height = H;
  const g = c.getContext('2d'), A = room.A;
  drawBackdrop(g, A, room.def.area);
  for (let r = 0; r < ROWS; r++) for (let cc = 0; cc < COLS; cc++) {
    const t = room.g[r][cc], x = cc * TS, y = TOP + r * TS;
    if (t === '#') drawStone(g, x, y, cc, r, A);
    else if (t === '=') drawLedge(g, x, y, A, cc);
    else if (t === 'H') drawLadder(g, x, y);
    else if (t === 'h') { drawLadder(g, x, y); drawLedge(g, x, y, A, cc, true); }
    else if (t === '|') drawRope(g, x, y, A, r);
  }
  for (const t of room.torches) { px(g, 12, t.x + 2, t.y + 5, 4, 1); px(g, 9, t.x + 3, t.y + 3, 2, 4); }
  room.static = c;
}

// Elementos animados do cenário
function drawDynamic() {
  const A = room.A, tk = game.tick, P = PERIGOS.sumir;
  // plataformas que somem
  for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
    if (room.g[r][c] !== '~') continue;
    const x = c * TS, y = TOP + r * TS, s = fadeState(c, r);
    if (s < P.solido || (s < P.solido + P.pisca && (tk & 4))) {
      px(cx, 14, x, y, 8, 3); px(cx, 1, x, y, 8, 1); px(cx, 6, x, y + 3, 8, 1);
    } else if (s >= P.solido + P.pisca) { px(cx, A.detalhe, x + 1, y + 1); px(cx, A.detalhe, x + 5, y + 1); }
  }
  // portões
  for (const gt of room.gates) {
    const x = gt.c * TS, y = TOP + gt.r * TS;
    if (!room.open || room.openT > 60 && (tk & 2)) {
      px(cx, 11, x, y, 8, 8);
      if (gt.r === ROWS - 1 || gt.r === 0) for (let i = 1; i < 8; i += 3) px(cx, 15, x, y + i, 8, 1);
      else for (let i = 1; i < 8; i += 3) px(cx, 15, x + i, y, 1, 8);
      px(cx, 1, x, y, 8, 1);
    } else if ((tk >> 4) & 1) {               // seta piscando indicando a saída aberta
      const ar = gt.r === 0 ? '^' : gt.r === ROWS - 1 ? 'V' : gt.c === 0 ? '<' : '>';
      txt(ar, x + 2, y + 1, 7);
    }
  }
  // tochas
  for (const t of room.torches) {
    const f = (tk >> 2) + t.x;
    px(cx, 2, t.x + 2, t.y + 1, 4, 2);
    px(cx, 8, t.x + 2 + (f % 2), t.y - 1, 3, 2);
    px(cx, 7, t.x + 3 + ((f >> 1) % 2), t.y - 3 + (f % 3 === 0 ? 1 : 0), 1, 2);
  }
  // barreiras elétricas
  const RZ = PERIGOS.raio;
  for (const z of room.zaps) {
    const x = z.c * TS, y = TOP + z.r * TS, s = zapT(z), on = s < RZ.ligado;
    const warn = s >= zapCycle() - RZ.aviso;
    px(cx, 12, x + 1, y + 1, 6, 5); px(cx, 15, x + 1, y + 1, 6, 1);
    px(cx, on ? 1 : warn && (tk & 2) ? 7 : 2, x + 3, y + 3, 2, 2);
    px(cx, 12, x + 2, z.y1 - 2, 4, 2);
    if (on) {
      for (let yy = z.y0; yy < z.y1 - 2; yy++) {
        const j = ((yy * 7 + tk * 3) % 3) - 1;
        px(cx, (yy + tk) & 2 ? 1 : 3, z.x + j - 1, yy, 2, 1);
        if (((yy + tk) % 5) === 0) px(cx, 14, z.x + j + 1, yy, 1, 1);
      }
    } else if (warn && (tk & 4)) px(cx, 7, z.x - 1, z.y0, 2, 2);
  }
  // arbustos
  const PA = PERIGOS.arbusto;
  for (const bu of room.bushes) {
    const s = (tk + bu.ph) % PA.intervalo, warn = s >= PA.intervalo - PA.aviso;
    const x = bu.x - 5, y = bu.y - 8;
    px(cx, 5, x + 1, y + 2, 9, 6); px(cx, 5, x + 3, y, 5, 2); px(cx, 0, x, y + 7, 11, 1);
    px(cx, warn && (tk & 2) ? 7 : 13, x + 3, y + 2, 2, 1); px(cx, warn && (tk & 2) ? 7 : 13, x + 6, y + 1, 2, 1);
    px(cx, 13, x + 2, y + 4); px(cx, 13, x + 8, y + 4);
  }
  // lanternas
  for (const L of room.lant) {
    if (L.got) continue;
    const sw = Math.round(Math.sin((tk + L.x * 3) * 0.05) * 0.7), x = L.x + sw, y = L.y;
    px(cx, 12, L.x, L.top, 1, Math.max(0, y - 4 - L.top));
    px(cx, 9, x - 2, y - 4, 5, 1);
    px(cx, 2, x - 3, y - 3, 7, 6);
    px(cx, 10, x - 2, y - 3, 1, 6); px(cx, 10, x + 1, y - 3, 1, 6);
    px(cx, (tk >> 3) % 3 ? 7 : 1, x - 1, y - 1, 3, 2);
    px(cx, 9, x - 2, y + 3, 5, 1); px(cx, 7, x, y + 4, 1, 2);
  }
}

// Escolhe o quadro do sprite conforme o estado do lutador
function frameOf(f) {
  const s = f.st, mv = GOLPES[s], active = mv && f.t >= mv.on - 2 && f.t <= mv.off + 3;
  if (f.k.folha === 'S') {
    if (s === 'walk') return Math.floor(f.wt / 12) % 2 ? 'step' : 'idle';
    if (s === 'slap') return active ? 'slap' : 'idle';
    if (s === 'push') return active ? 'push' : 'step';
    if (s === 'hurt') return 'hurt';
    if (s === 'ko' || s === 'down') return 'lying';
    return 'idle';
  }
  switch (s) {
    case 'walk': return ['w1', 'idle', 'w2', 'idle'][Math.floor(f.wt / 7) % 4];
    case 'jump': return 'jump';
    case 'crouch': return 'crouch';
    case 'climb': return Math.floor(f.ca / 6) % 2 ? 'c1' : 'c2';
    case 'punch': return active ? 'punch' : 'idle';
    case 'staff': return active ? 'punch' : 'idle';
    case 'kick': return active ? 'kick' : 'idle';
    case 'lowkick': return active ? 'sweep' : 'crouch';
    case 'flykick': return 'fly';
    case 'hurt': return 'hurt';
    case 'down': return f.ground && f.t > 6 ? 'lying' : 'hurt';
    case 'ko': return f.ground && f.t > 6 ? 'lying' : 'hurt';
  }
  return 'idle';
}
// Linha em pixels (bastão do ninja)
function pline(x0, y0, x1, y1, col) {
  x0 = Math.round(x0); y0 = Math.round(y0); x1 = Math.round(x1); y1 = Math.round(y1);
  const dx = Math.abs(x1 - x0), dy = -Math.abs(y1 - y0), sx = x0 < x1 ? 1 : -1, sy = y0 < y1 ? 1 : -1;
  let e = dx + dy;
  cx.fillStyle = PAL[col];
  for (;;) {
    cx.fillRect(x0, y0, 1, 1);
    if (x0 === x1 && y0 === y1) break;
    const e2 = 2 * e;
    if (e2 >= dy) { e += dy; x0 += sx; }
    if (e2 <= dx) { e += dx; y0 += sy; }
  }
}
function drawStaff(f) {
  const s = f.st, x = Math.round(f.x), y = Math.round(f.y), d = f.face;
  let seg = null;
  if (s === 'staff') {
    const mv = GOLPES.staff;
    if (f.t < mv.on) seg = [-14, -15, 8, -17];
    else if (f.t <= mv.off) seg = [-4, -16, 30, -16];
    else seg = [-2, -16, 22, -16];
  } else if (s === 'climb') seg = [-3, -26, -3, -6];
  else if (s === 'crouch' || s === 'lowkick') seg = [6, -18, 3, 0];
  else if (s === 'kick' || s === 'flykick' || s === 'jump') seg = [-7, -22, 4, -6];
  else if (s === 'idle' || s === 'walk') seg = [6, -26, 3, -1];
  if (!seg) return;
  pline(x + d * seg[0], y + seg[1], x + d * seg[2], y + seg[3], 8);
  px(cx, 7, x + d * seg[2], y + seg[3]);
}
function drawFighter(f) {
  if (!f.alive || f.st === 'fell' || f.y > H + 24) return;
  if (f.inv > 0 && (game.tick & 4)) return;
  if (f.st === 'ko' && f.t > 40 && (game.tick & 2)) return;
  const s = getSprite(f.k.folha, frameOf(f), f.skin, f.face < 0, f.flash > 0);
  cx.drawImage(s.c, Math.round(f.x) - s.ox, Math.round(f.y) - s.h);
  if (f.kind === 'ninja') drawStaff(f);
}

// Placar no topo
function bar(x, y, w, v, max) {
  px(cx, 11, x, y, w, 4);
  const fw = Math.round(w * Math.max(0, v) / max), r = v / max;
  px(cx, r > 0.5 ? 5 : r > 0.25 ? 7 : 2, x, y, fw, 4);
  px(cx, 1, x, y, fw, 1);
}
function drawHud() {
  px(cx, 0, 0, 0, W, TOP);
  const b = game.b, pad = n => String(n).padStart(6, '0');
  txt('1P ' + pad(game.score), 2, 2, 1);
  if (game.mode === 2) txt('2P ' + pad(game.score2), 70, 2, 13);
  else txt('REC ' + pad(game.hi), 70, 2, 7);
  txt('CÂMARA ' + (room.i + 1) + '/' + CAMARAS.length, 318, 2, 3, 1, 'right');
  txt('ÁREA ' + (room.def.area + 1), 210, 2, 15, 1, 'right');
  txt('ENERGIA', 2, 9, 15); bar(31, 9, 46, b.hp, b.k.hp);
  txt('VIDAS ' + game.lives, 84, 9, 10);
  const got = room.lant.filter(l => l.got).length;
  txt('LANTERNAS ' + got + '/' + room.lant.length, 122, 9, room.open && (game.tick & 16) ? 1 : 7);
  if (game.p2 && game.p2.alive) {
    txt(game.p2kind === 'sumo' ? 'SUMÔ' : 'NINJA', 230, 9, 13);
    bar(254, 9, 64, game.p2.hp, game.p2.k.hp);
  }
}
function drawBox(x, y, w, h, border) {
  px(cx, 0, x, y, w, h); px(cx, border, x, y, w, 1); px(cx, border, x, y + h - 1, w, 1);
  px(cx, border, x, y, 1, h); px(cx, border, x + w - 1, y, 1, h);
}

function drawPlay() {
  cx.drawImage(room.static, 0, 0);
  drawDynamic();
  for (const e of room.en) drawFighter(e);
  if (game.p2) drawFighter(game.p2);
  drawFighter(game.b);
  for (const p of parts) px(cx, p.c, Math.round(p.x), Math.round(p.y), p.harm ? 2 : 1, p.harm ? 2 : 1);
  drawHud();
  if (room.banner > 0 && (room.banner > 30 || (game.tick & 4))) {
    drawBox(50, 70, 220, 32, 7);
    txt('ÁREA ' + (room.def.area + 1) + ' - ' + room.A.nome, 160, 76, 3, 1, 'center');
    txt('CÂMARA ' + (room.i + 1) + ': ' + room.def.nome, 160, 88, 1, 1, 'center');
  }
  if (game.msgT > 0 && (game.msgT > 30 || (game.tick & 4))) txtS(game.msg, 160, 40, 7, 2, 'center');
  if (game.b.st === 'fell' || (game.b.st === 'ko' && game.b.t > 30)) txtS('AI!', 160, 100, 10, 3, 'center');
}

function drawMenu() {
  px(cx, 6, 0, 0, W, H); px(cx, 0, 8, 8, W - 16, H - 16);
  const tk = game.tick;
  txt('BRUCE LEE', 162, 18, 2, 4, 'center'); txt('BRUCE LEE', 160, 16, 7, 4, 'center');
  txt('A FORTALEZA DAS LANTERNAS', 160, 40, 3, 1, 'center');
  const sb = getSprite('H', ['idle', 'punch', 'idle', 'kick'][(tk >> 5) % 4], 'bruce', false, false);
  cx.drawImage(sb.c, 70 - sb.ox, 86 - sb.h);
  const sn = getSprite('H', 'idle', 'ninja', true, false); cx.drawImage(sn.c, 232 - sn.ox, 86 - sn.h);
  const ss = getSprite('S', (tk >> 4) % 2 ? 'step' : 'idle', 'sumo', true, false); cx.drawImage(ss.c, 262 - ss.ox, 86 - ss.h);
  for (const lx of [110, 140, 180, 210]) {
    px(cx, 12, lx, 50, 1, 14 + (lx % 3) * 4); px(cx, 2, lx - 3, 64 + (lx % 3) * 4, 7, 6);
    px(cx, (tk >> 3) % 3 ? 7 : 1, lx - 1, 66 + (lx % 3) * 4, 3, 2);
  }
  px(cx, 12, 20, 86, 280, 1);
  const ops = ['1 JOGADOR', '2 JOG. CONTRA NINJA', '2 JOG. CONTRA SUMÔ'];
  ops.forEach((o, i) => {
    const sel = i === game.sel;
    if (sel) txt('>', 64, 97 + i * 15, 7, 2);
    txt(o, 160, 97 + i * 15, sel ? 1 : 12, 2, 'center');
  });
  txt('RECORDE ' + String(game.hi).padStart(6, '0'), 160, 144, 13, 1, 'center');
  if (isTouch) {
    txt('DIRECIONAL: ANDAR, PULAR, SUBIR, AGACHAR', 160, 156, 15, 1, 'center');
    txt('CIMA+CHUTE: VOADORA   BAIXO+CHUTE: RASTEIRA', 160, 164, 15, 1, 'center');
  } else {
    txt('SETAS: MOVER  Z: SOCO  X: CHUTE  P: PAUSA  M: SOM', 160, 156, 15, 1, 'center');
    txt('CIMA+X: VOADORA  BAIXO+X: RASTEIRA  2P: WASD F G', 160, 164, 15, 1, 'center');
  }
  txt('COLETE AS LANTERNAS PARA ABRIR A PASSAGEM', 160, 174, 10, 1, 'center');
  if (tk & 32) txt(isTouch ? 'TOQUE UMA OPÇÃO PARA COMEÇAR' : 'ENTER PARA COMEÇAR', 160, 184, 7, 1, 'center');
}
function drawPause() {
  drawPlay();
  drawBox(80, 60, 160, 76, 7);
  txtS('PAUSA', 160, 68, 7, 3, 'center');
  ['CONTINUAR', 'MENU PRINCIPAL'].forEach((o, i) => txt(o, 160, 98 + i * 18, game.sel === i ? 1 : 12, 2, 'center'));
  txt('>', 88, 98 + game.sel * 18, 7, 2);
}
function drawOver() {
  px(cx, 0, 0, 0, W, H);
  txtS('FIM DE JOGO', 160, 50, 2, 4, 'center');
  txt('PONTOS ' + game.score, 160, 90, 1, 2, 'center');
  if (game.mode === 2) txt('RIVAL ' + game.score2, 160, 106, 13, 2, 'center');
  if (game.newHi && (game.tick & 16)) txt('NOVO RECORDE!', 160, 124, 7, 2, 'center');
  txt('RECORDE ' + game.hi, 160, 146, 13, 1, 'center');
  if (game.st > 90 && (game.tick & 32)) txt('TOQUE OU ENTER', 160, 170, 15, 1, 'center');
}
function drawWin() {
  px(cx, 0, 0, 0, W, H);
  for (const p of parts) px(cx, p.c, Math.round(p.x), Math.round(p.y), 2, 2);
  txt('VITÓRIA!', 162, 32, 2, 4, 'center'); txt('VITÓRIA!', 160, 30, 7, 4, 'center');
  txt('A FORTALEZA FOI CONQUISTADA', 160, 62, 3, 1, 'center');
  const s = getSprite('H', (game.tick >> 4) % 2 ? 'punch' : 'idle', 'bruce', false, false);
  cx.drawImage(s.c, 160 - s.ox, 106 - s.h);
  txt('PONTOS ' + game.score, 160, 116, 1, 2, 'center');
  if (game.mode === 2) txt('RIVAL ' + game.score2, 160, 132, 13, 2, 'center');
  if (game.newHi && (game.tick & 16)) txt('NOVO RECORDE!', 160, 150, 7, 2, 'center');
  if (game.st > 90 && (game.tick & 32)) txt('TOQUE OU ENTER', 160, 176, 15, 1, 'center');
}
function render() {
  switch (game.state) {
    case 'menu': drawMenu(); break;
    case 'play': drawPlay(); break;
    case 'pause': drawPause(); break;
    case 'over': drawOver(); break;
    case 'win': drawWin(); break;
  }
}

/* =====================================================================
   14. LAÇO PRINCIPAL (requestAnimationFrame + passo fixo de 60 Hz)
   ===================================================================== */
const STEP = 1000 / 60;
let acc = 0, last = 0;
function frame(t) {
  requestAnimationFrame(frame);
  if (!last) last = t;
  acc += Math.min(250, t - last); last = t;
  let n = 0;
  while (acc >= STEP && n < 8) { update(); acc -= STEP; n++; }
  if (n === 8) acc = 0;
  render();
}
fit();
requestAnimationFrame(frame);
</script>
