<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#05070d">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icone-192.png">
<link rel="apple-touch-icon" href="icone-180.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Jogos">
<title>Jogos</title>
<style>
  :root{--bg:#05070d;--card:#0e1322;--borda:#1f2a44;--texto:#e6ecff;--fraco:#8a96b8;--destaque:#7cf2a6}
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--texto);
    font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  main{max-width:1000px;margin:0 auto;padding:32px 16px 48px}
  h1{margin:0 0 4px;font:700 32px/1.1 ui-monospace,"Cascadia Mono",Consolas,monospace;letter-spacing:.08em;color:var(--destaque)}
  header p{margin:0 0 28px;color:var(--fraco)}
  #lista{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px;list-style:none;margin:0;padding:0}
  .cartao{display:flex;flex-direction:column;height:100%;background:var(--card);border:1px solid var(--borda);
    border-radius:12px;overflow:hidden;color:inherit;text-decoration:none;transition:transform .15s,border-color .15s}
  .cartao:hover,.cartao:focus-visible{transform:translateY(-3px);border-color:var(--destaque);outline:none}
  .cartao svg{display:block;width:100%;height:auto;aspect-ratio:16/10;background:#000}
  .corpo{padding:12px 14px 14px;display:flex;flex-direction:column;gap:6px;flex:1}
  .corpo h2{margin:0;font-size:18px}
  .corpo p{margin:0;color:var(--fraco);font-size:14px;flex:1}
  .compat{font-size:12px;color:var(--destaque);opacity:.85}
  footer{margin-top:32px;color:var(--fraco);font-size:13px}
  main{padding-left:max(16px,env(safe-area-inset-left));padding-right:max(16px,env(safe-area-inset-right))}
  #instalar{display:none;align-items:center;gap:12px;margin:0 0 20px;padding:12px 14px;background:var(--card);
    border:1px solid var(--destaque);border-radius:12px;font-size:14px}
  #instalar.ver{display:flex}
  #instalar p{margin:0;flex:1}
  #instalar button{font:inherit;border-radius:8px;padding:6px 12px;cursor:pointer}
  #instalar .sim{background:var(--destaque);color:var(--bg);border:0;font-weight:700}
  #instalar .nao{background:none;color:var(--fraco);border:1px solid var(--borda)}
</style>
</head>
<body>
<main>
  <header>
    <h1>JOGOS</h1>
    <p>Jogos feitos por diversão, cada um num único arquivo HTML.</p>
  </header>
  <div id="instalar" role="note"><p></p><button class="sim" hidden>Instalar</button><button class="nao" aria-label="Fechar">✕</button></div>
  <ul id="lista"></ul>
  <footer>Os recordes e o progresso ficam salvos no seu navegador.</footer>
</main>
<script>
'use strict';
// Para acrescentar um jogo, inclua uma linha aqui. "desenho" é o miolo de um SVG 160x100.
const JOGOS = [
  { nome: 'Campos Tennis', url: 'tenis/', compat: 'Melhor no computador · funciona no celular',
    descricao: 'Tênis 3D com campeonatos, troféus e raquetes especiais.',
    desenho: '<rect width="160" height="100" fill="#1b5e9c"/><path d="M30 88 50 22h60l20 66Z" fill="#2f7fc4" stroke="#fff" stroke-width="1.5"/><path d="M40 55h80" stroke="#fff" stroke-width="2"/><path d="M80 22v66M44 75h72M56 35h48" stroke="#fff" stroke-width="1"/><circle cx="104" cy="44" r="4" fill="#e3f53a"/>' },
  { nome: 'Lunar Lander Vetorial', url: 'lander/', compat: 'Computador e celular',
    descricao: 'Pouse a nave nas plataformas da Lua e de Marte sem gastar todo o combustível.',
    desenho: '<g fill="none" stroke="#fff" stroke-width="1.5"><path d="M0 82 22 70 34 76 48 60 62 60 74 78 96 66 112 66 126 84 146 72 160 78"/><path d="M48 60h14M96 66h16" stroke="#7cf2a6" stroke-width="2.5"/><path d="M98 30h8l3 6h-14Z M95 36h14v5H95Z M96 41l-3 6M108 41l3 6"/><path d="M100 44l2 7 2-7" stroke="#ffb347"/></g><circle cx="24" cy="18" r=".8" fill="#fff"/><circle cx="140" cy="24" r=".8" fill="#fff"/><circle cx="66" cy="12" r=".8" fill="#fff"/>' },
  { nome: 'Asas de Aço', url: 'asas/', compat: 'Computador e celular',
    descricao: 'Shoot \'em up vertical com chefes, power-ups e melhorias para o avião.',
    desenho: '<rect width="160" height="100" fill="#0b1830"/><path d="M0 70h160v30H0Z" fill="#163a2a"/><g fill="#9fb6d8"><path d="M80 58l4 10 16 6v4l-16-3-2 8 5 3v3l-7-2-7 2v-3l5-3-2-8-16 3v-4l16-6Z"/><path d="M48 18l3 6 9 3v2l-9-2-1 4-3 2-3-2-1-4-9 2v-2l9-3Z" fill="#d86a5a" transform="rotate(180 48 25)"/><path d="M112 26l3 6 9 3v2l-9-2-1 4-3 2-3-2-1-4-9 2v-2l9-3Z" fill="#d86a5a" transform="rotate(180 112 33)"/></g><path d="M80 52v-10M80 36v-8" stroke="#ffe066" stroke-width="2"/>' },
  { nome: 'Bruce Lee 64 - A Fortaleza', url: 'fortaleza/', compat: 'Computador e celular',
    descricao: 'Plataforma e luta no estilo do Commodore 64: colete as lanternas e abra caminho pela fortaleza. Tem modo para dois jogadores.',
    desenho: '<rect width="160" height="100" fill="#40318d"/><path d="M0 84h160v16H0Z" fill="#8b5429"/><path d="M14 60h40v6H14ZM106 46h40v6h-40Z" fill="#b8c76f"/><g fill="#ffe066"><circle cx="34" cy="51" r="3"/><path d="M31 54h6v12h-6Z"/></g><g fill="#7abfc7"><circle cx="78" cy="62" r="3.5"/><path d="M75 66h7v9l5 9h-3l-5-8-4 8h-3l3-9Z M82 68l9-4 1 2-9 4Z"/></g><g fill="#68372b"><circle cx="112" cy="62" r="3.5"/><path d="M109 66h7v18h-7Z"/></g>' },
  { nome: "Poker Texas Hold'em", url: 'poker/', compat: 'Computador e celular',
    descricao: 'No-Limit contra até 8 bots, com Modo Aprendizado: probabilidades, outs, dicas e revisão das mãos.',
    desenho: '<rect width="160" height="100" fill="#0e2418"/><ellipse cx="80" cy="54" rx="70" ry="36" fill="#1f7a46" stroke="#5b3a1f" stroke-width="5"/><g transform="rotate(-10 62 50)"><rect x="48" y="31" width="26" height="36" rx="3" fill="#fff"/><text x="52" y="45" font-size="12" font-family="Georgia,serif" font-weight="700" fill="#d0182b">A</text><text x="57" y="62" font-size="14" fill="#d0182b">♥</text></g><g transform="rotate(8 98 50)"><rect x="85" y="31" width="26" height="36" rx="3" fill="#fff"/><text x="89" y="45" font-size="12" font-family="Georgia,serif" font-weight="700" fill="#1a1a1a">K</text><text x="94" y="62" font-size="14" fill="#1a1a1a">♠</text></g><circle cx="130" cy="68" r="7" fill="#e5484d" stroke="#fff" stroke-width="2" stroke-dasharray="3 2"/><circle cx="32" cy="68" r="7" fill="#1767c5" stroke="#fff" stroke-width="2" stroke-dasharray="3 2"/>' },
  { nome: 'Sinuca de Bico', url: 'sinuca/', compat: 'Computador e celular',
    descricao: 'Sinuca e bilhar vistos de cima, com física realista: Bola 8, Bola 9, Mata-mata, Sinuca brasileira, Carambola e mais.',
    desenho: '<rect width="160" height="100" fill="#140c07"/><rect x="10" y="14" width="140" height="74" rx="6" fill="#5b2a15"/><rect x="20" y="24" width="120" height="54" fill="#1c6a3e"/><g fill="#050505"><circle cx="21" cy="25" r="5"/><circle cx="80" cy="22" r="4.5"/><circle cx="139" cy="25" r="5"/><circle cx="21" cy="77" r="5"/><circle cx="80" cy="80" r="4.5"/><circle cx="139" cy="77" r="5"/></g><path d="M46 51h50" stroke="#fff" stroke-width="1" stroke-dasharray="3 2" opacity=".7"/><circle cx="46" cy="51" r="3.6" fill="#f4efe1"/><circle cx="99.6" cy="51" r="3.6" fill="#f2b705"/><circle cx="105.8" cy="47.4" r="3.6" fill="#d0202a"/><circle cx="105.8" cy="54.6" r="3.6" fill="#1d3fa5"/><circle cx="112" cy="43.8" r="3.6" fill="#0e7a3d"/><circle cx="112" cy="51" r="3.6" fill="#141414"/><circle cx="112" cy="58.2" r="3.6" fill="#f06418"/><path d="M8 66 40 54" stroke="#e2c48e" stroke-width="2.4" stroke-linecap="round"/><path d="M38 54.7 41.5 53.4" stroke="#2f6fb8" stroke-width="2.4"/>' },
];

const lista = document.getElementById('lista');
for (const j of JOGOS) {
  const li = document.createElement('li');
  li.innerHTML =
    `<a class="cartao" href="${j.url}">` +
      `<svg viewBox="0 0 160 100" aria-hidden="true">${j.desenho}</svg>` +
      `<div class="corpo"><h2></h2><p></p><span class="compat"></span></div>` +
    `</a>`;
  li.querySelector('h2').textContent = j.nome;
  li.querySelector('p').textContent = j.descricao;
  li.querySelector('.compat').textContent = j.compat;
  lista.appendChild(li);
}

// Dica para instalar na tela inicial: só no celular, fora do app instalado e se a pessoa não a fechou.
// Instalado, o app abre sem as barras do navegador, também dentro dos jogos.
const aviso = document.getElementById('instalar');
const instalado = matchMedia('(display-mode: fullscreen), (display-mode: standalone)').matches || navigator.standalone;
const celular = matchMedia('(pointer: coarse)').matches;
const iOS = /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
let dispensado = false;
try { dispensado = localStorage.getItem('jogos-instalar') === 'nao'; } catch (e) {}
let pedido = null; // evento do Android/Chrome que abre a janela de instalação

function mostrarAviso(texto, comBotao) {
  if (instalado || !celular || dispensado) return;
  aviso.querySelector('p').textContent = texto;
  aviso.querySelector('.sim').hidden = !comBotao;
  aviso.classList.add('ver');
}
aviso.querySelector('.nao').addEventListener('click', () => {
  aviso.classList.remove('ver');
  try { localStorage.setItem('jogos-instalar', 'nao'); } catch (e) {}
});
aviso.querySelector('.sim').addEventListener('click', () => {
  if (!pedido) return;
  pedido.prompt();
  pedido.userChoice.finally(() => { pedido = null; aviso.classList.remove('ver'); });
});
addEventListener('beforeinstallprompt', e => {
  e.preventDefault();
  pedido = e;
  mostrarAviso('Instale os jogos para jogar em tela cheia, sem as barras do navegador.', true);
});
addEventListener('appinstalled', () => aviso.classList.remove('ver'));
if (iOS) mostrarAviso('Para jogar em tela cheia: toque em Compartilhar e depois em "Adicionar à Tela de Início".', false);
// Navegadores sem a janela de instalação (Firefox, por exemplo): dica genérica
else setTimeout(() => { if (!pedido) mostrarAviso('Para jogar em tela cheia, use no menu do navegador a opção "Instalar" ou "Adicionar à tela inicial".', false); }, 3000);
</script>
</body>
</html>
