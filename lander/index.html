<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="apple-touch-icon" href="../icone-180.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#000000">
<title>Lunar Lander Vetorial</title>
<style>
  /* Margens seguras (entalhe, cantos arredondados), lidas pelo script */
  :root {
    --seguro-topo: env(safe-area-inset-top, 0px);
    --seguro-dir: env(safe-area-inset-right, 0px);
    --seguro-esq: env(safe-area-inset-left, 0px);
  }
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  canvas {
    display: block; position: fixed; inset: 0;
    touch-action: none; user-select: none; -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
</style>
</head>
<body>
<canvas id="tela"></canvas>
<script>
'use strict';

// =====================================================================
// 1. CONFIGURAÇÃO
// =====================================================================
const CFG = {
  MUNDO_L: 1800,           // largura do mundo (unidades do jogo)
  MUNDO_A: 1000,           // altura do mundo (y cresce para baixo)
  PASSO: 1 / 120,          // passo fixo da física, em segundos
  COMB_MAX: 1500,          // combustível máximo
  CONSUMO_PRINCIPAL: 45,   // combustível/s do propulsor principal
  CONSUMO_LATERAL: 16,     // combustível/s de cada empuxo lateral (arcade)
  GIRO: 2.4,               // velocidade de rotação no modo clássico (rad/s)
  EMPUXO_LATERAL: 14,      // aceleração lateral no modo arcade
  LIM_VY: 16,              // velocidade vertical máxima para pousar
  LIM_VX: 9,               // velocidade horizontal máxima para pousar
  LIM_ANG: 8 * Math.PI / 180, // inclinação máxima para pousar
  PENALIDADE: 200,         // combustível perdido ao destruir a nave
  RECARGA: 0.45,           // fração do tanque recarregada a cada fase
  COMB_BAIXO: 0.15,        // abaixo desta fração toca o alerta
  ZOOM_FATOR: 3.5,         // ampliação máxima perto do solo
  ZOOM_ALCANCE: 0.55,      // a nave ocupa no máximo esta fração da altura visível acima do solo
};

const CORES = { branco: '#eef3ff', verde: '#3dff7a' };
const COR_ALERTA = '#ff3b3b';

// Ciclo de fases: astro, gravidade e relevo. As cinco primeiras mudam o relevo; as
// cinco seguintes mudam também a forma de jogar (vento, plataformas móveis, rochas,
// pousos em sequência, túnel). cheio: começa com o tanque cheio. Depois da décima, o
// ciclo recomeça com gravidade maior e plataformas menores.
const CICLO = [
  { nome: 'LUA', g: 8, perfil: perfilPlanicie },
  { nome: 'LUA', g: 9.5, perfil: perfilCrateras },
  { nome: 'MARTE', g: 13, perfil: perfilCanions },
  { nome: 'MARTE', g: 14.5, perfil: perfilMontanhas },
  { nome: 'PLANETA X', g: 16, perfil: perfilCaverna, cheio: true },
  { nome: 'TITÃ', g: 10, perfil: perfilMesas, novo: true },
  { nome: 'EUROPA', g: 7, perfil: perfilMoveis, novo: true },
  { nome: 'IO', g: 9, perfil: perfilVulcoes, novo: true },
  { nome: 'CERES', g: 4, perfil: perfilEntrega, novo: true, cheio: true },
  { nome: 'MERCÚRIO', g: 12, perfil: perfilTunel, novo: true, cheio: true },
];
function dadosFase(n) {
  const b = CICLO[(n - 1) % CICLO.length], volta = Math.floor((n - 1) / CICLO.length);
  return { ...b, volta, g: Math.min(24, b.g * (1 + 0.25 * volta)) };
}
// Empuxo do propulsor principal acompanha a gravidade da fase
const empuxo = g => g * 2.4 + 8;

const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const aleat = (a, b) => a + Math.random() * (b - a);
const piscar = (hz = 3) => (performance.now() / 1000 * hz) % 1 < 0.55;

// =====================================================================
// 2. ESTADO DO JOGO
// =====================================================================
const jogo = {
  estado: 'menu',      // menu | jogando | pousou | destruida
  modo: 'classico',    // classico | arcade
  cor: 'branco',       // branco | verde
  mudo: false,
  pausado: false,
  fase: 1,
  faseIni: 1,          // fase em que o jogo começa (escolhida no menu)
  faseMax: 1,          // maior fase já alcançada (até o fim do primeiro ciclo)
  mundoT: 0,           // relógio da fase (vento, plataformas móveis, vulcões)
  aviso: null,         // mensagem passageira durante o voo
  pontos: 0,
  tempo: 0,
  comb: CFG.COMB_MAX,
  recorde: 0,
  tEstado: 0,          // tempo desde a última troca de estado
  bipeT: 0,
  menuSel: 0,
  itensMenu: [],
  botoes: [],          // áreas clicáveis desenhadas no quadro atual
  toque: false,        // mostra controles de toque
  resultado: null,
};
let terreno = null, nave = null, destrocos = [], faiscas = [], estrelas = [], rochas = [], poeira = [];
const teclas = {};
const ponteiros = new Map(); // pointerId -> botão de toque segurado

// Preferências e recorde salvos no navegador (opcional)
try {
  const p = JSON.parse(localStorage.getItem('lander-prefs') || '{}');
  if (p.modo) jogo.modo = p.modo;
  if (p.cor) jogo.cor = p.cor;
  jogo.mudo = !!p.mudo;
  jogo.recorde = +localStorage.getItem('lander-recorde') || 0;
  jogo.faseMax = clamp(+localStorage.getItem('lander-fase-max') || 1, 1, CICLO.length);
  jogo.faseIni = clamp(+p.faseIni || 1, 1, jogo.faseMax);
} catch (e) {}
function salvarPrefs() {
  try { localStorage.setItem('lander-prefs', JSON.stringify({ modo: jogo.modo, cor: jogo.cor, mudo: jogo.mudo, faseIni: jogo.faseIni })); } catch (e) {}
}
function registrarFase(n) {
  if (n <= jogo.faseMax || jogo.faseMax >= CICLO.length) return;
  jogo.faseMax = Math.min(n, CICLO.length);
  try { localStorage.setItem('lander-fase-max', String(jogo.faseMax)); } catch (e) {}
}
function salvarRecorde() {
  if (jogo.pontos <= jogo.recorde) return;
  jogo.recorde = jogo.pontos;
  try { localStorage.setItem('lander-recorde', String(jogo.recorde)); } catch (e) {}
}

// =====================================================================
// 3. CANVAS RESPONSIVO
// =====================================================================
const tela = document.getElementById('tela');
const ctx = tela.getContext('2d');
let cw = 0, ch = 0, dpr = 1;
const seguro = { topo: 0, dir: 0, esq: 0 }; // margens seguras em px (env(safe-area-inset-*))
function redimensionar() {
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  // Janela oculta pode informar 0x0; evita divisão por zero na câmera
  cw = Math.max(1, window.innerWidth); ch = Math.max(1, window.innerHeight);
  tela.width = Math.round(cw * dpr); tela.height = Math.round(ch * dpr);
  tela.style.width = cw + 'px'; tela.style.height = ch + 'px';
  const cs = getComputedStyle(document.documentElement);
  for (const k in seguro) seguro[k] = parseFloat(cs.getPropertyValue('--seguro-' + k)) || 0;
}
window.addEventListener('resize', redimensionar);
// Entrar ou sair da tela cheia muda o tamanho: reajusta o canvas
document.addEventListener('fullscreenchange', redimensionar);
document.addEventListener('webkitfullscreenchange', redimensionar);
redimensionar();

// =====================================================================
// 4. FONTE VETORIAL (grade 4x6, cada traço é uma sequência de pontos "xy")
// =====================================================================
const FONTE_SRC = {
  A: '0602204246|0343', B: '06003041423303|3344453606', C: '40000646', D: '00304145360600',
  E: '40000646|0333', F: '400006|0333', G: '41400006464323', H: '0006|4046|0343',
  I: '0040|2026|0646', J: '40460604', K: '0006|400346', L: '000646',
  M: '0600224046', N: '06004640', O: '0040460600', P: '0600404303',
  Q: '0040460600|2446', R: '0600404303|2346', S: '400003434606', T: '0040|2026',
  U: '00064640', V: '002640', W: '0006244640', X: '0046|4006',
  Y: '002240|2226', Z: '00400646',
  '0': '0040460600|4006', '1': '112026|1636', '2': '004043030646', '3': '00404606|0343',
  '4': '000343|4046', '5': '4000033344453606', '6': '400006464303', '7': '004016',
  '8': '0040460600|0343', '9': '430300404606',
  ':': '2122|2425', '.': '2526', ',': '2516', '-': '0343', '/': '0640', '+': '0343|2125',
  '(': '30121436', ')': '10323416', '!': '2024|2526', '?': '0040432324|2526',
  '>': '113315', '<': '311335', '=': '0242|0444', '°': '1020211110', 'x': '1336|3316',
  '→': '0343|214325', '←': '0343|210325', '↑': '2026|022042', '↓': '2026|042644',
};
const FONTE = {};
for (const [c, s] of Object.entries(FONTE_SRC)) {
  FONTE[c] = s.split('|').map(t => {
    const p = [];
    for (let i = 0; i < t.length; i += 2) p.push([+t[i], +t[i + 1]]);
    return p;
  });
}
// Acentos (marcas combinantes do Unicode), desenhados sobre a letra anterior
const ACENTOS = {
  0x301: [[[1.5, -0.6], [2.8, -2]]],                          // agudo
  0x300: [[[1.2, -2], [2.5, -0.6]]],                          // grave
  0x302: [[[1, -0.6], [2, -1.8], [3, -0.6]]],                 // circunflexo
  0x303: [[[0.5, -0.8], [1.4, -1.8], [2.6, -0.8], [3.5, -1.8]]], // til
  0x327: [[[2, 6], [2, 7.2], [1.2, 7.8]]],                    // cedilha
};

function tracarGlifo(tracos, ox, oy, u) {
  for (const t of tracos) {
    ctx.moveTo(ox + t[0][0] * u, oy + t[0][1] * u);
    for (let i = 1; i < t.length; i++) ctx.lineTo(ox + t[i][0] * u, oy + t[i][1] * u);
  }
}
const ehCombinante = c => { const k = c.charCodeAt(0); return k >= 0x300 && k <= 0x36f; };

// Largura do texto com unidade de grade u (cada letra ocupa 6u)
function largTexto(txt, u) {
  let n = 0;
  for (const c of txt.normalize('NFD')) if (!ehCombinante(c)) n++;
  return Math.max(0, n * 6 * u - 2 * u);
}

// Desenha texto vetorial; y é o topo da linha. alinh: esq | centro | dir
function texto(txt, x, y, u, alinh = 'esq', cor = corAtual()) {
  const larg = largTexto(txt, u);
  let cx = alinh === 'centro' ? x - larg / 2 : alinh === 'dir' ? x - larg : x;
  let ultimo = cx;
  ctx.beginPath();
  for (const c of txt.normalize('NFD')) {
    if (ehCombinante(c)) {
      const a = ACENTOS[c.charCodeAt(0)];
      if (a) tracarGlifo(a, ultimo, y, u);
      continue;
    }
    const g = FONTE[c] || FONTE[c.toUpperCase()];
    if (g) tracarGlifo(g, cx, y, u);
    ultimo = cx;
    cx += 6 * u;
  }
  ctx.lineWidth = Math.max(1, u * 0.45);
  ctx.strokeStyle = cor;
  ctx.stroke();
}
// Igual a texto(), mas reduz o tamanho para caber em maxL pixels
function textoCabe(txt, x, y, u, alinh, cor, maxL) {
  const uu = Math.min(u, maxL / Math.max(1, largTexto(txt, 1)));
  texto(txt, x, y, uu, alinh, cor);
  return uu;
}

const corAtual = () => CORES[jogo.cor];

// =====================================================================
// 5. SOM (Web Audio, tudo sintetizado)
// =====================================================================
const som = { ctx: null, mestre: null, empuxoGanho: null, filtro: null, ruidoBranco: null };

function iniciarAudio() {
  if (som.ctx) { if (som.ctx.state === 'suspended') som.ctx.resume(); return; }
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;
  const c = som.ctx = new AC();
  som.mestre = c.createGain();
  som.mestre.gain.value = jogo.mudo ? 0 : 0.7;
  som.mestre.connect(c.destination);

  // Ruído marrom (grave) em loop para o propulsor
  const len = c.sampleRate * 2;
  const marrom = c.createBuffer(1, len, c.sampleRate);
  const d = marrom.getChannelData(0);
  let ult = 0;
  for (let i = 0; i < len; i++) {
    ult = (ult + 0.02 * (Math.random() * 2 - 1)) / 1.02;
    d[i] = ult * 3.5;
  }
  // Ruído branco para a explosão
  som.ruidoBranco = c.createBuffer(1, c.sampleRate, c.sampleRate);
  const b = som.ruidoBranco.getChannelData(0);
  for (let i = 0; i < b.length; i++) b[i] = Math.random() * 2 - 1;

  const fonte = c.createBufferSource();
  fonte.buffer = marrom; fonte.loop = true;
  som.filtro = c.createBiquadFilter();
  som.filtro.type = 'lowpass'; som.filtro.frequency.value = 300;
  som.empuxoGanho = c.createGain(); som.empuxoGanho.gain.value = 0;
  fonte.connect(som.filtro).connect(som.empuxoGanho).connect(som.mestre);
  fonte.start();
}

// Chamado a cada quadro: liga/desliga o ronco do propulsor
function atualizarSom() {
  if (!som.ctx) return;
  const t = som.ctx.currentTime;
  const ativo = jogo.estado === 'jogando' && !jogo.pausado;
  let alvo = 0;
  if (ativo && nave.propulsor) alvo = 0.9;
  else if (ativo && (nave.latE || nave.latD)) alvo = 0.4;
  som.empuxoGanho.gain.setTargetAtTime(alvo, t, 0.04);
  som.filtro.frequency.setTargetAtTime(alvo ? 300 + Math.random() * 140 : 200, t, 0.05);
}

function bipe(freq, dur, tipo = 'square', vol = 0.12, atraso = 0) {
  if (!som.ctx) return;
  const c = som.ctx, t = c.currentTime + atraso;
  const o = c.createOscillator(), g = c.createGain();
  o.type = tipo; o.frequency.value = freq;
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g).connect(som.mestre);
  o.start(t); o.stop(t + dur + 0.02);
}

function somExplosao() {
  if (!som.ctx) return;
  const c = som.ctx, t = c.currentTime;
  const r = c.createBufferSource(); r.buffer = som.ruidoBranco;
  const f = c.createBiquadFilter(); f.type = 'lowpass';
  f.frequency.setValueAtTime(2000, t);
  f.frequency.exponentialRampToValueAtTime(80, t + 0.9);
  const g = c.createGain();
  g.gain.setValueAtTime(0.9, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + 1.0);
  r.connect(f).connect(g).connect(som.mestre);
  r.start(t); r.stop(t + 1.05);
  // pancada grave
  const o = c.createOscillator(), go = c.createGain();
  o.type = 'sine';
  o.frequency.setValueAtTime(110, t);
  o.frequency.exponentialRampToValueAtTime(30, t + 0.5);
  go.gain.setValueAtTime(0.8, t);
  go.gain.exponentialRampToValueAtTime(0.001, t + 0.6);
  o.connect(go).connect(som.mestre);
  o.start(t); o.stop(t + 0.65);
}

function somPouso(perfeito) {
  bipe(660, 0.15, 'triangle', 0.18);
  bipe(880, 0.2, 'triangle', 0.18, 0.15);
  if (perfeito) bipe(1320, 0.3, 'triangle', 0.18, 0.32);
}

function alternarMudo() {
  jogo.mudo = !jogo.mudo;
  salvarPrefs();
  if (som.ctx) som.mestre.gain.setTargetAtTime(jogo.mudo ? 0 : 0.7, som.ctx.currentTime, 0.02);
}

// =====================================================================
// 6. TERRENO PROCEDURAL E ESTRELAS
// =====================================================================
// Soma de senoides com fases aleatórias; devolve função com valores em [-1, 1]
function criarOndas(n, fMin, fMax) {
  const ondas = [];
  for (let i = 0; i < n; i++) ondas.push({ f: aleat(fMin, fMax) * (i + 1) * 1.6, p: aleat(0, Math.PI * 2), amp: 1 / (i + 1.3) });
  const soma = ondas.reduce((s, o) => s + o.amp, 0);
  return x => { let y = 0; for (const o of ondas) y += Math.sin(x * o.f + o.p) * o.amp; return y / soma; };
}

// Sorteia uma plataforma livre (longe das outras e dos intervalos em "evitar")
function sortearPlataforma(plats, w, mult, evitar = []) {
  const L = CFG.MUNDO_L;
  for (let t = 0; t < 400; t++) {
    const x0 = aleat(60, L - 60 - w), x1 = x0 + w;
    if (plats.every(p => x1 + 70 < p.x0 || x0 - 70 > p.x1) && evitar.every(([a, b]) => x1 < a || x0 > b)) {
      plats.push({ x0, x1, mult });
      return;
    }
  }
}

// Sorteia centros para elementos do relevo (crateras, cânions, torres) sem sobreposição.
// meias: meias-larguras; devolve [{c, h, i}] com i = índice em meias
function sortearIntervalos(meias, folga) {
  const L = CFG.MUNDO_L, res = [];
  meias.forEach((h, i) => {
    for (let t = 0; t < 400; t++) {
      const c = aleat(80 + h, L - 80 - h);
      if (res.every(r => Math.abs(r.c - c) > r.h + h + folga)) { res.push({ c, h, i }); return; }
    }
  });
  return res;
}
const plataformaEm = (c, w, mult) => ({ x0: c - w / 2, x1: c + w / 2, mult });

// --- Perfil 1: planície ondulada, plataformas espalhadas ---
function perfilPlanicie(dif, larg) {
  const A = CFG.MUNDO_A, base = A * 0.74, relevo = Math.min(160 + dif * 45, 420);
  const onda = criarOndas(5, 0.0025, 0.004);
  const plats = [];
  for (const m of dif < 2 ? [2, 2, 3, 5] : [2, 3, 5]) sortearPlataforma(plats, larg(m), m);
  return { nome: 'PLANÍCIE', altura: x => base + onda(x) * relevo / 2, plats, aspereza: 5 + dif * 3, passo: [8, 24] };
}

// --- Perfil 2: crateras com borda elevada e fundo plano; x5 na cratera pequena e funda ---
function perfilCrateras(dif, larg) {
  const A = CFG.MUNDO_A, base = A * 0.68, onda = criarOndas(3, 0.0015, 0.003), relevo = 60 + dif * 10;
  const raios = [Math.max(55, larg(5) / 1.1) + aleat(0, 10), Math.max(70, larg(3) / 1.1) + aleat(0, 25),
                 aleat(80, 160), aleat(70, 140), aleat(60, 120)];
  const cr = sortearIntervalos(raios.map(r => r * 1.4), 30).map(o => {
    const R = o.h / 1.4, D = (o.i === 0 ? 1.4 : 1) * aleat(55, 95) * (1 + dif * 0.12);
    return { c: o.c, R, D, borda: D * 0.5, i: o.i };
  });
  const altura = x => {
    let y = base + onda(x) * relevo;
    for (const k of cr) {
      const d = Math.abs(x - k.c) / k.R;
      if (d < 1) y += k.D * Math.min(1, (1 - d * d) * 1.7); // fundo plano para d < 0,64
      y -= k.borda * Math.exp(-(((d - 1) / 0.2) ** 2));     // borda elevada
    }
    return y;
  };
  const plats = [];
  const fundo = (i, m) => { const k = cr.find(q => q.i === i); if (k) plats.push(plataformaEm(k.c, larg(m), m)); else sortearPlataforma(plats, larg(m), m); };
  fundo(0, 5); fundo(1, 3);
  const evitar = cr.map(k => [k.c - k.R * 1.5, k.c + k.R * 1.5]);
  for (const m of dif < 2 ? [2, 2] : [2]) sortearPlataforma(plats, larg(m), m, evitar);
  return { nome: 'CRATERAS', altura, plats, aspereza: 4 + dif * 2, passo: [7, 18] };
}

// --- Perfil 3: planalto cortado por cânions de paredes verticais, com torres ---
function perfilCanions(dif, larg) {
  const A = CFG.MUNDO_A, base = A * 0.48, onda = criarOndas(3, 0.002, 0.004), relevo = 70, t = 6;
  const meias = [(larg(5) + aleat(14, 24)) / 2 + t, (larg(3) + aleat(20, 40)) / 2 + t, aleat(55, 85) + t];
  const nTorres = dif >= 4 ? 3 : 2;
  for (let i = 0; i < nTorres; i++) meias.push(aleat(10, 22));
  const elems = sortearIntervalos(meias, 50).map(o => o.i < 3
    ? { c: o.c, meia: o.h - t, prof: aleat(200, 320) + dif * 15, i: o.i }       // cânion (desce)
    : { c: o.c, meia: o.h - t, prof: -aleat(90, 170) * (1 + dif * 0.08), i: o.i }); // torre (sobe)
  const altura = x => {
    let y = base + onda(x) * relevo;
    for (const e of elems) y += e.prof * clamp((e.meia + t - Math.abs(x - e.c)) / t, 0, 1);
    return y;
  };
  // Vértices exatos nos cantos para as paredes ficarem retas
  const bordas = [];
  for (const e of elems) bordas.push(e.c - e.meia - t, e.c - e.meia, e.c + e.meia, e.c + e.meia + t);
  const plats = [];
  [[0, 5], [1, 3], [2, 2]].forEach(([i, m]) => {
    const e = elems.find(q => q.i === i);
    if (e) plats.push(plataformaEm(e.c, larg(m), m)); else sortearPlataforma(plats, larg(m), m);
  });
  sortearPlataforma(plats, larg(2), 2, elems.map(e => [e.c - e.meia - 30, e.c + e.meia + 30]));
  return { nome: 'CÂNIONS', altura, plats, bordas, aspereza: 3 + dif, passo: [6, 16] };
}

// --- Perfil 4: cordilheira de picos pontiagudos; plataformas nos vales ---
function perfilMontanhas(dif, larg) {
  const A = CFG.MUNDO_A, L = CFG.MUNDO_L, base = A * 0.93, relevo = Math.min(330 + dif * 35, 560);
  const ondas = [];
  for (let i = 0; i < 4; i++) ondas.push({ f: aleat(0.003, 0.005) * (i + 1), p: aleat(0, 6.3), amp: 1 / (i + 1) });
  const soma = ondas.reduce((s, o) => s + o.amp, 0);
  // 1-|sen| tem cúspide no topo (pico agudo) e fundo arredondado (vale)
  const altura = x => {
    let s = 0;
    for (const o of ondas) s += (1 - Math.abs(Math.sin(x * o.f + o.p))) * o.amp;
    return base - (s / soma) * relevo;
  };
  const vales = [];
  for (let x = 90; x < L - 90; x += 4) if (altura(x) > altura(x - 4) && altura(x) >= altura(x + 4)) vales.push(x);
  vales.sort(() => Math.random() - 0.5);
  const plats = [];
  for (const m of dif < 2 ? [5, 3, 2, 2] : [5, 3, 2]) {
    const w = larg(m);
    const v = vales.find(x => plats.every(p => x + w / 2 + 70 < p.x0 || x - w / 2 - 70 > p.x1));
    if (v !== undefined) plats.push(plataformaEm(v, w, m)); else sortearPlataforma(plats, w, m);
  }
  return { nome: 'MONTANHAS', altura, plats, aspereza: 8 + dif * 3, passo: [7, 18] };
}

// --- Perfil 5: caverna. Um poço de paredes irregulares com saliências alternadas dos
// dois lados: a nave desce em zigue-zague, de lado e depois para baixo, até o fundo.
// A linha do terreno volta para trás sob as saliências (não é mais uma altura por x).
function perfilCaverna(dif, larg, volta) {
  const L = CFG.MUNDO_L, A = CFG.MUNDO_A;
  const sup = A * aleat(0.26, 0.31), fundo = A * 0.95, rug = 4 + volta;
  const c = aleat(L * 0.38, L * 0.62), S = Math.max(340, aleat(440, 500) - volta * 35);
  const ondaS = criarOndas(3, 0.002, 0.004), ondaE = criarOndas(3, 0.004, 0.008), ondaD = criarOndas(3, 0.004, 0.008);
  const ySup = x => sup + ondaS(x) * 35;
  const xE = y => c - S / 2 + ondaE(y) * 28, xD = y => c + S / 2 + ondaD(y) * 28;
  const n = volta ? 3 : 2, frac = Math.min(0.58 + volta * 0.05, 0.7), esp = (fundo - sup) / (n + 1);
  const lado0 = Math.random() < 0.5 ? 1 : -1; // 1: a saliência sai da parede esquerda
  const sal = [];
  for (let k = 0; k < n; k++) {
    const y = sup + esp * (k + 1) + aleat(-12, 12), lado = k % 2 ? -lado0 : lado0;
    const e = xE(y), d = xD(y), w = (d - e) * (frac + aleat(-0.03, 0.03));
    sal.push({ y, lado, ponta: lado > 0 ? e + w : d - w, t: aleat(30, 42), plats: [] });
  }
  // Plataformas: x2 na primeira saliência, x3 na última, x5 no fundo. Nas saliências, a
  // plataforma fica no trecho aberto por cima (sob a passagem deixada pela anterior)
  const wp = larg(2), plats = [];
  sal.forEach((s, k) => {
    if (k && k < n - 1) return;
    const raiz = s.lado > 0 ? xE(s.y) : xD(s.y), ant = sal[k - 1];
    let a = Math.min(raiz, s.ponta), b = Math.max(raiz, s.ponta);
    if (ant) { if (s.lado > 0) b = Math.min(b, ant.ponta); else a = Math.max(a, ant.ponta); }
    const pc = clamp((a + b) / 2, Math.min(raiz, s.ponta) + wp / 2 + 14, Math.max(raiz, s.ponta) - wp / 2 - 14);
    const p = { ...plataformaEm(pc, wp, k ? 3 : 2), y: s.y };
    s.plats.push(p); plats.push(p);
  });
  const e0 = xE(fundo), d0 = xD(fundo);
  const pf = { ...plataformaEm(aleat(e0 + S * 0.2 + wp / 2, d0 - S * 0.2 - wp / 2), wp, 5), y: fundo };
  plats.push(pf);

  const pts = [], ponto = (x, y) => pts.push({ x, y });
  // Pontos internos de um trecho horizontal (x crescente), com as plataformas planas
  const horizontal = (xa, xb, yFn, ps = []) => {
    const feitas = new Set();
    for (let x = xa + aleat(8, 16); x < xb - 6; x += aleat(10, 22)) {
      const p = ps.find(q => x > q.x0 - 4 && x < q.x1 + 4);
      if (p) { if (!feitas.has(p)) { ponto(p.x0, p.y); ponto(p.x1, p.y); feitas.add(p); } continue; }
      ponto(x, yFn(x) + aleat(-rug, rug));
    }
  };
  // Pontos internos de uma parede, de ya até yb (para baixo ou para cima)
  const parede = (ya, yb, xFn) => {
    const s = Math.sign(yb - ya);
    for (let y = ya + s * aleat(10, 18); s * (yb - y) > 6; y += s * aleat(12, 24)) ponto(xFn(y) + aleat(-rug, rug), y);
  };
  // Pontos internos de um trecho inclinado (parte de baixo das saliências)
  const inclinado = (xa, ya, xb, yb) => {
    const k = Math.max(1, Math.round(Math.hypot(xb - xa, yb - ya) / 16));
    for (let i = 1; i < k; i++) ponto(xa + (xb - xa) * i / k + aleat(-3, 3), ya + (yb - ya) * i / k + aleat(-rug, rug));
  };

  // Superfície da esquerda e boca do poço
  const yE0 = ySup(xE(sup)), xE0 = xE(yE0), yD0 = ySup(xD(sup)), xD0 = xD(yD0);
  ponto(0, ySup(0)); horizontal(0, xE0, ySup); ponto(xE0, yE0);
  // Parede esquerda, descendo, com as saliências que saem dela
  let y = yE0;
  for (const s of sal.filter(q => q.lado > 0)) {
    const yR = s.y + s.t * 1.6;
    parede(y, s.y, xE); ponto(xE(s.y), s.y);
    horizontal(xE(s.y), s.ponta, () => s.y, s.plats);
    ponto(s.ponta, s.y); ponto(s.ponta - 10, s.y + s.t * 0.7);
    inclinado(s.ponta - 10, s.y + s.t * 0.7, xE(yR), yR); ponto(xE(yR), yR);
    y = yR;
  }
  parede(y, fundo, xE); ponto(e0, fundo);
  horizontal(e0, d0, () => fundo, [pf]); ponto(d0, fundo);
  // Parede direita, subindo
  y = fundo;
  for (const s of sal.filter(q => q.lado < 0).reverse()) {
    const yR = s.y + s.t * 1.6;
    parede(y, yR, xD); ponto(xD(yR), yR);
    inclinado(xD(yR), yR, s.ponta + 10, s.y + s.t * 0.7);
    ponto(s.ponta + 10, s.y + s.t * 0.7); ponto(s.ponta, s.y);
    horizontal(s.ponta, xD(s.y), () => s.y, s.plats); ponto(xD(s.y), s.y);
    y = s.y;
  }
  parede(y, yD0, xD); ponto(xD0, yD0);
  horizontal(xD0, L, ySup); ponto(L, ySup(L));
  return { nome: 'CAVERNA', dica: 'DESÇA ATÉ O FUNDO - TANQUE CHEIO', pts, plats, caverna: true, ceu: Math.min(yE0, yD0) };
}

// --- Perfil 6: mesas de paredes verticais sob vento que muda de força e de lado.
// x5 no topo estreito da mesa mais alta, x3 noutra mesa, x2 no chão entre elas.
function perfilMesas(dif, larg, volta) {
  const A = CFG.MUNDO_A, base = A * 0.86, onda = criarOndas(4, 0.002, 0.004), t = 10;
  const meias = [larg(5) / 2 + aleat(8, 16), larg(3) / 2 + aleat(16, 30), aleat(45, 75), aleat(30, 55)];
  const ms = sortearIntervalos(meias.map(h => h + t), 90).map(o => {
    const alt = o.i === 0 ? aleat(330, 400) : aleat(160, 290);
    return { c: o.c, meia: o.h - t, topo: base + onda(o.c) * 40 - alt, i: o.i };
  });
  const altura = x => {
    let y = base + onda(x) * 40;
    for (const m of ms) y += (m.topo - y) * clamp((m.meia + t - Math.abs(x - m.c)) / t, 0, 1);
    return y;
  };
  const bordas = [];
  for (const m of ms) bordas.push(m.c - m.meia - t, m.c - m.meia, m.c + m.meia, m.c + m.meia + t);
  const plats = [];
  [[0, 5], [1, 3]].forEach(([i, m]) => {
    const k = ms.find(q => q.i === i);
    if (k) plats.push(plataformaEm(k.c, larg(m), m)); else sortearPlataforma(plats, larg(m), m);
  });
  sortearPlataforma(plats, larg(2), 2, ms.map(m => [m.c - m.meia - t - 40, m.c + m.meia + t + 40]));
  const vento = { V: Math.min(12, 7 + 2 * volta), p1: aleat(0, 6.3), p2: aleat(0, 6.3) };
  return { nome: 'MESAS', dica: 'CUIDADO COM O VENTO', altura, plats, bordas, aspereza: 3, passo: [6, 16], vento };
}

// --- Perfil 7: gelo pontiagudo, sem lugar para pousar no chão. As plataformas flutuam
// em três alturas e vão e vêm; a x5, mais rápida, também sobe e desce. Para pousar é
// preciso acompanhar a plataforma: valem as velocidades em relação a ela.
function perfilMoveis(dif, larg, volta) {
  const A = CFG.MUNDO_A, L = CFG.MUNDO_L, base = A * 0.97, relevo = 120;
  const ondas = [];
  for (let i = 0; i < 4; i++) ondas.push({ f: aleat(0.007, 0.012) * (i + 1), p: aleat(0, 6.3), amp: 1 / (i + 1) });
  const soma = ondas.reduce((s, o) => s + o.amp, 0);
  const altura = x => {
    let s = 0;
    for (const o of ondas) s += (1 - Math.abs(Math.sin(x * o.f + o.p))) * o.amp;
    return base - (s / soma) * relevo;
  };
  const faixas = [A * 0.4, A * 0.57, A * 0.74].sort(() => Math.random() - 0.5);
  const rapidez = 1 + 0.15 * volta;
  const moveis = [[2, 18, 24], [3, 26, 34], [5, 32, 40]].map(([m, v0, v1], i) => {
    const w = larg(m) * 1.15, amp = m === 5 ? aleat(120, 200) : aleat(170, 300);
    const cx = aleat(80 + amp + w / 2, L - 80 - amp - w / 2);
    const mov = { cx, w, amp, om: aleat(v0, v1) * rapidez / amp, f: aleat(0, 6.3), y0: faixas[i], ampY: m === 5 ? 35 : 0, f2: aleat(0, 6.3) };
    return { ...plataformaEm(cx, w, m), y: faixas[i], vx: 0, vy: 0, mov };
  });
  return { nome: 'PLATAFORMAS MÓVEIS', dica: 'ACOMPANHE A PLATAFORMA PARA POUSAR', altura, plats: [], moveis, aspereza: 7, passo: [5, 13] };
}

// --- Perfil 8: vulcões de cratera aberta que lançam rochas de tempos em tempos.
// Pouco antes de cada erupção a cratera solta faíscas. Plataformas entre os vulcões.
function perfilVulcoes(dif, larg, volta) {
  const A = CFG.MUNDO_A, base = A * 0.84, onda = criarOndas(4, 0.002, 0.005), relevo = 50;
  const cones = sortearIntervalos([aleat(105, 130), aleat(100, 125), aleat(95, 120)], 110)
    .map(o => ({ c: o.c, R: o.h, H: aleat(170, 240), cw: 22 }));
  // Cone de flancos côncavos, truncado na borda da cratera (cw) e com o fundo afundado
  const altura = x => {
    let y = base + onda(x) * relevo;
    for (const k of cones) {
      const d = Math.abs(x - k.c), dd = Math.max(d, k.cw);
      if (dd < k.R) y -= k.H * ((1 - dd / k.R) / (1 - k.cw / k.R)) ** 1.3;
      if (d < k.cw) y += 22 * (1 - (d / k.cw) ** 2);
    }
    return y;
  };
  const bordas = [];
  for (const k of cones) bordas.push(k.c - k.cw, k.c, k.c + k.cw);
  const evitar = cones.map(k => [k.c - k.R - 15, k.c + k.R + 15]);
  const plats = [];
  for (const m of [5, 3, 2]) sortearPlataforma(plats, larg(m), m, evitar);
  const vulcoes = cones.map(k => {
    const periodo = aleat(3.5, 5) / (1 + 0.2 * volta);
    return { x: k.c, y: altura(k.c + k.cw) - 4, periodo, t: aleat(0, periodo), n: 3 + volta };
  });
  return { nome: 'VULCÕES', dica: 'DESVIE DAS ROCHAS DOS VULCÕES', altura, plats, bordas, aspereza: 4, passo: [6, 16], vulcoes };
}

// --- Perfil 9: gravidade baixa e três pousos em ordem (1, 2 e 3), em vales separados
// por dois pináculos altos. A 1 fica do lado oposto ao da chegada, a 2 do lado da
// chegada e a 3, a última, no meio: é preciso decolar de novo e cruzar os pináculos.
function perfilEntrega(dif, larg, volta) {
  const A = CFG.MUNDO_A, L = CFG.MUNDO_L, base = A * 0.8, onda = criarOndas(4, 0.002, 0.005), relevo = 110;
  const pin = [L / 3, 2 * L / 3].map(c => ({ c: c + aleat(-60, 60), R: aleat(45, 65), H: aleat(330, 420) + volta * 40 }));
  const altura = x => {
    let y = base + onda(x) * relevo;
    for (const p of pin) { const d = Math.abs(x - p.c); if (d < p.R) y -= p.H * (1 - d / p.R) ** 0.7; }
    return y;
  };
  const vales = [[60, pin[0].c - pin[0].R - 40], [pin[0].c + pin[0].R + 40, pin[1].c - pin[1].R - 40], [pin[1].c + pin[1].R + 40, L - 60]];
  const inicio = Math.random() < 0.5 ? 'esq' : 'dir';
  const ordem = inicio === 'esq' ? [2, 0, 1] : [0, 2, 1];
  const plats = [2, 3, 5].map((m, k) => {
    const [a, b] = vales[ordem[k]], w = larg(m);
    return { ...plataformaEm(aleat(a + w / 2, b - w / 2), w, m), seq: k };
  });
  return { nome: 'POUSO EM SEQUÊNCIA', dica: 'POUSE NA 1, NA 2 E NA 3 - TANQUE CHEIO', altura, plats, aspereza: 6, passo: [7, 18], entrega: { atual: 0 }, inicio };
}

// --- Perfil 10: túnel. Um maciço atravessado por um túnel sinuoso e sem saída, com
// estalactites, estalagmites e trechos apertados. x2 logo na entrada, x3 no meio e x5
// no fim. Montado com a entrada à esquerda e espelhado na metade das vezes.
function perfilTunel(dif, larg, volta) {
  const L = CFG.MUNDO_L, A = CFG.MUNDO_A, rug = 3;
  const ondaP = criarOndas(3, 0.003, 0.006), ondaS = criarOndas(3, 0.003, 0.006), ondaT = criarOndas(2, 0.004, 0.006);
  const yPl = x => A * 0.86 + ondaP(x) * 18;   // planície dos dois lados
  const ySu = x => A * 0.2 + ondaS(x) * 30;    // cume do maciço
  const xm0 = aleat(230, 290), xa = xm0 + 70, xb = L - aleat(230, 270), xs1 = xb + 60, xm1 = xs1 + 110;
  const H0 = Math.max(58, 64 - 3 * volta), Hap = Math.max(38, 43 - 3 * volta), amp = Math.min(100, 85 + 15 * volta);

  // Plataformas: posições primeiro, para o túnel ficar reto em volta delas
  const w2 = larg(2), w3 = larg(3), w5 = larg(5);
  const plats = [
    plataformaEm(xa + 50 + w2 / 2, w2, 2),
    plataformaEm(xa + (xb - xa) * aleat(0.45, 0.55), w3, 3),
    plataformaEm(xb - 16 - w5 / 2, w5, 5),
  ];
  const livre = (x, folga) => plats.every(p => x < p.x0 - folga || x > p.x1 + folga);
  // Linha central: ondulada, reta em volta das plataformas (transição suave e longa) e
  // com inclinação limitada, para nenhuma curva fechar a passagem. Tabelada a cada 2
  const ycB = x => A * 0.6 + ondaT(x) * amp;
  const tab = [], X0 = xa - 20, DX = 2, INC = 0.9 * DX;
  for (let x = X0; x <= xb + 20; x += DX) {
    let y = ycB(x);
    for (const p of plats) {
      const c = (p.x0 + p.x1) / 2, h = (p.x1 - p.x0) / 2, k = clamp((h + 160 - Math.abs(x - c)) / 140, 0, 1);
      y += (ycB(c) - y) * k * k * (3 - 2 * k);
    }
    tab.push(y);
  }
  for (let i = 1; i < tab.length; i++) tab[i] = clamp(tab[i], tab[i - 1] - INC, tab[i - 1] + INC);
  for (let i = tab.length - 2; i >= 0; i--) tab[i] = clamp(tab[i], tab[i + 1] - INC, tab[i + 1] + INC);
  const yc = x => {
    const f = clamp((x - X0) / DX, 0, tab.length - 1.001), i = Math.floor(f);
    return tab[i] + (tab[i + 1] - tab[i]) * (f - i);
  };
  // Trechos apertados e pontas (estalactites no teto, estalagmites no chão)
  const apertos = [];
  for (let t = 0; t < 300 && apertos.length < Math.min(4, 2 + volta); t++) {
    const c = aleat(xa + 150, xb - 120);
    if (livre(c, 80) && apertos.every(a => Math.abs(a - c) > 160)) apertos.push(c);
  }
  const h = x => {
    let k = 0;
    for (const a of apertos) k = Math.max(k, clamp(1 - (Math.abs(x - a) - 25) / 45, 0, 1));
    return H0 - (H0 - Hap) * k * k * (3 - 2 * k);
  };
  const pontas = [];
  for (let t = 0; t < 400 && pontas.length < 4 + 2 * volta; t++) {
    const c = aleat(xa + 100, xb - 60);
    if (livre(c, 40) && apertos.every(a => Math.abs(a - c) > 90) && pontas.every(p => Math.abs(p.c - c) > 70)) {
      pontas.push({ c, hw: aleat(10, 15), alt: aleat(24, 32), teto: pontas.length % 2 === 0 });
    }
  }
  const yF = x => yc(x) + h(x), yC = x => yc(x) - h(x);
  for (const p of plats) p.y = yF((p.x0 + p.x1) / 2);

  const pts = [], ponto = (x, y) => pts.push({ x, y });
  // Pontos internos de um trecho, com x crescente, plataformas planas e pontas
  const trecho = (x0, x1, yFn, ps, ns, sinal) => {
    const r = [];
    let x = x0 + aleat(8, 14);
    while (x < x1 - 6) {
      const p = ps.find(q => x > q.x0 - 4 && x < q.x1 + 4);
      const s = ns.find(q => x > q.c - q.hw - 4 && x < q.c + q.hw + 4);
      if (p) { r.push({ x: p.x0, y: p.y }, { x: p.x1, y: p.y }); x = p.x1 + aleat(8, 14); }
      else if (s) {
        r.push({ x: s.c - s.hw, y: yFn(s.c - s.hw) }, { x: s.c + aleat(-3, 3), y: yFn(s.c) + sinal * s.alt }, { x: s.c + s.hw, y: yFn(s.c + s.hw) });
        x = s.c + s.hw + aleat(8, 14);
      } else { r.push({ x, y: yFn(x) + aleat(-rug, rug) }); x += aleat(10, 20); }
    }
    return r;
  };
  const inclinado = (xa_, ya, xb_, yb) => {
    const k = Math.max(1, Math.round(Math.hypot(xb_ - xa_, yb - ya) / 16));
    for (let i = 1; i < k; i++) ponto(xa_ + (xb_ - xa_) * i / k + aleat(-3, 3), ya + (yb - ya) * i / k + aleat(-rug, rug));
  };
  // Planície, encosta até a boca, chão do túnel, parede do fundo, teto (de volta),
  // aba sobre a boca, cume e encosta do outro lado
  ponto(0, yPl(0)); pts.push(...trecho(0, xm0, yPl, [], [], 0)); ponto(xm0, yPl(xm0));
  inclinado(xm0, yPl(xm0), xa, yF(xa)); ponto(xa, yF(xa));
  pts.push(...trecho(xa, xb, yF, plats, pontas.filter(p => !p.teto), -1)); ponto(xb, yF(xb));
  for (let y = yF(xb) - aleat(10, 16); y > yC(xb) + 6; y -= aleat(12, 20)) ponto(xb + aleat(-3, 2), y);
  ponto(xb, yC(xb));
  pts.push(...trecho(xa, xb, yC, [], pontas.filter(p => p.teto), 1).reverse()); ponto(xa, yC(xa));
  inclinado(xa, yC(xa), xa + 50, ySu(xa + 50)); ponto(xa + 50, ySu(xa + 50));
  pts.push(...trecho(xa + 50, xs1, ySu, [], [], 0)); ponto(xs1, ySu(xs1));
  inclinado(xs1, ySu(xs1), xm1, yPl(xm1)); ponto(xm1, yPl(xm1));
  pts.push(...trecho(xm1, L, yPl, [], [], 0)); ponto(L, yPl(L));

  let inicio = 'esq';
  if (Math.random() < 0.5) { // espelha: entrada à direita
    inicio = 'dir';
    for (const p of pts) p.x = L - p.x;
    pts.reverse();
    for (const p of plats) [p.x0, p.x1] = [L - p.x1, L - p.x0];
  }
  return { nome: 'TÚNEL', dica: 'ATRAVESSE O TÚNEL ATÉ O FIM - TANQUE CHEIO', pts, plats, caverna: true, ceu: A * 0.2 - 30, inicio };
}

// Monta o terreno da fase: um perfil por fase, em ciclo, cada volta mais difícil
function gerarTerreno(fase) {
  const L = CFG.MUNDO_L, A = CFG.MUNDO_A, dif = fase - 1, f = dadosFase(fase);
  // Plataformas encolhem; nas fases de mecânica nova, só a cada volta
  const escala = f.novo ? Math.max(0.6, 0.9 - 0.1 * f.volta) : Math.max(0.5, 1 - 0.07 * dif);
  const larg = m => Math.max(36, { 2: 95, 3: 66, 5: 44 }[m] * escala);
  const limY = y => clamp(y, A * 0.22, A * 0.96);
  const { altura, plats, aspereza, passo, bordas, moveis = [], ...extras } = f.perfil(dif, larg, f.volta);
  if (extras.pts) return indexar({ ...extras, plataformas: plats.sort((a, b) => a.x0 - b.x0) });

  const plataformas = plats.sort((a, b) => a.x0 - b.x0);
  for (const p of plataformas) p.y = limY(altura((p.x0 + p.x1) / 2));

  // Posições x dos vértices: passos irregulares + cantos obrigatórios do perfil
  const xs = [...(bordas || []), L];
  for (let x = 0; x < L; x += aleat(passo[0], passo[1])) xs.push(x);
  xs.sort((a, b) => a - b);

  // Linha contínua, com trechos planos nas plataformas
  const pts = [];
  let ip = 0;
  for (const x of xs) {
    while (ip < plataformas.length && x > plataformas[ip].x0 - 2) {
      const p = plataformas[ip++];
      pts.push({ x: p.x0, y: p.y }, { x: p.x1, y: p.y });
    }
    if (plataformas.some(p => x >= p.x0 - 2 && x <= p.x1 + 2)) continue;
    if (pts.length && x - pts[pts.length - 1].x < 0.5) continue;
    pts.push({ x, y: limY(altura(x) + aleat(-1, 1) * aspereza) });
  }
  // As plataformas móveis não fazem parte da linha do terreno
  return indexar({ ...extras, pts, plataformas: plataformas.concat(moveis) });
}

// A linha do terreno vai de x = 0 a x = MUNDO_L e a rocha fica abaixo dela. Nas
// cavernas a linha volta para trás sob as saliências, então uma vertical pode
// cruzá-la várias vezes. Os segmentos ficam numa grade por x para consultas rápidas.
const CEL = 25;
function indexar(t) {
  const g = new Map();
  for (let i = 0; i < t.pts.length - 1; i++) {
    const a = t.pts[i], b = t.pts[i + 1];
    for (let k = Math.floor(Math.min(a.x, b.x) / CEL); k <= Math.floor(Math.max(a.x, b.x) / CEL); k++) {
      if (!g.has(k)) g.set(k, []);
      g.get(k).push(i);
    }
  }
  t.grade = g;
  return t;
}
// Alturas (y) em que a vertical x cruza a linha do terreno
function cruzamentos(x) {
  x = clamp(x, 0, CFG.MUNDO_L - 0.001);
  const p = terreno.pts, r = [];
  for (const i of terreno.grade.get(Math.floor(x / CEL)) || []) {
    const a = p[i], b = p[i + 1];
    if (x < Math.min(a.x, b.x) || x >= Math.max(a.x, b.x)) continue;
    r.push(a.y + (b.y - a.y) * (x - a.x) / (b.x - a.x));
  }
  return r;
}
// Dentro da rocha: a linha passa um número ímpar de vezes acima do ponto
const dentroRocha = (x, y) => cruzamentos(x).filter(c => c < y).length % 2 === 1;
// Primeiro chão abaixo de (x, y)
const chaoAbaixo = (x, y) => Math.min(...cruzamentos(x).filter(c => c >= y));
// Superfície vista de cima
const superficieY = x => Math.min(...cruzamentos(x));
// Menor distância de (x, y) à linha do terreno, procurada até o raio r
function distTerreno(x, y, r) {
  const p = terreno.pts;
  let m = r;
  for (let k = Math.floor((x - r) / CEL); k <= Math.floor((x + r) / CEL); k++) {
    for (const i of terreno.grade.get(k) || []) {
      const a = p[i], b = p[i + 1], dx = b.x - a.x, dy = b.y - a.y;
      const t = clamp(((x - a.x) * dx + (y - a.y) * dy) / (dx * dx + dy * dy || 1), 0, 1);
      m = Math.min(m, Math.hypot(a.x + dx * t - x, a.y + dy * t - y));
    }
  }
  return m;
}
// Distância de (x, y) ao segmento (ax, ay)-(bx, by)
function distSeg(x, y, ax, ay, bx, by) {
  const dx = bx - ax, dy = by - ay;
  const t = clamp(((x - ax) * dx + (y - ay) * dy) / (dx * dx + dy * dy || 1), 0, 1);
  return Math.hypot(ax + dx * t - x, ay + dy * t - y);
}
// Como chaoAbaixo e distTerreno, mas contando também as plataformas móveis
function chaoComPlataformas(x, y) {
  let c = chaoAbaixo(x, y);
  for (const p of terreno.plataformas) if (p.mov && x >= p.x0 && x <= p.x1 && p.y >= y) c = Math.min(c, p.y);
  return c;
}
function distObstaculos(x, y, r) {
  let m = distTerreno(x, y, r);
  for (const p of terreno.plataformas) if (p.mov) m = Math.min(m, distSeg(x, y, p.x0, p.y, p.x1, p.y));
  return m;
}

// =====================================================================
// 6b. MECÂNICAS DAS FASES (vento, plataformas móveis, vulcões)
// =====================================================================
// Vento: aceleração horizontal que muda de força e de lado devagar, com rajadas.
// Mais fraco perto do chão (metade da força rente ao solo).
function ventoEm(x, y) {
  const v = terreno.vento;
  if (!v) return 0;
  const t = jogo.mundoT, alt = clamp(chaoAbaixo(x, y) - y, 0, 600);
  return v.V * (0.5 + alt / 1200) *
    (0.75 * Math.sin(0.15 * t + v.p1) + 0.25 * Math.sin(0.83 * t + v.p2) + 0.12 * Math.sin(2.9 * t + 2 * v.p1));
}

function moverPlataformas() {
  const t = jogo.mundoT;
  for (const p of terreno.plataformas) {
    const m = p.mov;
    if (!m) continue;
    const a = m.om * t + m.f, b = m.om * 1.6 * t + m.f2, x = m.cx + m.amp * Math.sin(a);
    p.x0 = x - m.w / 2; p.x1 = x + m.w / 2;
    p.y = m.y0 + m.ampY * Math.sin(b);
    p.vx = m.amp * m.om * Math.cos(a); p.vy = m.ampY * m.om * 1.6 * Math.cos(b);
  }
}

// As rochas caem com gravidade própria, bem mais forte que a da fase: arcos rápidos,
// que sobem de 120 a 380 acima da cratera e duram poucos segundos
const G_ROCHA = 40;
function erupcao(v) {
  for (let i = 0; i < v.n; i++) {
    const ang = -Math.PI / 2 + aleat(-0.8, 0.8), vel = aleat(98, 174);
    rochas.push({
      x: v.x + aleat(-4, 4), y: v.y, vx: Math.cos(ang) * vel, vy: Math.sin(ang) * vel,
      r: aleat(3.5, 6), ang: 0, va: aleat(-5, 5), forma: Array.from({ length: 6 }, () => aleat(0.7, 1.15)),
    });
  }
  bipe(60, 0.5, 'sawtooth', 0.07);
}

// Tudo o que se move na fase sem depender da nave; roda também depois do pouso
// e da explosão
function atualizarMundo(dt) {
  jogo.mundoT += dt;
  const L = CFG.MUNDO_L, A = CFG.MUNDO_A;
  moverPlataformas();
  // A nave pousada numa plataforma móvel vai junto com ela
  const ap = nave && nave.apoio;
  if (ap && ap.p.mov) { nave.x = ap.p.x0 + ap.dx; nave.y = ap.p.y + ap.dy; }

  for (const v of terreno.vulcoes || []) {
    v.t += dt;
    if (v.t > v.periodo - 0.8 && Math.random() < 0.25) { // aviso: faíscas na cratera
      faiscas.push({ x: v.x + aleat(-8, 8), y: v.y + 2, vx: aleat(-12, 12), vy: aleat(-55, -25), vida: aleat(0.3, 0.6) });
    }
    if (v.t >= v.periodo) { v.t -= v.periodo; erupcao(v); }
  }
  for (const r of rochas) {
    r.vy += G_ROCHA * dt; r.x += r.vx * dt; r.y += r.vy * dt; r.ang += r.va * dt;
    if (dentroRocha(r.x, r.y + r.r * 0.6)) {
      r.morta = true;
      for (let i = 0; i < 6; i++) faiscas.push({ x: r.x, y: r.y, vx: aleat(-40, 40), vy: aleat(-50, -10), vida: aleat(0.2, 0.5) });
    }
    if (r.x < -50 || r.x > L + 50 || r.y > A + 50) r.morta = true;
  }
  if (rochas.length) rochas = rochas.filter(r => !r.morta);

  // Poeira levada pelo vento, só na parte visível do mundo
  if (terreno.vento) {
    const vw = cw / cam.zoom / 2 + 20, vh = ch / cam.zoom / 2 + 20;
    const x0 = cam.x - vw, x1 = cam.x + vw, y0 = cam.y - vh, y1 = cam.y + vh;
    while (poeira.length < 60) poeira.push({ x: aleat(x0, x1), y: aleat(y0, y1), k: aleat(0.6, 1.4), v: 0 });
    for (const p of poeira) {
      p.v = ventoEm(p.x, p.y);
      p.x += p.v * 14 * p.k * dt;
      if (p.y < y0 || p.y > y1) { p.x = aleat(x0, x1); p.y = aleat(y0, y1); }
      else if (p.x < x0 || p.x > x1) { p.x = p.v > 0 ? x0 : x1; p.y = aleat(y0, y1); }
    }
  }
}

// Rochas dos vulcões que encostam em alguma linha da nave
function verificarRochas() {
  const n = nave, c = Math.cos(n.a), s = Math.sin(n.a);
  for (const r of rochas) {
    const dx = r.x - n.x, dy = r.y - n.y;
    if (dx * dx + dy * dy > 900) continue;
    const lx = dx * c + dy * s, ly = -dx * s + dy * c;
    if (NAVE_LINHAS.some(l => distSeg(lx, ly, l[0], l[1], l[2], l[3]) < r.r)) {
      r.morta = true;
      explodir('ATINGIDA POR UMA ROCHA');
      return;
    }
  }
}

// Estrelas ficam no mundo, só acima do terreno
function gerarEstrelas() {
  estrelas = [];
  const L = CFG.MUNDO_L;
  while (estrelas.length < 170) {
    const x = aleat(-400, L + 400), y = aleat(-700, CFG.MUNDO_A);
    if (y < Math.min(superficieY(x), terreno.ceu ?? Infinity) - 25) {
      estrelas.push({ x, y, b: aleat(0.3, 1), f: aleat(0.5, 3), p: aleat(0, 6.3) });
    }
  }
}

// =====================================================================
// 7. NAVE (geometria em linhas, coordenadas locais com y para baixo)
// =====================================================================
const NAVE_LINHAS = [];
(function montarNave() {
  const poli = (pts, fechar) => {
    for (let i = 0; i < pts.length - 1; i++) NAVE_LINHAS.push([...pts[i], ...pts[i + 1]]);
    if (fechar) NAVE_LINHAS.push([...pts[pts.length - 1], ...pts[0]]);
  };
  poli([[-5, -16], [5, -16], [9, -12], [9, -6], [5, -3], [-5, -3], [-9, -6], [-9, -12]], true); // cabine
  poli([[-3, -12], [3, -12], [3, -8], [-3, -8]], true);       // janela
  poli([[0, -16], [0, -19]]);                                  // antena
  poli([[-11, -3], [11, -3], [11, 3], [-11, 3]], true);        // estágio de descida
  poli([[-8, 3], [-13, 10]]); poli([[8, 3], [13, 10]]);        // pernas
  poli([[-11, 0], [-13, 10]]); poli([[11, 0], [13, 10]]);      // escoras
  poli([[-16, 10], [-10, 10]]); poli([[10, 10], [16, 10]]);    // pés
  poli([[-3, 3], [-5, 7], [5, 7], [3, 3]]);                    // bocal
})();
const PES = [[-13, 10], [13, 10]];
const CASCO = [[-9, -12], [9, -12], [-5, -16], [5, -16], [0, -19], [-11, -3], [11, -3],
               [-11, 3], [11, 3], [-5, 7], [5, 7], [-9, -6], [9, -6]];

function novaNave() {
  // No túnel e no pouso em sequência a fase decide de que lado a nave chega
  const daEsq = terreno.inicio ? terreno.inicio === 'esq' : Math.random() < 0.5;
  nave = {
    x: daEsq ? 140 : CFG.MUNDO_L - 140, y: 70,
    vx: daEsq ? 30 : -30, vy: 0, a: 0,
    propulsor: false, latE: false, latD: false,
    apoio: null,       // plataforma em que a nave está parada: { p, dx, dy }
  };
  destrocos = []; faiscas = []; rochas = [];
  jogo.estado = 'jogando'; jogo.tEstado = 0; jogo.resultado = null; jogo.aviso = null;
}

// Converte ponto local da nave para coordenadas do mundo
function naveMundo(lx, ly) {
  const c = Math.cos(nave.a), s = Math.sin(nave.a);
  return { x: nave.x + lx * c - ly * s, y: nave.y + lx * s + ly * c };
}
const altitude = () => chaoComPlataformas(nave.x, nave.y) - (nave.y + 10);

// =====================================================================
// 8. FLUXO DO JOGO (início, fases, reinício)
// =====================================================================
function novaFase(n) {
  jogo.fase = n; jogo.mundoT = 0;
  terreno = gerarTerreno(n); gerarEstrelas();
  rochas = []; poeira = [];
  moverPlataformas();
}
function reiniciar() {
  jogo.pontos = 0; jogo.tempo = 0; jogo.comb = CFG.COMB_MAX;
  jogo.pausado = false;
  novaFase(jogo.faseIni);
  novaNave();
}
function proximaFase() {
  novaFase(jogo.fase + 1);
  registrarFase(jogo.fase);
  // Percursos longos (caverna, pouso em sequência, túnel): tanque cheio
  jogo.comb = dadosFase(jogo.fase).cheio ? CFG.COMB_MAX : Math.min(CFG.COMB_MAX, jogo.comb + CFG.COMB_MAX * CFG.RECARGA);
  novaNave();
}
function irMenu() {
  salvarRecorde();
  jogo.estado = 'menu'; jogo.pausado = false; jogo.menuSel = 0;
  destrocos = []; faiscas = []; rochas = []; poeira = [];
}
// Volta à lista de jogos (página inicial do app)
let saindo = false;
function voltarAosJogos() {
  saindo = true;
  location.href = '../';
}
function alternarPausa() {
  if (jogo.estado === 'menu') return;
  jogo.pausado = !jogo.pausado;
}
function alternarCor() {
  jogo.cor = jogo.cor === 'branco' ? 'verde' : 'branco';
  salvarPrefs();
}
// Enter / espaço / toque: confirma a tela atual
function avancar() {
  if (jogo.pausado) { jogo.pausado = false; return; }
  if (jogo.estado === 'menu') ativarItemMenu(jogo.menuSel);
  else if (jogo.estado === 'pousou' && jogo.tEstado > 0.8) proximaFase();
  else if (jogo.estado === 'destruida' && jogo.tEstado > 1.2) {
    if (jogo.resultado.fim) reiniciar(); else novaNave();
  }
}
// Itens do menu; a escolha da fase inicial só aparece depois de passar da fase 1
function itensMenu() {
  const it = [{ id: 'iniciar', txt: 'INICIAR JOGO' }];
  if (jogo.faseMax > 1) it.push({ id: 'fase', txt: 'FASE INICIAL: ' + jogo.faseIni + ' ' + dadosFase(jogo.faseIni).nome });
  it.push(
    { id: 'modo', txt: 'MODO: ' + (jogo.modo === 'classico' ? 'CLÁSSICO' : 'ARCADE') },
    { id: 'cor', txt: 'COR: ' + (jogo.cor === 'branco' ? 'BRANCO' : 'VERDE FÓSFORO') },
    { id: 'som', txt: 'SOM: ' + (jogo.mudo ? 'MUDO' : 'LIGADO') },
  );
  return it;
}
// dir: -1 com a seta para a esquerda (só muda algo na fase inicial)
function ativarItemMenu(i, dir = 1) {
  const id = (itensMenu()[i] || {}).id;
  if (id === 'iniciar') reiniciar();
  else if (id === 'fase') { jogo.faseIni = (jogo.faseIni - 1 + dir + jogo.faseMax) % jogo.faseMax + 1; salvarPrefs(); }
  else if (id === 'modo') { jogo.modo = jogo.modo === 'classico' ? 'arcade' : 'classico'; salvarPrefs(); }
  else if (id === 'cor') alternarCor();
  else if (id === 'som') alternarMudo();
}

// =====================================================================
// 9. FÍSICA (passo fixo)
// =====================================================================
function entrada() {
  const t = new Set(ponteiros.values());
  return {
    esq: !!(teclas.ArrowLeft || teclas.KeyA || t.has('esq')),
    dir: !!(teclas.ArrowRight || teclas.KeyD || t.has('dir')),
    cima: !!(teclas.ArrowUp || teclas.KeyW || teclas.Space || t.has('cima')),
  };
}

function atualizar(dt) {
  if (jogo.estado === 'menu') return;
  jogo.tEstado += dt;
  atualizarMundo(dt);
  atualizarDestrocos(dt);
  if (jogo.estado !== 'jogando') return;
  if (jogo.aviso && (jogo.aviso.t -= dt) <= 0) jogo.aviso = null;

  const n = nave, g = dadosFase(jogo.fase).g, T = empuxo(g), ent = entrada();
  const tinhaComb = jogo.comb > 0;
  jogo.tempo += dt;
  let ax = 0, ay = g;
  n.propulsor = n.latE = n.latD = false;

  if (jogo.modo === 'classico') {
    // Setas giram; propulsor empurra na direção para onde a nave aponta
    if (ent.esq) n.a -= CFG.GIRO * dt;
    if (ent.dir) n.a += CFG.GIRO * dt;
    n.a = clamp(n.a, -Math.PI / 2, Math.PI / 2);
    if (ent.cima && jogo.comb > 0) {
      ax += Math.sin(n.a) * T; ay -= Math.cos(n.a) * T;
      jogo.comb -= CFG.CONSUMO_PRINCIPAL * dt; n.propulsor = true;
    }
  } else {
    // Arcade: nave sempre na vertical, empuxo lateral direto
    n.a = 0;
    if (ent.cima && jogo.comb > 0) { ay -= T; jogo.comb -= CFG.CONSUMO_PRINCIPAL * dt; n.propulsor = true; }
    if (ent.esq && jogo.comb > 0) { ax -= CFG.EMPUXO_LATERAL; jogo.comb -= CFG.CONSUMO_LATERAL * dt; n.latE = true; }
    if (ent.dir && jogo.comb > 0) { ax += CFG.EMPUXO_LATERAL; jogo.comb -= CFG.CONSUMO_LATERAL * dt; n.latD = true; }
  }
  if (jogo.comb <= 0) {
    jogo.comb = 0;
    if (tinhaComb) bipe(180, 0.5, 'sawtooth', 0.15); // acabou: queda livre
  }

  // Alerta de combustível baixo
  if (jogo.comb > 0 && jogo.comb < CFG.COMB_MAX * CFG.COMB_BAIXO) {
    jogo.bipeT -= dt;
    if (jogo.bipeT <= 0) { bipe(990, 0.09); jogo.bipeT = 0.7; }
  }

  // Parada numa plataforma (pouso em sequência): fica até o propulsor vencer a gravidade.
  // Ao girar, a nave continua apoiada nos pés
  if (n.apoio) {
    if (ay >= 0) {
      n.vx = n.vy = 0;
      const pes = PES.map(p => naveMundo(p[0], p[1]));
      n.y -= Math.max(pes[0].y, pes[1].y) - n.apoio.p.y + 0.01;
      verificarRochas();
      return;
    }
    n.apoio = null; // decolou
  }
  ax += ventoEm(n.x, n.y);

  // Integração (inércia: nada freia a nave além do propulsor)
  n.vx += ax * dt; n.vy += ay * dt;
  n.x += n.vx * dt; n.y += n.vy * dt;

  // Limites do mundo
  if (n.x < 16) { n.x = 16; n.vx = 0; }
  if (n.x > CFG.MUNDO_L - 16) { n.x = CFG.MUNDO_L - 16; n.vx = 0; }
  if (n.y < -400) { n.y = -400; if (n.vy < 0) n.vy = 0; }

  verificarContato();
  if (jogo.estado === 'jogando') verificarRochas();
}

// Detecta contato com o terreno e decide entre pouso e destruição
function verificarContato() {
  const n = nave, c = Math.cos(n.a), s = Math.sin(n.a);
  let pesTocaram = false, cascoTocou = false;
  const pes = PES.map(p => naveMundo(p[0], p[1]));
  const casco = CASCO.map(p => naveMundo(p[0], p[1]));
  // Ponto do mundo dentro do contorno do casco
  const noCasco = (x, y) => {
    const dx = x - n.x, dy = y - n.y, lx = dx * c + dy * s, ly = -dx * s + dy * c;
    return lx > -11 && lx < 11 && ly > -17 && ly < 7.5;
  };
  for (const p of pes) if (dentroRocha(p.x, p.y)) pesTocaram = true;
  for (const w of casco) if (dentroRocha(w.x, w.y)) cascoTocou = true;
  // Picos e quinas do terreno que entram no casco entre dois pontos de teste
  for (const t of terreno.pts) {
    if (Math.abs(t.x - n.x) > 20 || Math.abs(t.y - n.y) > 25) continue;
    if (noCasco(t.x, t.y)) cascoTocou = true;
  }
  // Plataformas móveis: corpos sólidos de 7 de espessura
  let movel = null, bateuMovel = false;
  for (const p of terreno.plataformas) {
    if (!p.mov) continue;
    const dentro = (x, y) => x >= p.x0 && x <= p.x1 && y >= p.y && y <= p.y + 7;
    if (pes.some(f => dentro(f.x, f.y))) { pesTocaram = true; movel = p; }
    if (casco.some(w => dentro(w.x, w.y)) || [[p.x0, p.y], [p.x1, p.y], [p.x0, p.y + 7], [p.x1, p.y + 7]].some(q => noCasco(q[0], q[1]))) {
      cascoTocou = bateuMovel = true;
    }
  }
  if (!pesTocaram && !cascoTocou) return;

  const xmin = Math.min(pes[0].x, pes[1].x), xmax = Math.max(pes[0].x, pes[1].x);
  const yPes = Math.max(pes[0].y, pes[1].y);
  const plat = movel ? (xmin >= movel.x0 && xmax <= movel.x1 ? movel : null)
                     : terreno.plataformas.find(p => !p.mov && xmin >= p.x0 && xmax <= p.x1 && Math.abs(yPes - p.y) < 6);
  // Velocidades em relação à plataforma (as móveis também se mexem)
  const vx = n.vx - ((plat && plat.vx) || 0), vy = n.vy - ((plat && plat.vy) || 0);
  const okVy = vy <= CFG.LIM_VY, okVx = Math.abs(vx) <= CFG.LIM_VX, okAng = Math.abs(n.a) <= CFG.LIM_ANG;

  if (plat && !cascoTocou && okVy && okVx && okAng) {
    pousar(plat, vx, vy);
  } else {
    // Pé que entrou de lado: a rocha continua logo acima dele (parede)
    const deLado = pes.some(p => dentroRocha(p.x, p.y) && dentroRocha(p.x, p.y - 4));
    let motivo = 'NAVE INCLINADA DEMAIS';
    if (bateuMovel) motivo = 'BATEU NA PLATAFORMA';
    else if (deLado) motivo = 'BATEU NA PAREDE';
    else if (!plat) motivo = pesTocaram ? 'FORA DA PLATAFORMA' : 'COLISÃO COM O CASCO';
    else if (cascoTocou && okAng) motivo = 'COLISÃO COM O CASCO';
    else if (!okVy) motivo = 'IMPACTO VERTICAL FORTE';
    else if (!okVx) motivo = 'VELOCIDADE HORIZONTAL ALTA';
    explodir(motivo);
  }
}

// vx, vy: velocidades em relação à plataforma
function pousar(plat, vx, vy) {
  const n = nave;
  // Quão longe dos limites foi o pouso (0 = parado e reto, 1 = no limite)
  const r = Math.max(0, vy / CFG.LIM_VY, Math.abs(vx) / CFG.LIM_VX, Math.abs(n.a) / CFG.LIM_ANG);
  const perfeito = r < 0.4;
  const bonus = perfeito ? 300 : Math.round(150 * (1 - r));
  // Assenta a nave na plataforma; nas móveis ela vai junto
  const pes = PES.map(p => naveMundo(p[0], p[1]));
  n.y -= Math.max(pes[0].y, pes[1].y) - plat.y + 0.01;
  n.vx = n.vy = 0; n.propulsor = n.latE = n.latD = false;
  n.apoio = { p: plat, dx: n.x - plat.x0, dy: n.y - plat.y };

  // Pouso em sequência: antes da última, a nave para, pontua e decola de novo
  const ent = terreno.entrega;
  if (ent && !(plat.seq === 2 && ent.atual === 2)) {
    if (plat.seq === ent.atual) {
      const pts = 100 * (ent.atual + 1) + bonus;
      jogo.pontos += pts;
      ent.atual++;
      jogo.aviso = { l1: 'POUSO ' + ent.atual + ' DE 3  +' + pts, l2: 'DECOLE PARA A ' + (ent.atual + 1), t: 3 };
      somPouso(perfeito);
    } else {
      jogo.aviso = { l1: plat.seq < ent.atual ? 'ESTA JÁ FOI' : 'FORA DE ORDEM', l2: 'VÁ PARA A ' + (ent.atual + 1), t: 3 };
      bipe(330, 0.2, 'triangle', 0.15);
    }
    return;
  }
  if (ent) ent.atual = 3;

  const base = plat.mult * Math.round(jogo.comb / 4);
  jogo.pontos += base + bonus;
  salvarRecorde();
  jogo.estado = 'pousou'; jogo.tEstado = 0;
  jogo.resultado = { perfeito, mult: plat.mult, comb: Math.round(jogo.comb), base, bonus };
  somPouso(perfeito);
}

function explodir(motivo) {
  const n = nave;
  // Cada segmento da nave vira um destroço que gira e se espalha
  for (const l of NAVE_LINHAS) {
    const p1 = naveMundo(l[0], l[1]), p2 = naveMundo(l[2], l[3]);
    const mx = (p1.x + p2.x) / 2, my = (p1.y + p2.y) / 2;
    destrocos.push({
      x: mx, y: my, hx: (p2.x - p1.x) / 2, hy: (p2.y - p1.y) / 2, ang: 0,
      va: aleat(-8, 8),
      vx: n.vx * 0.35 + (mx - n.x) * aleat(2, 5) + aleat(-25, 25),
      vy: Math.min(n.vy, 30) * 0.3 + (my - n.y) * aleat(2, 4) - aleat(10, 35),
    });
  }
  for (let i = 0; i < 45; i++) {
    const ang = aleat(0, Math.PI * 2), v = aleat(30, 150);
    faiscas.push({ x: n.x, y: n.y, vx: Math.cos(ang) * v, vy: Math.sin(ang) * v - 40, vida: aleat(0.5, 1.4) });
  }
  n.propulsor = n.latE = n.latD = false;
  const semComb = jogo.comb <= 0;
  jogo.comb = Math.max(0, jogo.comb - CFG.PENALIDADE);
  const fim = jogo.comb <= 0;
  if (fim) salvarRecorde();
  jogo.estado = 'destruida'; jogo.tEstado = 0;
  jogo.resultado = { motivo, fim, semComb };
  somExplosao();
}

function atualizarDestrocos(dt) {
  if (!destrocos.length && !faiscas.length) return;
  const g = dadosFase(jogo.fase).g;
  for (const d of destrocos) {
    d.ang += d.va * dt;
    // Nasceu dentro da rocha: sobe até sair
    if (dentroRocha(d.x, d.y)) { d.y -= 1; d.vy = Math.min(d.vy, 0); continue; }
    d.vy += g * dt;
    const nx = d.x + d.vx * dt, ny = d.y + d.vy * dt;
    if (dentroRocha(nx, d.y)) d.vx *= -0.3; else d.x = nx;
    if (dentroRocha(d.x, ny)) { d.vy *= -0.35; d.vx *= 0.7; d.va *= 0.7; } else d.y = ny;
  }
  for (const f of faiscas) {
    f.vy += g * dt; f.x += f.vx * dt; f.y += f.vy * dt; f.vida -= dt;
  }
  faiscas = faiscas.filter(f => f.vida > 0);
}

// =====================================================================
// 10. CÂMERA COM ZOOM AUTOMÁTICO
// =====================================================================
const cam = { x: CFG.MUNDO_L / 2, y: CFG.MUNDO_A / 2, zoom: 1, fator: 1, chao: NaN };

function zoomBase() {
  const z = Math.min(cw / CFG.MUNDO_L, ch / CFG.MUNDO_A);
  // Em tela retrato, aproxima um pouco e segue a nave na horizontal
  return cw < ch ? Math.max(z, ch / CFG.MUNDO_A * 0.6) : z;
}

function atualizarCamera(dtReal) {
  const L = CFG.MUNDO_L, A = CFG.MUNDO_A;
  const zb = zoomBase();
  const emVoo = jogo.estado !== 'menu';
  if (jogo.estado === 'jogando') {
    // Zoom contínuo: quanto mais perto do terreno (abaixo e dos lados), maior.
    // Mede a distância real até a linha do terreno, que não salta na beira de
    // paredes e torres, e muda o zoom com velocidade limitada: aproxima devagar
    // e afasta um pouco mais rápido, sem o vaivém de antes.
    const r = (ch / zb) * CFG.ZOOM_ALCANCE;
    const alvo = clamp(r / Math.max(1, distObstaculos(nave.x, nave.y, r + 12) - 12), 1, CFG.ZOOM_FATOR);
    const dl = Math.log(alvo / cam.fator);
    cam.fator *= Math.exp(clamp(dl * (1 - Math.exp(-dtReal * 2)), -0.9 * dtReal, 0.45 * dtReal));
  }
  if (!emVoo) cam.fator = 1;

  const az = zb * cam.fator, vw = cw / az, vh = ch / az;
  let ax = emVoo ? nave.x : L / 2;
  // Chão de referência logo abaixo da nave, suavizado (salta na beira dos cânions e das saliências)
  if (emVoo) {
    const chao = Math.min(chaoComPlataformas(nave.x, nave.y), A);
    cam.chao = isFinite(cam.chao) ? cam.chao + (chao - cam.chao) * (1 - Math.exp(-dtReal * 2.5)) : chao;
  }
  // Chão a ~70% da altura da tela, sem deixar a nave sair por cima. Dentro da
  // caverna o teto também importa: a nave desce para perto do meio da tela
  const dentro = terreno.caverna ? clamp((nave.y - terreno.ceu) / 150, 0, 1) : 0;
  let ay = emVoo ? Math.min(cam.chao - vh * 0.2, nave.y + vh * (0.4 - 0.28 * dentro)) : Infinity;
  // Limita o alvo para não mostrar além das bordas do mundo
  ax = vw < L ? clamp(ax, vw / 2, L - vw / 2) : L / 2;
  ay = Math.min(ay, A + 10 - vh / 2);

  const k = 1 - Math.exp(-dtReal * 5);
  cam.zoom += (az - cam.zoom) * k;
  cam.x += (ax - cam.x) * k;
  cam.y += (ay - cam.y) * k;
  if (!isFinite(cam.zoom) || !isFinite(cam.x) || !isFinite(cam.y)) { cam.zoom = az; cam.x = ax; cam.y = ay; }
}

const telaX = x => (x - cam.x) * cam.zoom + cw / 2;
const telaY = y => (y - cam.y) * cam.zoom + ch / 2;

// =====================================================================
// 11. DESENHO DO MUNDO
// =====================================================================
function desenharMundo(cor, t) {
  const z = cam.zoom;
  ctx.save();
  ctx.setTransform(dpr * z, 0, 0, dpr * z, dpr * (cw / 2 - cam.x * z), dpr * (ch / 2 - cam.y * z));

  // Estrelas: pontos simples, sem brilho
  ctx.shadowBlur = 0;
  ctx.fillStyle = cor;
  const tam = 1.6 / z;
  for (const e of estrelas) {
    ctx.globalAlpha = e.b * (0.7 + 0.3 * Math.sin(t * e.f + e.p));
    ctx.fillRect(e.x, e.y, tam, tam);
  }
  ctx.globalAlpha = 1;

  // Poeira levada pelo vento: riscos na direção do vento
  if (terreno.vento && jogo.estado !== 'menu') {
    ctx.globalAlpha = 0.45;
    ctx.strokeStyle = cor; ctx.lineWidth = 1 / z;
    ctx.beginPath();
    for (const p of poeira) {
      if (Math.abs(p.v) < 0.5 || dentroRocha(p.x, p.y)) continue;
      ctx.moveTo(p.x, p.y); ctx.lineTo(p.x - p.v * 2.2 * p.k, p.y);
    }
    ctx.stroke();
    ctx.globalAlpha = 1;
  }

  // Brilho de monitor vetorial
  ctx.shadowBlur = 7 * dpr;
  ctx.shadowColor = cor;
  ctx.strokeStyle = cor;
  ctx.lineJoin = 'round'; ctx.lineCap = 'round';

  // Terreno: uma única linha contínua
  const p = terreno.pts;
  ctx.lineWidth = 1.4 / z;
  ctx.beginPath();
  ctx.moveTo(p[0].x, p[0].y);
  for (let i = 1; i < p.length; i++) ctx.lineTo(p[i].x, p[i].y);
  ctx.stroke();

  // Plataformas reforçadas
  ctx.lineWidth = 3.2 / z;
  ctx.beginPath();
  for (const pl of terreno.plataformas) { ctx.moveTo(pl.x0, pl.y); ctx.lineTo(pl.x1, pl.y); }
  ctx.stroke();

  // Plataformas móveis: casco por baixo e dois propulsores acesos
  ctx.lineWidth = 1.4 / z;
  ctx.beginPath();
  for (const pl of terreno.plataformas) {
    if (!pl.mov) continue;
    const { x0, x1, y } = pl;
    ctx.moveTo(x0, y); ctx.lineTo(x0 + 6, y + 7); ctx.lineTo(x1 - 6, y + 7); ctx.lineTo(x1, y);
    for (const bx of [x0 + 12, x1 - 12]) {
      const len = aleat(4, 9);
      ctx.moveTo(bx - 2.5, y + 7); ctx.lineTo(bx + aleat(-1, 1), y + 7 + len); ctx.lineTo(bx + 2.5, y + 7);
    }
  }
  ctx.stroke();

  // Rochas dos vulcões, com um rastro curto
  if (rochas.length) {
    ctx.beginPath();
    for (const r of rochas) {
      for (let i = 0; i <= 6; i++) {
        const a = r.ang + i * Math.PI / 3, k = r.r * r.forma[i % 6];
        if (i) ctx.lineTo(r.x + Math.cos(a) * k, r.y + Math.sin(a) * k); else ctx.moveTo(r.x + Math.cos(a) * k, r.y + Math.sin(a) * k);
      }
      ctx.moveTo(r.x - r.vx * 0.06, r.y - r.vy * 0.06); ctx.lineTo(r.x - r.vx * 0.16, r.y - r.vy * 0.16);
    }
    ctx.stroke();
  }

  if (jogo.estado === 'jogando' || jogo.estado === 'pousou') desenharNave(cor, z);

  // Destroços e faíscas
  if (destrocos.length) {
    ctx.lineWidth = 1.4 / z;
    ctx.beginPath();
    for (const d of destrocos) {
      const c = Math.cos(d.ang), s = Math.sin(d.ang);
      const hx = d.hx * c - d.hy * s, hy = d.hx * s + d.hy * c;
      ctx.moveTo(d.x - hx, d.y - hy); ctx.lineTo(d.x + hx, d.y + hy);
    }
    ctx.stroke();
  }
  if (faiscas.length) {
    ctx.lineWidth = 1.2 / z;
    ctx.beginPath();
    for (const f of faiscas) { ctx.moveTo(f.x, f.y); ctx.lineTo(f.x - f.vx * 0.03, f.y - f.vy * 0.03); }
    ctx.stroke();
  }
  ctx.restore();
}

function desenharNave(cor, z) {
  const n = nave;
  ctx.save();
  ctx.translate(n.x, n.y);
  ctx.rotate(n.a);
  ctx.lineWidth = 1.3 / z;
  ctx.beginPath();
  for (const l of NAVE_LINHAS) { ctx.moveTo(l[0], l[1]); ctx.lineTo(l[2], l[3]); }
  ctx.stroke();

  // Chamas: linhas que mudam aleatoriamente a cada quadro
  ctx.beginPath();
  if (n.propulsor) {
    const len = aleat(9, 22);
    ctx.moveTo(-4, 7); ctx.lineTo(aleat(-2.5, 2.5), 7 + len); ctx.lineTo(4, 7);
    ctx.moveTo(-1.5, 7); ctx.lineTo(aleat(-1, 1), 7 + len * aleat(0.4, 0.7)); ctx.lineTo(1.5, 7);
  }
  if (n.latD) { // empurra para a direita: chama sai pela esquerda
    const len = aleat(5, 11);
    ctx.moveTo(-11, -2); ctx.lineTo(-11 - len, aleat(-1, 1)); ctx.lineTo(-11, 2);
  }
  if (n.latE) {
    const len = aleat(5, 11);
    ctx.moveTo(11, -2); ctx.lineTo(11 + len, aleat(-1, 1)); ctx.lineTo(11, 2);
  }
  ctx.stroke();
  ctx.restore();
}

// Rótulo da plataforma: multiplicador ou, no pouso em sequência, a ordem (OK se já foi)
function rotulo(p) {
  if (p.seq === undefined) return 'x' + p.mult;
  return p.seq < terreno.entrega.atual ? 'OK' : String(p.seq + 1);
}
// Rótulos sob as plataformas (em coordenadas de tela); o próximo pouso da sequência pisca
function desenharRotulosPlataformas(cor, u) {
  const ent = terreno.entrega;
  for (const p of terreno.plataformas) {
    if (ent && p.seq === ent.atual && jogo.estado === 'jogando' && !piscar(2)) continue;
    texto(rotulo(p), telaX((p.x0 + p.x1) / 2), telaY(p.y) + (p.mov ? 13 : 6) + u, u, 'centro', cor);
  }
}

// Setas na borda da tela apontando as plataformas que ficaram fora do quadro (zoom)
function desenharSetasPlataformas(cor, u) {
  if (jogo.estado !== 'jogando') return;
  const m = 9 * u, cx = cw / 2, cy = ch / 2;
  const x0 = m + seguro.esq, x1 = cw - m - seguro.dir;
  const y0 = Math.max(m + seguro.topo, ch * 0.22);
  const y1 = ch - m - (jogo.toque ? layoutToque()[2].r * 2 + 18 : 0);
  const k = 3.5 * u, uT = u * 0.85;
  ctx.lineWidth = Math.max(1, u * 0.5); ctx.strokeStyle = cor;
  for (const p of terreno.plataformas) {
    const px = telaX((p.x0 + p.x1) / 2), py = telaY(p.y);
    if (px > 0 && px < cw && py > 0 && py < ch) continue;
    if (p.seq !== undefined && p.seq < terreno.entrega.atual) continue;
    const dx = px - cx, dy = py - cy;
    const t = Math.min(dx > 0 ? (x1 - cx) / dx : dx < 0 ? (x0 - cx) / dx : Infinity,
                       dy > 0 ? (y1 - cy) / dy : dy < 0 ? (y0 - cy) / dy : Infinity);
    const sx = cx + dx * t, sy = cy + dy * t, a = Math.atan2(dy, dx), c = Math.cos(a), s = Math.sin(a);
    ctx.beginPath();
    ctx.moveTo(sx - c * k * 1.6 - s * k, sy - s * k * 1.6 + c * k);
    ctx.lineTo(sx, sy);
    ctx.lineTo(sx - c * k * 1.6 + s * k, sy - s * k * 1.6 - c * k);
    ctx.closePath();
    ctx.stroke();
    texto(rotulo(p), sx - c * k * 3.6, sy - s * k * 3.6 - 3 * uT, uT, 'centro', cor);
  }
}

// Seta indicando a nave quando ela sobe acima da tela
function desenharIndicadorAcima(cor, u) {
  if (jogo.estado !== 'jogando') return;
  const sy = telaY(nave.y);
  if (sy > -10) return;
  const sx = clamp(telaX(nave.x), 20, cw - 20), y0 = ch * 0.2;
  ctx.beginPath();
  ctx.moveTo(sx - 3 * u, y0 + 3 * u); ctx.lineTo(sx, y0); ctx.lineTo(sx + 3 * u, y0 + 3 * u);
  ctx.lineWidth = Math.max(1, u * 0.5); ctx.strokeStyle = cor; ctx.stroke();
}

// =====================================================================
// 12. HUD, MENSAGENS E BOTÕES (tela)
// =====================================================================
const uHUD = () => clamp(Math.min(cw, ch) / 330, 1.25, 2.6);

function desenharHUD(cor, u) {
  const n = nave, m = 14, lh = 11 * u, colL = 21 * 6 * u;
  const tamBotoes = 4 * (Math.max(30, u * 13) + 8) + 12 + seguro.dir;
  const estreito = m + colL * 2 + 4 * 6 * u + tamBotoes > cw;
  const baixo = jogo.comb > 0 && jogo.comb < CFG.COMB_MAX * CFG.COMB_BAIXO;
  const seg = Math.floor(jogo.tempo);
  const alt = jogo.estado === 'jogando' ? Math.max(0, Math.round(altitude())) : 0;
  const vx = Math.round(n.vx), vy = Math.round(n.vy);
  const graus = Math.round(Math.abs(n.a) * 180 / Math.PI);
  const f = dadosFase(jogo.fase);

  const col1 = [
    ['PONTOS', String(jogo.pontos).padStart(5, '0')],
    ['TEMPO', String(Math.floor(seg / 60)).padStart(2, '0') + ':' + String(seg % 60).padStart(2, '0')],
    ['COMBUSTÍVEL', String(Math.round(jogo.comb)), baixo || jogo.comb <= 0, baixo],
    ['FASE', jogo.fase + ' ' + f.nome],
  ];
  const col2 = [
    ['ALTITUDE', String(alt)],
    ['VEL HORIZ', Math.abs(vx) + ' ' + (vx > 0 ? '→' : vx < 0 ? '←' : ' '), Math.abs(n.vx) > CFG.LIM_VX],
    ['VEL VERT', Math.abs(vy) + ' ' + (vy > 0 ? '↓' : vy < 0 ? '↑' : ' '), n.vy > CFG.LIM_VY, true],
    ['ÂNGULO', graus + '°', Math.abs(n.a) > CFG.LIM_ANG],
  ];
  if (terreno.vento) {
    const v = ventoEm(n.x, n.y), va = Math.round(Math.abs(v));
    col2.push(['VENTO', va + ' ' + (va === 0 ? ' ' : v > 0 ? '→' : '←')]);
  }
  if (terreno.entrega) col2.push(['POUSOS', Math.min(3, terreno.entrega.atual) + ' DE 3']);
  const linha = (row, x, y) => {
    const [rot, val, alerta, pisca] = row;
    texto(rot, x, y, u, 'esq', cor);
    if (alerta && pisca && jogo.estado === 'jogando' && !piscar(4)) return;
    texto(val, x + colL, y, u, 'dir', alerta ? COR_ALERTA : cor);
  };
  col1.forEach((r, i) => linha(r, m, m + i * lh));
  // Barra de combustível
  const by = m + col1.length * lh;
  ctx.beginPath();
  ctx.rect(m, by, colL, 3 * u);
  ctx.lineWidth = 1; ctx.strokeStyle = cor; ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(m + 1.5, by + 1.5 * u);
  ctx.lineTo(m + 1.5 + (colL - 3) * (jogo.comb / CFG.COMB_MAX), by + 1.5 * u);
  ctx.lineWidth = Math.max(1, u); ctx.strokeStyle = baixo ? COR_ALERTA : cor; ctx.stroke();

  const x2 = estreito ? m : m + colL + 4 * 6 * u;
  const y2 = estreito ? by + 3 * u + lh * 0.8 : m;
  col2.forEach((r, i) => linha(r, x2, y2 + i * lh));
  jogo.hudFim = Math.max(by + 3 * u, y2 + col2.length * lh); // as mensagens começam abaixo
}

function desenharMensagens(cor, u) {
  const cx = cw / 2, maxL = cw - 32;
  const y0 = Math.max(ch * 0.3, (jogo.hudFim || 0) + u * 8); // abaixo do painel, que no celular é mais alto
  let y = y0;
  const uG = u * 2, r = jogo.resultado;
  const linhaTxt = (s, uu, c = cor) => { const k = textoCabe(s, cx, y, uu, 'centro', c, maxL); y += k * 6 + uu * 5; };
  const prompt = jogo.toque ? 'TOQUE' : 'ENTER';

  // Abertura da fase: número, astro, tipo de relevo e dica
  if (jogo.estado === 'jogando' && !jogo.pausado && jogo.aviso) {
    const k = textoCabe(jogo.aviso.l1, cx, y0, u * 1.5, 'centro', cor, maxL);
    textoCabe(jogo.aviso.l2, cx, y0 + k * 6 + u * 5, u, 'centro', cor, maxL);
  } else if (jogo.estado === 'jogando' && jogo.tEstado < 3 && !jogo.pausado) {
    const k = textoCabe('FASE ' + jogo.fase, cx, y0, uG, 'centro', cor, maxL);
    textoCabe(dadosFase(jogo.fase).nome + ' - ' + terreno.nome, cx, y0 + k * 6 + u * 5, u, 'centro', cor, maxL);
    if (terreno.dica) textoCabe(terreno.dica, cx, y0 + k * 6 + u * 16, u, 'centro', cor, maxL);
  }
  if (jogo.estado === 'jogando' && jogo.comb <= 0 && piscar(2.5)) {
    textoCabe('SEM COMBUSTÍVEL', cx, ch * 0.22, uG, 'centro', COR_ALERTA, maxL);
  }
  if (jogo.estado === 'pousou') {
    linhaTxt(r.perfeito ? 'POUSO PERFEITO' : 'POUSO SEGURO', uG);
    linhaTxt('PLATAFORMA x' + r.mult + '  COMBUSTÍVEL ' + r.comb + '  +' + r.base, u);
    linhaTxt('BÔNUS POUSO SUAVE +' + r.bonus, u);
    if (jogo.tEstado > 0.8 && piscar(1.5)) linhaTxt(prompt + ' PARA A PRÓXIMA FASE', u);
  }
  if (jogo.estado === 'destruida') {
    linhaTxt('A NAVE FOI DESTRUÍDA', uG, COR_ALERTA);
    linhaTxt(r.motivo, u);
    if (r.semComb) linhaTxt('SEM COMBUSTÍVEL', u, COR_ALERTA);
    else linhaTxt('PENALIDADE -' + CFG.PENALIDADE + ' DE COMBUSTÍVEL', u);
    if (r.fim) {
      y += u * 4;
      linhaTxt('FIM DE JOGO', uG);
      linhaTxt('PONTUAÇÃO FINAL ' + jogo.pontos + '   RECORDE ' + jogo.recorde, u);
    }
    const yPrompt = y;
    if (jogo.tEstado > 1.2 && piscar(1.5)) linhaTxt(prompt + (r.fim ? ' PARA RECOMEÇAR' : ' PARA TENTAR DE NOVO'), u);
    // Fim de jogo: botão para voltar à lista de jogos (posição fixa, o aviso acima pisca)
    if (r.fim && jogo.tEstado > 1.2 && !jogo.pausado) desenharBotaoJogos(cor, u, cx, yPrompt + u * 15, true);
  }
  if (jogo.pausado) {
    y = ch * 0.42;
    linhaTxt('PAUSA', uG);
    linhaTxt('P OU ' + prompt + ' PARA CONTINUAR', u);
    desenharBotaoJogos(cor, u, cx, y + u * 4, true);
  }
}

function desenharMenu(cor, u) {
  const cx = cw / 2, maxL = cw - 32;
  const itens = itensMenu().map(it => it.txt);
  let y = Math.max(20, ch / 2 - (78 + (itens.length - 4) * 8) * u);
  let k = textoCabe('LUNAR LANDER', cx, y, u * 3.2, 'centro', cor, maxL);
  y += k * 6 + u * 5;
  textoCabe('MÓDULO DE POUSO VETORIAL', cx, y, u, 'centro', cor, maxL);
  y += u * 16;

  jogo.itensMenu = [];
  const uI = u * 1.35;
  itens.forEach((s, i) => {
    const w = largTexto(s, uI);
    texto(s, cx, y, uI, 'centro', cor);
    if (i === jogo.menuSel) {
      texto('>', cx - w / 2 - 10 * uI, y, uI, 'esq', cor);
      texto('<', cx + w / 2 + 6 * uI, y, uI, 'esq', cor);
    }
    jogo.itensMenu.push({ x: cx - w / 2 - 14 * uI, y: y - 4 * uI, w: w + 28 * uI, h: 14 * uI, i });
    y += uI * 6 + u * 8;
  });

  y += u * 6;
  const ajuda = [
    jogo.modo === 'classico' ? '← → GIRAM A NAVE    ↑ OU ESPAÇO: PROPULSOR'
                             : '← → EMPUXO LATERAL    ↑ OU ESPAÇO: SOBE / FREIA',
    'P PAUSA   R REINICIA   M MUDO   G COR   ESC MENU',
    'POUSE NA PLATAFORMA: VEL VERT < ' + CFG.LIM_VY + '  HORIZ < ' + CFG.LIM_VX + '  ÂNGULO < 8°',
  ];
  for (const s of ajuda) { k = textoCabe(s, cx, y, u * 0.9, 'centro', cor, maxL); y += k * 6 + u * 5; }
  if (jogo.recorde > 0) textoCabe('RECORDE ' + jogo.recorde, cx, y + u * 4, u, 'centro', cor, maxL);
}

// Botões do canto superior direito (pausa, som, reiniciar, menu)
function desenharBotoesTopo(cor, u) {
  const bs = Math.round(Math.max(30, u * 13)), gap = 8;
  const ids = jogo.estado === 'menu' ? ['som'] : ['pausa', 'som', 'reiniciar', 'menu'];
  let x = cw - 12 - seguro.dir - bs;
  const y = 12 + seguro.topo;
  ctx.lineWidth = Math.max(1, u * 0.5);
  ctx.strokeStyle = cor;
  for (const id of ids) {
    jogo.botoes.push({ id, x, y, w: bs, h: bs, tipo: 'tocar' });
    ctx.globalAlpha = 0.55;
    ctx.beginPath(); ctx.rect(x, y, bs, bs); ctx.stroke();
    ctx.globalAlpha = 1;
    ctx.beginPath();
    iconeBotao(id, x, y, bs);
    ctx.stroke();
    x -= bs + gap;
  }
}

// Botão "⌂ JOGOS": volta à lista de jogos. Só aparece fora da partida em
// andamento (menu, pausa, fim de jogo). centro: x é o meio do botão.
function desenharBotaoJogos(cor, u, x, y, centro = false) {
  const bs = Math.round(Math.max(30, u * 13)), uT = bs / 14;
  const w = bs * 0.85 + largTexto('JOGOS', uT) + bs * 0.3;
  if (centro) x -= w / 2;
  jogo.botoes.push({ id: 'jogos', x, y, w, h: bs, tipo: 'tocar' });
  ctx.lineWidth = Math.max(1, u * 0.5);
  ctx.strokeStyle = cor;
  ctx.globalAlpha = 0.55;
  ctx.beginPath(); ctx.rect(x, y, w, bs); ctx.stroke();
  ctx.globalAlpha = 1;
  ctx.beginPath();
  iconeBotao('jogos', x, y, bs);
  ctx.stroke();
  texto('JOGOS', x + bs * 0.85, y + bs / 2 - 3 * uT, uT, 'esq', cor);
}

function iconeBotao(id, x, y, s) {
  const P = (a, b) => [x + a * s, y + b * s];
  const linha = pts => { ctx.moveTo(...P(...pts[0])); for (let i = 1; i < pts.length; i++) ctx.lineTo(...P(...pts[i])); };
  if (id === 'pausa') {
    if (jogo.pausado) { linha([[0.36, 0.28], [0.72, 0.5], [0.36, 0.72], [0.36, 0.28]]); }
    else { linha([[0.38, 0.28], [0.38, 0.72]]); linha([[0.62, 0.28], [0.62, 0.72]]); }
  } else if (id === 'som') {
    linha([[0.2, 0.42], [0.34, 0.42], [0.5, 0.27], [0.5, 0.73], [0.34, 0.58], [0.2, 0.58], [0.2, 0.42]]);
    if (jogo.mudo) { linha([[0.6, 0.4], [0.78, 0.6]]); linha([[0.78, 0.4], [0.6, 0.6]]); }
    else {
      for (const r of [0.14, 0.24]) {
        const cx = x + 0.5 * s, cy = y + 0.5 * s;
        ctx.moveTo(cx + r * s * Math.cos(-0.8), cy + r * s * Math.sin(-0.8));
        ctx.arc(cx, cy, r * s, -0.8, 0.8);
      }
    }
  } else if (id === 'reiniciar') {
    const cx = x + 0.5 * s, cy = y + 0.5 * s, r = 0.22 * s;
    const a0 = -Math.PI / 2 + 0.5, a1 = Math.PI * 1.5 - 0.35;
    ctx.moveTo(cx + r * Math.cos(a0), cy + r * Math.sin(a0));
    ctx.arc(cx, cy, r, a0, a1);
    const ex = cx + r * Math.cos(a1), ey = cy + r * Math.sin(a1);
    const tx = -Math.sin(a1), ty = Math.cos(a1); // tangente no sentido horário
    const k = 0.11 * s;
    ctx.moveTo(ex - tx * k - ty * k, ey - ty * k + tx * k);
    ctx.lineTo(ex, ey);
    ctx.lineTo(ex - tx * k + ty * k, ey - ty * k - tx * k);
  } else if (id === 'menu') {
    for (const b of [0.32, 0.5, 0.68]) linha([[0.27, b], [0.73, b]]);
  } else if (id === 'jogos') { // casinha
    linha([[0.2, 0.5], [0.5, 0.24], [0.8, 0.5]]);
    linha([[0.3, 0.42], [0.3, 0.76], [0.7, 0.76], [0.7, 0.42]]);
    linha([[0.44, 0.76], [0.44, 0.6], [0.56, 0.6], [0.56, 0.76]]);
  }
}

// Controles de toque (esquerda, direita, propulsor)
function layoutToque() {
  const r = clamp(Math.min(cw, ch) * 0.1, 32, 60), m = 18;
  return [
    { id: 'esq', cx: m + r, cy: ch - m - r, r },
    { id: 'dir', cx: m + r * 3.4, cy: ch - m - r, r },
    { id: 'cima', cx: cw - m - r * 1.2, cy: ch - m - r * 1.2, r: r * 1.2 },
  ];
}
function desenharControlesToque(cor) {
  if (!jogo.toque || jogo.estado !== 'jogando' || jogo.pausado) return;
  const ativos = new Set(ponteiros.values());
  const glifo = { esq: '←', dir: '→', cima: '↑' };
  for (const b of layoutToque()) {
    jogo.botoes.push({ ...b, tipo: 'segurar' });
    ctx.globalAlpha = ativos.has(b.id) ? 1 : 0.45;
    ctx.beginPath(); ctx.arc(b.cx, b.cy, b.r, 0, Math.PI * 2);
    ctx.lineWidth = 1.5; ctx.strokeStyle = cor; ctx.stroke();
    const u = b.r / 6;
    texto(glifo[b.id], b.cx, b.cy - 3 * u, u, 'centro', cor);
  }
  ctx.globalAlpha = 1;
}

// =====================================================================
// 13. QUADRO COMPLETO
// =====================================================================
function desenhar() {
  const t = performance.now() / 1000;
  const cor = corAtual(), u = uHUD();
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.shadowBlur = 0;
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, cw, ch);

  desenharMundo(cor, t);

  // Camada de tela, também com brilho
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.shadowBlur = 6 * dpr;
  ctx.shadowColor = cor;
  ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  jogo.botoes = [];

  desenharRotulosPlataformas(cor, Math.max(1.2, u * 0.85));
  if (jogo.estado === 'menu') {
    desenharMenu(cor, u);
    desenharBotaoJogos(cor, u, 12 + seguro.esq, 12 + seguro.topo);
  } else {
    desenharHUD(cor, u);
    desenharIndicadorAcima(cor, u);
    desenharSetasPlataformas(cor, u);
    desenharMensagens(cor, u);
    desenharControlesToque(cor);
  }
  desenharBotoesTopo(cor, u);
}

// =====================================================================
// 14. ENTRADA: TECLADO, MOUSE E TOQUE
// =====================================================================
const TECLAS_BLOQUEADAS = ['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space'];

window.addEventListener('keydown', e => {
  iniciarAudio();
  if (TECLAS_BLOQUEADAS.includes(e.code)) e.preventDefault();
  teclas[e.code] = true;
  if (e.repeat) return;
  const menu = jogo.estado === 'menu';
  switch (e.code) {
    case 'KeyP': alternarPausa(); break;
    case 'KeyM': alternarMudo(); break;
    case 'KeyG': alternarCor(); break;
    case 'KeyR': if (!menu) reiniciar(); break;
    case 'Escape': if (!menu) irMenu(); break;
    case 'Enter': case 'NumpadEnter': case 'Space': avancar(); break;
    case 'ArrowUp': if (menu) { const n = itensMenu().length; jogo.menuSel = (jogo.menuSel + n - 1) % n; } break;
    case 'ArrowDown': if (menu) jogo.menuSel = (jogo.menuSel + 1) % itensMenu().length; break;
    case 'ArrowLeft': case 'ArrowRight': if (menu && jogo.menuSel > 0) ativarItemMenu(jogo.menuSel, e.code === 'ArrowLeft' ? -1 : 1); break;
  }
});
window.addEventListener('keyup', e => { teclas[e.code] = false; });

// Perdeu o foco: solta as teclas e pausa
function soltarTudo() {
  for (const k in teclas) teclas[k] = false;
  ponteiros.clear();
  if (jogo.estado === 'jogando') jogo.pausado = true;
}
window.addEventListener('blur', soltarTudo);
document.addEventListener('visibilitychange', () => { if (document.hidden) soltarTudo(); });

function acharBotao(x, y) {
  for (const b of jogo.botoes) {
    if (b.tipo === 'segurar') { if (Math.hypot(x - b.cx, y - b.cy) <= b.r * 1.15) return b; }
    else if (x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h) return b;
  }
  return null;
}

// Tela cheia em aparelhos de toque. Pedida no pointerup (o pointerdown de toque
// não conta como gesto do usuário no Chrome) e só para toques que começaram fora
// da partida em andamento: menu, pausa, fim de fase. Sem trava de orientação:
// o jogo se adapta a retrato e paisagem (ver zoomBase).
const toquesForaDoJogo = new Set();
function pedirTelaCheia() {
  if (saindo || document.fullscreenElement || document.webkitFullscreenElement) return;
  const el = document.documentElement;
  try {
    const p = el.requestFullscreen ? el.requestFullscreen({ navigationUI: 'hide' })
                                   : el.webkitRequestFullscreen && el.webkitRequestFullscreen();
    if (p && p.catch) p.catch(() => {});
  } catch (e) {}
}

tela.addEventListener('pointerdown', e => {
  e.preventDefault();
  iniciarAudio();
  if (e.pointerType === 'touch') {
    jogo.toque = true;
    if (jogo.estado !== 'jogando' || jogo.pausado) toquesForaDoJogo.add(e.pointerId);
  }
  const b = acharBotao(e.clientX, e.clientY);
  if (b) {
    if (b.tipo === 'segurar') { ponteiros.set(e.pointerId, b.id); tela.setPointerCapture?.(e.pointerId); }
    else if (b.id === 'jogos') voltarAosJogos();
    else if (b.id === 'pausa') alternarPausa();
    else if (b.id === 'som') alternarMudo();
    else if (b.id === 'reiniciar') reiniciar();
    else if (b.id === 'menu') irMenu();
    return;
  }
  if (jogo.estado === 'menu') {
    const it = jogo.itensMenu.find(r => e.clientX >= r.x && e.clientX <= r.x + r.w && e.clientY >= r.y && e.clientY <= r.y + r.h);
    if (it) { jogo.menuSel = it.i; ativarItemMenu(it.i); }
    return;
  }
  avancar();
});
// Permite deslizar o dedo entre os botões esquerda/direita
tela.addEventListener('pointermove', e => {
  if (!ponteiros.has(e.pointerId)) return;
  const b = acharBotao(e.clientX, e.clientY);
  if (b && b.tipo === 'segurar') ponteiros.set(e.pointerId, b.id);
});
const soltarPonteiro = e => ponteiros.delete(e.pointerId);
tela.addEventListener('pointerup', soltarPonteiro);
tela.addEventListener('pointercancel', soltarPonteiro);
tela.addEventListener('pointerup', e => { if (toquesForaDoJogo.delete(e.pointerId)) pedirTelaCheia(); });
tela.addEventListener('pointercancel', e => toquesForaDoJogo.delete(e.pointerId));
// Mouse sobre o botão de jogos: dica
tela.addEventListener('pointermove', e => {
  if (e.pointerType !== 'mouse') return;
  const b = acharBotao(e.clientX, e.clientY);
  tela.title = b && b.id === 'jogos' ? 'Voltar aos jogos' : '';
});
tela.addEventListener('contextmenu', e => e.preventDefault());

// =====================================================================
// 15. LOOP PRINCIPAL (requestAnimationFrame + passo fixo)
// =====================================================================
let ultimoQuadro = performance.now(), acumulado = 0;
function quadro(agora) {
  const dt = Math.min(0.25, (agora - ultimoQuadro) / 1000);
  ultimoQuadro = agora;
  if (!jogo.pausado) {
    acumulado += dt;
    while (acumulado >= CFG.PASSO) { atualizar(CFG.PASSO); acumulado -= CFG.PASSO; }
  } else {
    acumulado = 0;
  }
  atualizarCamera(dt);
  atualizarSom();
  desenhar();
  requestAnimationFrame(quadro);
}

// Início: terreno de fundo para o menu
novaFase(1);
novaNave();
jogo.estado = 'menu';
requestAnimationFrame(quadro);
</script>
